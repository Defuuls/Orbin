<svg width="1200" height="760" viewBox="0 0 1200 760" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Orbin settings screenshot</title>
  <desc id="desc">Screenshot-style Orbin 128 Rei settings: always-on content filter, appearance controls, media, network privacy, and Downloads/Orbin storage.</desc>
  <rect width="1200" height="760" fill="#F6F7FB"/>

  <!-- Phone frame -->
  <rect x="420" y="40" width="360" height="680" rx="36" fill="#15161B"/>
  <rect x="432" y="54" width="336" height="652" rx="28" fill="#FAFBFF"/>

  <!-- App bar -->
  <rect x="432" y="54" width="336" height="72" rx="28" fill="#EDF1FF"/>
  <circle cx="460" cy="90" r="16" fill="#D9E2FF"/>
  <path d="M465 84L458 90L465 96" stroke="#27304D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="492" y="98" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#1D2233">Settings</text>

  <!-- CONTENT -->
  <text x="456" y="156" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#3157B8">CONTENT</text>
  <rect x="456" y="168" width="288" height="52" rx="12" fill="#FFFFFF"/>
  <text x="472" y="190" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#202431">Subscriptions</text>
  <text x="472" y="208" font-family="Arial,sans-serif" font-size="12" fill="#6B7180">Manage subscribed boards</text>

  <rect x="456" y="228" width="288" height="52" rx="12" fill="#FFFFFF"/>
  <text x="472" y="250" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#202431">Run setup again</text>
  <text x="472" y="268" font-family="Arial,sans-serif" font-size="12" fill="#6B7180">Subscriptions and privacy</text>

  <rect x="456" y="288" width="288" height="52" rx="12" fill="#FFFFFF"/>
  <text x="472" y="310" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#202431">Built-in content filter</text>
  <text x="472" y="328" font-family="Arial,sans-serif" font-size="12" fill="#6B7180">Gore, shock, violent content</text>
  <rect x="652" y="304" width="76" height="22" rx="11" fill="#EDF1FF"/>
  <text x="690" y="319" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="700" fill="#3157B8">ALWAYS ON</text>

  <!-- APPEARANCE -->
  <text x="456" y="372" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#3157B8">APPEARANCE</text>
  <text x="456" y="400" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#202431">Theme</text>
  <!-- Segmented control: equal 80px chips, centered labels -->
  <rect x="456" y="412" width="80" height="30" rx="15" fill="#DCE6FF"/>
  <text x="496" y="432" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#274B9F">System</text>
  <rect x="544" y="412" width="80" height="30" rx="15" fill="#FFFFFF" stroke="#D7DCE7"/>
  <text x="584" y="432" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#434958">Light</text>
  <rect x="632" y="412" width="80" height="30" rx="15" fill="#FFFFFF" stroke="#D7DCE7"/>
  <text x="672" y="432" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#434958">Dark</text>

  <rect x="456" y="456" width="288" height="48" rx="12" fill="#FFFFFF"/>
  <text x="472" y="486" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#202431">Dynamic color</text>
  <rect x="690" y="470" width="36" height="20" rx="10" fill="#3157B8"/>
  <circle cx="714" cy="480" r="8" fill="#FFFFFF"/>

  <!-- MEDIA -->
  <text x="456" y="538" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#3157B8">MEDIA</text>
  <rect x="456" y="550" width="288" height="48" rx="12" fill="#FFFFFF"/>
  <text x="472" y="580" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#202431">Autoplay videos</text>
  <rect x="690" y="564" width="36" height="20" rx="10" fill="#CCD3E0"/>
  <circle cx="702" cy="574" r="8" fill="#FFFFFF"/>

  <text x="456" y="632" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#202431">Threads per board</text>
  <rect x="456" y="644" width="52" height="30" rx="15" fill="#FFFFFF" stroke="#D7DCE7"/>
  <text x="482" y="664" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#434958">6</text>
  <rect x="518" y="644" width="52" height="30" rx="15" fill="#DCE6FF"/>
  <text x="544" y="664" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#274B9F">12</text>
  <rect x="580" y="644" width="52" height="30" rx="15" fill="#FFFFFF" stroke="#D7DCE7"/>
  <text x="606" y="664" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#434958">18</text>
  <rect x="642" y="644" width="52" height="30" rx="15" fill="#FFFFFF" stroke="#D7DCE7"/>
  <text x="668" y="664" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#434958">All</text>

  <!-- Right callouts -->
  <rect x="820" y="120" width="240" height="140" rx="24" fill="#FFFFFF"/>
  <text x="844" y="164" font-family="Arial,sans-serif" font-size="17" font-weight="800" fill="#202431">Network privacy</text>
  <text x="844" y="192" font-family="Arial,sans-serif" font-size="13" fill="#596171">DNS-over-HTTPS provider</text>
  <rect x="844" y="210" width="90" height="28" rx="14" fill="#DCE6FF"/>
  <text x="862" y="229" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#274B9F">NextDNS</text>

  <rect x="820" y="288" width="240" height="140" rx="24" fill="#FFFFFF"/>
  <text x="844" y="332" font-family="Arial,sans-serif" font-size="17" font-weight="800" fill="#202431">Storage</text>
  <text x="844" y="360" font-family="Arial,sans-serif" font-size="13" fill="#596171">Saved media folder picker</text>
  <rect x="844" y="378" width="140" height="28" rx="14" fill="#E8F6EF"/>
  <text x="860" y="397" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#226642">Downloads/Orbin</text>

  <!-- Left logo card: even 24px rhythm, no skeleton bars -->
  <rect x="120" y="140" width="260" height="400" rx="28" fill="#FFFFFF"/>
  <text x="148" y="188" font-family="Arial,sans-serif" font-size="28" font-weight="900" fill="#202431">Orbin</text>
  <text x="148" y="220" font-family="Arial,sans-serif" font-size="14" fill="#596171">Modern imageboard</text>
  <text x="148" y="242" font-family="Arial,sans-serif" font-size="14" fill="#596171">browser for Android</text>
  <rect x="148" y="268" width="132" height="32" rx="16" fill="#DCE6FF"/>
  <text x="214" y="289" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="800" fill="#274B9F">Version 128</text>
  <text x="148" y="336" font-family="Arial,sans-serif" font-size="13" fill="#596171">• Color themes on Next</text>
  <text x="148" y="364" font-family="Arial,sans-serif" font-size="13" fill="#596171">• Mild → Wild sizing</text>
  <text x="148" y="392" font-family="Arial,sans-serif" font-size="13" fill="#596171">• Encrypted at rest</text>
  <text x="148" y="448" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#3157B8">Rei release</text>
</svg>
