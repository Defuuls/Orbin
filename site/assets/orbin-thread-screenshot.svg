<svg width="1200" height="760" viewBox="0 0 1200 760" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Orbin thread viewer screenshot</title>
  <desc id="desc">A screenshot-style view of the Orbin Android thread viewer showing reply cards with relative post times such as "just now", "5m", and "2h", tappable quote links, and callouts for relative timestamps and accessible links.</desc>
  <rect width="1200" height="760" fill="#F6F7FB"/>

  <!-- Left info panel -->
  <rect x="150" y="152" width="212" height="360" rx="28" fill="#FFFFFF"/>
  <text x="182" y="200" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="900" fill="#202431">Orbin</text>
  <text x="182" y="230" font-family="Inter, Arial, sans-serif" font-size="15" fill="#596171">Modern image board client</text>
  <rect x="182" y="262" width="150" height="34" rx="17" fill="#DCE6FF"/>
  <text x="204" y="284" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800" fill="#274B9F">Version 91</text>
  <rect x="182" y="326" width="146" height="12" rx="6" fill="#E5E9F2"/>
  <rect x="182" y="350" width="112" height="12" rx="6" fill="#E5E9F2"/>
  <rect x="182" y="374" width="150" height="12" rx="6" fill="#E5E9F2"/>
  <rect x="182" y="398" width="96" height="12" rx="6" fill="#E5E9F2"/>
  <text x="182" y="470" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#3157B8">Bucatini release</text>

  <!-- Phone frame -->
  <rect x="412" y="42" width="376" height="676" rx="36" fill="#15161B"/>
  <rect x="424" y="56" width="352" height="648" rx="28" fill="#FAFBFF"/>

  <!-- Top app bar -->
  <rect x="424" y="56" width="352" height="76" rx="28" fill="#EDF1FF"/>
  <path d="M461 86L451 96L461 106" stroke="#27304D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="480" y="102" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#1D2233">Thread</text>
  <!-- action icons: grid, download, bookmark -->
  <rect x="662" y="88" width="7" height="7" rx="1.6" fill="#5B6274"/>
  <rect x="672" y="88" width="7" height="7" rx="1.6" fill="#5B6274"/>
  <rect x="662" y="98" width="7" height="7" rx="1.6" fill="#5B6274"/>
  <rect x="672" y="98" width="7" height="7" rx="1.6" fill="#5B6274"/>
  <path d="M704 88v13M698 95l6 6 6-6" stroke="#5B6274" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M734 88h12v16l-6-5-6 5z" fill="#3157B8"/>

  <!-- Original post card -->
  <rect x="440" y="148" width="320" height="172" rx="14" fill="#FFFFFF" stroke="#E9EDF6"/>
  <text x="458" y="180" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800" fill="#3157B8">Anonymous</text>
  <text x="546" y="180" font-family="Inter, Arial, sans-serif" font-size="12" fill="#9098A8">No.882041</text>
  <text x="744" y="180" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#596171">2h</text>
  <rect x="458" y="196" width="86" height="86" rx="9" fill="#C9D6F5"/>
  <circle cx="501" cy="239" r="15" fill="#15161B" fill-opacity="0.5"/>
  <path d="M496 231l11 8-11 8z" fill="#FFFFFF"/>
  <text x="558" y="216" font-family="Inter, Arial, sans-serif" font-size="13" fill="#4E9A51">&gt;be me, comfy thread</text>
  <text x="558" y="240" font-family="Inter, Arial, sans-serif" font-size="13" fill="#3A4050">thoughts on the new build?</text>
  <text x="558" y="264" font-family="Inter, Arial, sans-serif" font-size="13" fill="#3157B8">&gt;&gt;882039</text>
  <rect x="558" y="269" width="56" height="1.5" fill="#3157B8"/>
  <text x="558" y="288" font-family="Inter, Arial, sans-serif" font-size="13" fill="#3A4050">the timestamps help a lot</text>

  <!-- Reply card 1 -->
  <rect x="440" y="336" width="320" height="120" rx="14" fill="#FFFFFF" stroke="#E9EDF6"/>
  <text x="458" y="368" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800" fill="#3157B8">Anonymous</text>
  <text x="546" y="368" font-family="Inter, Arial, sans-serif" font-size="12" fill="#9098A8">No.882043</text>
  <text x="744" y="368" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#596171">5m</text>
  <text x="458" y="396" font-family="Inter, Arial, sans-serif" font-size="13" fill="#3157B8">&gt;&gt;882041</text>
  <rect x="458" y="401" width="56" height="1.5" fill="#3157B8"/>
  <text x="458" y="420" font-family="Inter, Arial, sans-serif" font-size="13" fill="#3A4050">this. reads so much cleaner now</text>
  <text x="458" y="442" font-family="Inter, Arial, sans-serif" font-size="13" fill="#4E9A51">&gt;tfw it's accessible too</text>

  <!-- Reply card 2 -->
  <rect x="440" y="472" width="320" height="108" rx="14" fill="#FFFFFF" stroke="#E9EDF6"/>
  <text x="458" y="504" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800" fill="#3157B8">Anonymous</text>
  <text x="546" y="504" font-family="Inter, Arial, sans-serif" font-size="12" fill="#9098A8">No.882050</text>
  <text x="744" y="504" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#3157B8">just now</text>
  <text x="458" y="532" font-family="Inter, Arial, sans-serif" font-size="13" fill="#3157B8">https://orbin.app</text>
  <rect x="458" y="537" width="112" height="1.5" fill="#3157B8"/>
  <text x="458" y="556" font-family="Inter, Arial, sans-serif" font-size="13" fill="#3A4050">links open right from the post</text>

  <!-- Right feature callout: relative post times -->
  <rect x="824" y="150" width="216" height="150" rx="24" fill="#FFFFFF"/>
  <circle cx="862" cy="188" r="15" fill="none" stroke="#274B9F" stroke-width="2.5"/>
  <path d="M862 179v9l6 4" stroke="#274B9F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="846" y="234" font-family="Inter, Arial, sans-serif" font-size="16.5" font-weight="800" fill="#202431">Relative post times</text>
  <text x="846" y="255" font-family="Inter, Arial, sans-serif" font-size="12.5" fill="#596171">Post age at a glance</text>
  <rect x="846" y="266" width="172" height="26" rx="13" fill="#DCE6FF"/>
  <text x="862" y="283" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#274B9F">just now · 5m · 2h</text>

  <!-- Right feature callout: accessible links -->
  <rect x="824" y="324" width="216" height="150" rx="24" fill="#FFFFFF"/>
  <path transform="translate(846,358) scale(1.2)" fill="#274B9F" d="M3.9 12c0-1.71 1.39-3.1 3.1-3.1h4V7H7c-2.76 0-5 2.24-5 5s2.24 5 5 5h4v-1.9H7c-1.71 0-3.1-1.39-3.1-3.1zM8 13h8v-2H8v2zm5-6v1.9h4c1.71 0 3.1 1.39 3.1 3.1s-1.39 3.1-3.1 3.1h-4V17h4c2.76 0 5-2.24 5-5s-2.24-5-5-5h-4z"/>
  <text x="846" y="410" font-family="Inter, Arial, sans-serif" font-size="16.5" font-weight="800" fill="#202431">Accessible links</text>
  <text x="846" y="431" font-family="Inter, Arial, sans-serif" font-size="12.5" fill="#596171">Announced by TalkBack</text>
  <rect x="846" y="442" width="176" height="26" rx="13" fill="#E8F6EF"/>
  <text x="862" y="459" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#226642">Quote links &amp; URLs</text>
</svg>
