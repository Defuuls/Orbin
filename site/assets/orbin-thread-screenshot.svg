<svg width="1200" height="760" viewBox="0 0 1200 760" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Orbin thread viewer screenshot</title>
  <desc id="desc">A screenshot-style view of the Orbin 155 Ugli Android thread viewer showing the Posts and Files toggle, thread watch alerts, and reply cards with relative post times.</desc>
  <rect width="1200" height="760" fill="#F6F7FB"/>

  <!-- Left logo card -->
  <rect x="120" y="140" width="260" height="420" rx="28" fill="#FFFFFF"/>
  <text x="148" y="188" font-family="Arial,sans-serif" font-size="28" font-weight="900" fill="#202431">Orbin</text>
  <text x="148" y="220" font-family="Arial,sans-serif" font-size="14" fill="#596171">Modern imageboard</text>
  <text x="148" y="242" font-family="Arial,sans-serif" font-size="14" fill="#596171">browser for Android</text>
  <rect x="148" y="268" width="132" height="32" rx="16" fill="#DCE6FF"/>
  <text x="214" y="289" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="800" fill="#274B9F">Version 155</text>
  <text x="148" y="336" font-family="Arial,sans-serif" font-size="13" fill="#596171">• Posts &amp; Files views</text>
  <text x="148" y="364" font-family="Arial,sans-serif" font-size="13" fill="#596171">• Thread watch alerts</text>
  <text x="148" y="392" font-family="Arial,sans-serif" font-size="13" fill="#596171">• Relative post timestamps</text>
  <text x="148" y="420" font-family="Arial,sans-serif" font-size="13" fill="#596171">• Save external links</text>
  <text x="148" y="472" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#3157B8">Ugli release</text>

  <!-- Phone frame (x 412–788, centered) -->
  <rect x="412" y="36" width="376" height="688" rx="36" fill="#15161B"/>
  <rect x="424" y="48" width="352" height="664" rx="28" fill="#FAFBFF"/>

  <defs>
    <clipPath id="thread-screen-clip">
      <rect x="424" y="48" width="352" height="664" rx="28"/>
    </clipPath>
  </defs>

  <g clip-path="url(#thread-screen-clip)">
    <!-- Header -->
    <circle cx="448" cy="74" r="3.5" fill="#3157B8"/>
    <text x="456" y="78" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#3157B8">/g/</text>
    <text x="478" y="78" font-family="Arial,sans-serif" font-size="12" fill="#717A8C">5 posts</text>
    <text x="444" y="104" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#1D2233">Anyone else running a home server on ARM?</text>

    <!-- Segmented control (Posts | Files) + Bell icon -->
    <rect x="444" y="118" width="260" height="36" rx="18" fill="#F0F2F7"/>
    <rect x="446" y="120" width="128" height="32" rx="16" fill="#E8DCF8"/>
    <text x="510" y="141" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#202431">Posts</text>
    <text x="640" y="141" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#5A6272">Files</text>

    <!-- Bell icon (Watch thread) -->
    <circle cx="734" cy="136" r="14" fill="#F0F2F7"/>
    <path d="M734 129a4 4 0 0 0-4 4v4l-1.5 1.5v1h11v-1l-1.5-1.5v-4a4 4 0 0 0-4-4zm-1.5 12a1.5 1.5 0 0 0 3 0h-3z" fill="#4B5366"/>

    <!-- OP Card -->
    <rect x="440" y="168" width="320" height="248" rx="14" fill="#FFFFFF" stroke="#E9EDF6"/>
    <text x="456" y="190" font-family="Arial,sans-serif" font-size="11.5" fill="#717A8C">No.4471028</text>
    <text x="526" y="190" font-family="Arial,sans-serif" font-size="11.5" fill="#717A8C">14:02</text>
    <rect x="566" y="178" width="58" height="18" rx="9" fill="#F0F2F7"/>
    <text x="595" y="191" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="600" fill="#5A6272">6 replies</text>
    <text x="744" y="190" text-anchor="end" font-family="Arial,sans-serif" font-size="11.5" font-weight="700" fill="#3157B8">2h</text>
    <text x="456" y="212" font-family="Arial,sans-serif" font-size="12" fill="#202431">Been running a small NAS on an ARM board</text>
    <text x="456" y="228" font-family="Arial,sans-serif" font-size="12" fill="#202431">for about eight months now. Idle draw is under</text>
    <text x="456" y="244" font-family="Arial,sans-serif" font-size="12" fill="#202431">four watts and it has not fallen over once.</text>
    <!-- Media preview in soft pink -->
    <rect x="456" y="256" width="288" height="144" rx="10" fill="#FAD1D8"/>

    <!-- Reply Card 1 -->
    <rect x="440" y="428" width="320" height="88" rx="14" fill="#FFFFFF" stroke="#E9EDF6"/>
    <rect x="448" y="438" width="3" height="68" rx="1.5" fill="#7C9DE6"/>
    <text x="460" y="450" font-family="Arial,sans-serif" font-size="11.5" fill="#717A8C">No.4471033</text>
    <text x="530" y="450" font-family="Arial,sans-serif" font-size="11.5" fill="#717A8C">14:09</text>
    <text x="744" y="450" text-anchor="end" font-family="Arial,sans-serif" font-size="11.5" font-weight="700" fill="#5A6272">5m</text>
    <text x="460" y="474" font-family="Arial,sans-serif" font-size="12" fill="#202431">Which board? The cheap ones tend to have</text>
    <text x="460" y="492" font-family="Arial,sans-serif" font-size="12" fill="#202431">terrible SATA.</text>

    <!-- Reply Card 2 -->
    <rect x="440" y="528" width="320" height="106" rx="14" fill="#FFFFFF" stroke="#E9EDF6"/>
    <rect x="448" y="538" width="3" height="86" rx="1.5" fill="#7C9DE6"/>
    <text x="460" y="550" font-family="Arial,sans-serif" font-size="11.5" fill="#717A8C">No.4471040</text>
    <text x="530" y="550" font-family="Arial,sans-serif" font-size="11.5" fill="#717A8C">14:15</text>
    <rect x="570" y="538" width="58" height="18" rx="9" fill="#F0F2F7"/>
    <text x="599" y="551" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="600" fill="#5A6272">2 replies</text>
    <text x="744" y="550" text-anchor="end" font-family="Arial,sans-serif" font-size="11.5" font-weight="700" fill="#3157B8">just now</text>
    <text x="460" y="574" font-family="Arial,sans-serif" font-size="12" fill="#202431">Not the one you are thinking of. It has a</text>
    <text x="460" y="592" font-family="Arial,sans-serif" font-size="12" fill="#202431">proper PCIe lane rather than USB behind a bridge,</text>
    <text x="460" y="610" font-family="Arial,sans-serif" font-size="12" fill="#202431">which is the whole difference.</text>

    <!-- Floating Top/Bottom pill -->
    <rect x="670" y="654" width="82" height="32" rx="16" fill="#EDE4F4" stroke="#D8C8E8"/>
    <text x="688" y="674" font-family="Arial,sans-serif" font-size="10.5" font-weight="600" fill="#3D3050">Top</text>
    <text x="724" y="674" font-family="Arial,sans-serif" font-size="10.5" font-weight="600" fill="#3D3050">Bottom</text>
  </g>

  <!-- Right callouts -->
  <rect x="824" y="140" width="240" height="150" rx="24" fill="#FFFFFF"/>
  <circle cx="862" cy="174" r="14" fill="#EDF1FF"/>
  <rect x="855" y="169" width="6" height="10" rx="1.5" fill="#274B9F"/>
  <rect x="863" y="169" width="6" height="10" rx="1.5" fill="#90A5DC"/>
  <text x="844" y="210" font-family="Arial,sans-serif" font-size="17" font-weight="800" fill="#202431">Posts &amp; Files view</text>
  <text x="844" y="234" font-family="Arial,sans-serif" font-size="13" fill="#596171">Switch between thread</text>
  <text x="844" y="254" font-family="Arial,sans-serif" font-size="13" fill="#596171">replies and all media files</text>
  <rect x="844" y="266" width="124" height="26" rx="13" fill="#DCE6FF"/>
  <text x="906" y="283" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#274B9F">One-tap toggle</text>

  <rect x="824" y="324" width="240" height="150" rx="24" fill="#FFFFFF"/>
  <circle cx="862" cy="358" r="14" fill="#EDF1FF"/>
  <path d="M862 351a4 4 0 0 0-4 4v4l-1.5 1.5v1h11v-1l-1.5-1.5v-4a4 4 0 0 0-4-4zm-1.5 12a1.5 1.5 0 0 0 3 0h-3z" fill="#274B9F"/>
  <text x="844" y="394" font-family="Arial,sans-serif" font-size="17" font-weight="800" fill="#202431">Thread watching</text>
  <text x="844" y="418" font-family="Arial,sans-serif" font-size="13" fill="#596171">Get alerts on new replies &amp;</text>
  <text x="844" y="438" font-family="Arial,sans-serif" font-size="13" fill="#596171">glanceable post ages</text>
  <rect x="844" y="450" width="160" height="26" rx="13" fill="#E8F6EF"/>
  <text x="924" y="467" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#226642">just now · 5m · 2h</text>
</svg>
