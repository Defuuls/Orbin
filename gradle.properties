# Project-wide Gradle settings.

# JVM memory + GC tuning for a multi-module Compose build.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8

# Performance
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configureondemand=true

# Kotlin
kotlin.code.style=official
kotlin.incremental=true

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true
# Note: android.defaults.buildfeatures.buildconfig / resvalues were removed in AGP 9
# (both are the default there); modules opt in per-build-file via buildFeatures instead.

# Disable unused build features by default (opted in per-module).
android.library.defaults.buildfeatures.androidresources=false

# Newest release on the Netty 4.1 line, applied as a security override to both the plugin
# classpath and project configurations. Lives here because `buildscript {}` is evaluated before
# any top-level declaration in build.gradle.kts, so the two scopes cannot share a Kotlin constant.
orbin.nettyVersion=4.1.136.Final

# The protobuf override was pinned to 3.25.5, which fixes CVE-2024-7254 but predates the
# `RuntimeVersion` class that AGP's Unified Test Platform requires — so forcing it made every
# instrumentation test die with NoClassDefFoundError the moment one actually ran. 4.x carries the
# same CVE fix (4.28.3+) and the class. Same scoping reason as Netty above.
orbin.protobufVersion=4.35.1

# The shipped version, declared once and read by both application modules. Two APKs mean two
# places this could be written, and two places is how a version bump gets half-applied — which has
# already happened here once: v85 through v89 all shipped versionCode 107 because the bump was
# missed. Bump it here and both APKs move together.
orbin.versionCode=114
orbin.versionName=96-Linguine

# Orbin Minimal versions on its own line, starting at 1. It is a separate app with its own
# release cadence, so tying it to the full client's number would say something untrue: that the
# two ship together and that a jump from 1 to 114 meant something happened. Each app has exactly
# one authoritative version here, which is what keeps a bump from being half-applied.
orbin.minimalVersionCode=1
orbin.minimalVersionName=1
