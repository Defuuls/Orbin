name: Record audit goldens

on:
  push:
    branches:
      - audit/efficiency-qol
    paths:
      - '.github/workflows/record-audit-goldens.yml'

permissions:
  contents: write

jobs:
  record:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: audit/efficiency-qol

      - name: Set up JDK 17
        uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Record UI goldens
        run: ./gradlew :ui-next:recordRoborazziDebug

      - name: Commit intended goldens
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ui-next/src/test/screenshots
          if git diff --cached --quiet; then
            echo 'No golden changes to commit'
            exit 0
          fi
          git commit -m 'test: update audited UI goldens'
          git push origin HEAD:audit/efficiency-qol
