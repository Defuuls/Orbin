name: iOS

# Builds the iOS app on macOS: the native Kotlin tests on the iOS simulator, then the Xcode
# project for the simulator. No signing, so it needs no secrets and runs on every PR or main
# push that can change what the iOS app compiles. Uploading to TestFlight is testflight.yml.
on:
  push:
    branches: [main]
    paths: &ios-paths
      - 'app-ios/**'
      - 'iosApp/**'
      - 'ui-next/**'
      - 'core/designsystem/**'
      - 'core/ui/**'
      - 'core/model/**'
      - 'core/common/**'
      - 'domain/**'
      - 'provider/**'
      - 'storage/**'
      - 'core/data/**'
      - 'core/graph/**'
      - 'core/network/**'
      - 'build-logic/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/ios.yml'
  pull_request:
    paths: *ios-paths
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: iOS app (simulator)
    # Apple silicon, so the arm64 simulator tests run natively.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Kotlin's standalone simulator mode omits system services, including Keychain.
      # Pick a device and start booting it before JDK/Gradle setup, then wait for
      # bootstatus only when the suites are about to run.
      - name: Start booting simulator with system services
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess

          listing = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "--json"]))
          candidates = [
              device
              for runtime, devices in listing["devices"].items() if ".iOS-" in runtime
              for device in devices if device.get("isAvailable") and device["name"].startswith("iPhone")
          ]
          if not candidates:
              raise SystemExit("No available iPhone simulator runtime")
          device = candidates[0]
          if device["state"] != "Booted":
              subprocess.run(["xcrun", "simctl", "boot", device["udid"]], check=True)
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write("ORBIN_IOS_TEST_DEVICE=" + device["udid"] + "\n")
          PY

      - name: Set up JDK and Gradle
        uses: ./.github/actions/setup-jdk-gradle

      - name: Cache Kotlin/Native compiler
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            konan-${{ runner.os }}-${{ runner.arch }}-

      - name: Wait for simulator system services
        run: xcrun simctl bootstatus "$ORBIN_IOS_TEST_DEVICE" -b

      - name: Shared tests on the iOS simulator
        # Native suites only: iosTest (UIKit/AVKit) and the shared database over the
        # driver the app opens it with. Shared app-ios logic runs in CI unit tests.
        # The booted UDID is passed as ORBIN_IOS_TEST_DEVICE so it is not a
        # configuration-cache key.
        run: ./gradlew :app-ios:iosSimulatorArm64Test :storage:iosSimulatorArm64Test

      - name: Set up XcodeGen
        uses: ./.github/actions/setup-xcodegen

      - name: Generate the Xcode project
        run: xcodegen --spec iosApp/project.yml

      - name: Build the app for the simulator
        run: >-
          xcodebuild build
          -project iosApp/Orbin.xcodeproj
          -scheme Orbin
          -configuration Debug
          -destination "platform=iOS Simulator,id=$ORBIN_IOS_TEST_DEVICE"
          -skipPackagePluginValidation
          CODE_SIGNING_ALLOWED=NO
          COMPILER_INDEX_STORE_ENABLE=NO
          ONLY_ACTIVE_ARCH=YES

      # Exercise UIApplication/UIScene startup, the real packaged fonts, and Compose accessibility.
      # Follow a SFW board, finish mandatory setup, and verify cold-launch persistence.
      # Explicit screenshots contain only onboarding metadata, before opening the live feed.
      - name: Launch the installed app and capture native startup screens
        timeout-minutes: 15
        run: >-
          xcodebuild test
          -project iosApp/Orbin.xcodeproj
          -scheme Orbin
          -configuration Debug
          -destination "platform=iOS Simulator,id=$ORBIN_IOS_TEST_DEVICE"
          -parallel-testing-enabled NO
          -only-testing:OrbinUITests/StartupSmokeTests
          -resultBundlePath "$RUNNER_TEMP/orbin-startup-smoke.xcresult"
          -skipPackagePluginValidation
          CODE_SIGNING_ALLOWED=NO
          COMPILER_INDEX_STORE_ENABLE=NO
          ONLY_ACTIVE_ARCH=YES

      - name: Export native startup screenshots
        if: always()
        run: |
          result="$RUNNER_TEMP/orbin-startup-smoke.xcresult"
          if [ -d "$result" ]; then
            xcrun xcresulttool export attachments \
              --path "$result" \
              --output-path "$RUNNER_TEMP/orbin-startup-screenshots"
          fi

      - name: Upload native startup evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-native-startup
          path: |
            ${{ runner.temp }}/orbin-startup-screenshots/**/*.png
            ${{ runner.temp }}/orbin-startup-screenshots/**/*.txt
            ${{ runner.temp }}/orbin-startup-screenshots/**/manifest.json
          if-no-files-found: ignore

      - name: Upload native startup result bundle
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-startup-xcresult
          path: ${{ runner.temp }}/orbin-startup-smoke.xcresult/
          if-no-files-found: ignore

      - name: Upload test reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-test-reports
          path: |
            app-ios/build/reports/tests/**
            app-ios/build/test-results/**
            storage/build/reports/tests/**
            storage/build/test-results/**
          if-no-files-found: ignore

      - name: Shut down test simulator
        if: always() && env.ORBIN_IOS_TEST_DEVICE != ''
        run: xcrun simctl shutdown "$ORBIN_IOS_TEST_DEVICE"
