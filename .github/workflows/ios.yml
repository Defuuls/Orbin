name: iOS

# Builds the iOS app on macOS: native tests and the app on the simulator, plus a separate
# Release archive for devices. No signing, so it needs no secrets and runs on every PR or main
# push that can change what the iOS app compiles. Uploading to TestFlight is testflight.yml.
on:
  push:
    branches: [main]
    paths: &ios-paths
      - 'app-ios/**'
      - 'iosApp/**'
      - 'ui-next/**'
      - 'core/designsystem/**'
      - 'core/ui/**'
      - 'core/reader/**'
      - 'core/model/**'
      - 'core/common/**'
      - 'domain/**'
      - 'provider/**'
      - 'storage/**'
      - 'core/data/**'
      - 'core/graph/**'
      - 'core/network/**'
      - 'build-logic/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - 'CHANGELOG.md'
      - 'scripts/prepare_ios_framework_metadata.py'
      - 'scripts/tests/test_prepare_ios_framework_metadata.py'
      - 'scripts/prepare_ios_purpose_strings.py'
      - 'scripts/tests/test_prepare_ios_purpose_strings.py'
      - 'scripts/boot_ios_simulator.py'
      - 'scripts/tests/test_boot_ios_simulator.py'
      - '.github/actions/setup-jdk-gradle/**'
      - '.github/actions/setup-xcodegen/**'
      - '.github/workflows/ios.yml'
      - '.github/workflows/testflight.yml'
      - '.github/workflows/testflight-notes.yml'
  pull_request:
    paths: *ios-paths
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release-archive:
    name: iOS app (Release archive)
    # Match TestFlight's runner and memory budget for the optimized device framework link.
    runs-on: macos-26-intel
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK and Gradle
        uses: ./.github/actions/setup-jdk-gradle

      - name: Set up XcodeGen
        uses: ./.github/actions/setup-xcodegen

      - name: Generate the Xcode project
        run: xcodegen --spec iosApp/project.yml

      - name: Configure Gradle for the Release archive
        run: |
          gradle_user_home="${GRADLE_USER_HOME:-$HOME/.gradle}"
          mkdir -p "$gradle_user_home"
          cat >> "$gradle_user_home/gradle.properties" <<'PROPERTIES'

          org.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -XX:+ExitOnOutOfMemoryError -Dfile.encoding=UTF-8
          org.gradle.workers.max=1
          org.gradle.parallel=false
          PROPERTIES
          mkdir -p "$gradle_user_home/init.d"
          cat > "$gradle_user_home/init.d/orbin-archive-diagnostics.gradle" <<'INIT'
          gradle.settingsEvaluated {
              println("Orbin archive Gradle: maxHeapMiB=" + (Runtime.runtime.maxMemory() / 1024 / 1024) +
                  "; workers=" + gradle.startParameter.maxWorkerCount +
                  "; parallel=" + gradle.startParameter.parallelProjectExecutionEnabled)
          }
          INIT
          uname -m
          sysctl -n hw.memsize
          xcodebuild -version
          java -version
          printf '%s\n' \
            'org.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -XX:+ExitOnOutOfMemoryError -Dfile.encoding=UTF-8' \
            'org.gradle.workers.max=1' \
            'org.gradle.parallel=false'

      - name: Archive the app for devices
        run: >-
          xcodebuild archive
          -project iosApp/Orbin.xcodeproj
          -scheme Orbin
          -configuration Release
          -destination 'generic/platform=iOS'
          -archivePath "$RUNNER_TEMP/Orbin.xcarchive"
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO

      - name: Prepare and validate archived framework metadata
        shell: bash
        run: |
          python3 scripts/prepare_ios_framework_metadata.py "$RUNNER_TEMP/Orbin.xcarchive" \
            | tee "$RUNNER_TEMP/orbin-framework-metadata.json"

      # No --spec: this archive is built from this commit's project.yml, so a missing string fails.
      - name: Check archived privacy purpose strings
        shell: bash
        run: python3 scripts/prepare_ios_purpose_strings.py "$RUNNER_TEMP/Orbin.xcarchive"

      - name: Upload archived framework metadata
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-release-framework-metadata
          path: ${{ runner.temp }}/orbin-framework-metadata.json
          if-no-files-found: ignore

  build:
    name: iOS app (simulator)
    # Apple silicon, so the arm64 simulator tests run natively.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Kotlin's standalone simulator mode omits system services, including Keychain.
      # Pick a modern WebM-capable runtime and start booting it before JDK/Gradle setup, then wait for
      # bootstatus only when the suites are about to run.
      - name: Start booting simulator with system services
        # Booting overlaps JDK/Gradle setup; bootstatus is awaited just before the suites run.
        run: python3 scripts/boot_ios_simulator.py --min-version 17.4

      - name: Set up JDK and Gradle
        uses: ./.github/actions/setup-jdk-gradle

      - name: Restore Kotlin/Native compiler cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            konan-${{ runner.os }}-${{ runner.arch }}-

      - name: Wait for simulator system services
        run: xcrun simctl bootstatus "$ORBIN_IOS_TEST_DEVICE" -b

      - name: Shared tests on the iOS simulator
        id: native_tests
        # Native suites only: iosTest (UIKit/AVKit) and the shared database over the
        # driver the app opens it with. Shared app-ios logic runs in CI unit tests.
        # The booted UDID is passed as ORBIN_IOS_TEST_DEVICE so it is not a
        # configuration-cache key.
        env:
          SIMCTL_CHILD_ORBIN_REQUIRE_WEBM_DECODE: "1"
          SIMCTL_CHILD_ORBIN_IOS_TEST_RUNTIME: ${{ env.ORBIN_IOS_TEST_RUNTIME }}
        run: ./gradlew :app-ios:iosSimulatorArm64Test :storage:iosSimulatorArm64Test

      - name: Set up XcodeGen
        id: setup_xcodegen
        # Collect independent Swift failures after native-test failures; the failed native step
        # still fails this job and blocks merging.
        if: ${{ !cancelled() && (steps.native_tests.outcome == 'success' || steps.native_tests.outcome == 'failure') }}
        uses: ./.github/actions/setup-xcodegen

      - name: Generate the Xcode project
        id: generate_project
        if: ${{ !cancelled() && steps.setup_xcodegen.outcome == 'success' }}
        run: xcodegen --spec iosApp/project.yml

      - name: Build the app for the simulator
        id: simulator_build
        if: ${{ !cancelled() && steps.generate_project.outcome == 'success' }}
        run: >-
          xcodebuild build
          -project iosApp/Orbin.xcodeproj
          -scheme Orbin
          -configuration Debug
          -destination "platform=iOS Simulator,id=$ORBIN_IOS_TEST_DEVICE"
          -skipPackagePluginValidation
          CODE_SIGNING_ALLOWED=NO
          COMPILER_INDEX_STORE_ENABLE=NO
          ONLY_ACTIVE_ARCH=YES

      # Exercise UIApplication/UIScene startup, the real packaged fonts, and Compose accessibility.
      # Follow a SFW board, finish mandatory setup, and verify cold-launch persistence.
      # Explicit screenshots contain only onboarding metadata, before opening the live feed.
      - name: Launch the installed app and capture native startup screens
        if: ${{ !cancelled() && steps.simulator_build.outcome == 'success' }}
        timeout-minutes: 15
        run: >-
          xcodebuild test
          -project iosApp/Orbin.xcodeproj
          -scheme Orbin
          -configuration Debug
          -destination "platform=iOS Simulator,id=$ORBIN_IOS_TEST_DEVICE"
          -parallel-testing-enabled NO
          -only-testing:OrbinUITests/StartupSmokeTests
          -only-testing:OrbinNativeTests
          -resultBundlePath "$RUNNER_TEMP/orbin-startup-smoke.xcresult"
          -skipPackagePluginValidation
          CODE_SIGNING_ALLOWED=NO
          COMPILER_INDEX_STORE_ENABLE=NO
          ONLY_ACTIVE_ARCH=YES

      - name: Collect native crash reports
        if: failure()
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import os
          import shutil
          from pathlib import Path

          diagnostic_home = Path.home()
          roots = [diagnostic_home / "Library/Logs/DiagnosticReports"]
          device = os.environ.get("ORBIN_IOS_TEST_DEVICE")
          if device:
              roots.append(diagnostic_home / "Library/Developer/CoreSimulator/Devices" / device /
                           "data/Library/Logs/CrashReporter")
          output = Path(os.environ["RUNNER_TEMP"]) / "orbin-native-crashes"
          output.mkdir(exist_ok=True)
          reports = {
              path for root in roots if root.exists() for path in root.rglob("*")
              if path.is_file() and path.suffix.lower() in {".ips", ".crash"}
              and any(name in path.name.lower() for name in ("orbin", "test", "kotlin"))
          }
          for index, path in enumerate(sorted(reports, key=lambda p: p.stat().st_mtime, reverse=True)[:25]):
              if path.stat().st_size <= 10 * 1024 * 1024:
                  shutil.copy2(path, output / f"{index:02d}-{path.name}")
          print(f"Collected {len(list(output.iterdir()))} native crash reports")
          PY

      - name: Upload native crash reports
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-native-crashes
          path: ${{ runner.temp }}/orbin-native-crashes/
          if-no-files-found: ignore

      - name: Export native startup screenshots
        if: always()
        run: |
          result="$RUNNER_TEMP/orbin-startup-smoke.xcresult"
          if [ -d "$result" ]; then
            xcrun xcresulttool export attachments \
              --path "$result" \
              --output-path "$RUNNER_TEMP/orbin-startup-screenshots"
          fi

      - name: Upload native startup evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-native-startup
          path: |
            ${{ runner.temp }}/orbin-startup-screenshots/**/*.png
            ${{ runner.temp }}/orbin-startup-screenshots/**/*.txt
            ${{ runner.temp }}/orbin-startup-screenshots/**/manifest.json
          if-no-files-found: ignore

      - name: Upload native startup result bundle
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-startup-xcresult
          path: ${{ runner.temp }}/orbin-startup-smoke.xcresult/
          if-no-files-found: ignore

      - name: Upload test reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-test-reports
          path: |
            app-ios/build/reports/tests/**
            app-ios/build/test-results/**
            storage/build/reports/tests/**
            storage/build/test-results/**
          if-no-files-found: ignore

      # Combined cache's post-save is `success()`-only, so a failed Gradle step
      # never wrote ~/.konan. Save explicitly so a later run can reuse the compiler.
      # Saved from main only; pull requests restore main's copy instead of adding duplicates.
      - name: Save Kotlin/Native compiler cache
        if: always() && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Shut down test simulator
        if: always() && env.ORBIN_IOS_TEST_DEVICE != ''
        run: xcrun simctl shutdown "$ORBIN_IOS_TEST_DEVICE"
