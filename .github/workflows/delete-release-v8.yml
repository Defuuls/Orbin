name: Delete the v8.0 release (one-off)

# Temporary: deletes the single release tagged v8.0 (immutable, so its mapping file could not be
# removed on its own). The git tag is kept. Removed again right after it runs.
on:
  push:
    branches:
      - claude/boards-alphabetical-sorting-2sepps
    paths:
      - .github/workflows/delete-release-v8.yml

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Delete release v8.0
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ID=$(gh api "repos/$REPO/releases/tags/v8.0" --jq '.id')
          echo "Release v8.0 is id $ID, with:"
          gh api "repos/$REPO/releases/$ID" --jq '.assets[].name'
          gh api -X DELETE "repos/$REPO/releases/$ID"
          echo "Deleted. Tag still present:"
          gh api "repos/$REPO/git/ref/tags/v8.0" --jq '.ref'
