name: CodeQL

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '24 8 * * 1'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze-java-kotlin:
    name: Analyze (java-kotlin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK and Gradle
        uses: ./.github/actions/setup-jdk-gradle
        with:
          cache-disabled: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual

      # CodeQL bundle 2.27.0 still rejects Kotlin 2.4.20 even though the public support matrix
      # already lists it. Keep the repository on the CVE-fixed compiler and downgrade only this
      # disposable, cache-disabled analysis workspace until the shipped extractor catches up.
      - name: Use CodeQL-compatible Kotlin compiler
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("gradle/libs.versions.toml")
          text = path.read_text()
          fixed = 'kotlin = "2.4.20"'
          compatible = 'kotlin = "2.4.10"'
          if fixed not in text:
              raise SystemExit("Expected Kotlin 2.4.20 version catalog entry was not found")
          path.write_text(text.replace(fixed, compatible, 1))
          PY

      - name: Build Android project
        run: ./gradlew clean assembleDebug --no-daemon --no-build-cache -Dorg.gradle.caching=false

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:java-kotlin

  analyze-actions:
    name: Analyze (actions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: actions

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:actions
