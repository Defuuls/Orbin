name: Performance

on:
  pull_request:
    paths:
      - 'app/**'
      - 'benchmark/**'
      - 'data/**'
      - 'domain/**'
      - 'feature/**'
      - 'media/**'
      - 'ui-next/**'
      - '.github/workflows/performance.yml'
  workflow_dispatch:

concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  benchmark-compile:
    name: Benchmark compile gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK and Gradle
        uses: ./.github/actions/setup-jdk-gradle
      - name: Compile macrobenchmark APKs
        run: ./gradlew :app:assembleDebug :benchmark:assemble

  macrobenchmark:
    name: Macrobenchmark metrics
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK and Gradle
        uses: ./.github/actions/setup-jdk-gradle
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Seed debug signing key
        run: |
          mkdir -p "$HOME/.config/.android"
          keytool -genkeypair -noprompt \
            -keystore "$HOME/.config/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000
          ./gradlew :app:assembleDebug
      - name: Run macrobenchmarks
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          # Emulator 37's gfxstream/SwiftShader path intermittently invalidates color buffers
          # during Compose-heavy macrobenchmarks on hosted Linux runners. Force the stable
          # software GLES path instead and disable snapshots so every run starts cleanly.
          emulator-options: -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # The benchmark target is deliberately a non-minified release build for repeatable CI
          # measurements. It is profileable, but does not carry the production profileable-by-shell
          # manifest flag. The baseline-profile generator is hardware-only and runs separately.
          script: >-
            ./gradlew :benchmark:connectedCheck
            -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.suppressErrors=EMULATOR,DEBUGGABLE,NOT-PROFILEABLE
            -Pandroid.testInstrumentationRunnerArguments.notClass=com.orbin.benchmark.BaselineProfileGenerator
      - name: Upload benchmark reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macrobenchmark-results
          path: |
            benchmark/build/outputs/connected_android_test_additional_output/**
            benchmark/build/reports/androidTests/**
          if-no-files-found: ignore
