name: Performance

on:
  pull_request:
    paths:
      - 'app/**'
      - 'benchmark/**'
      - 'data/**'
      - 'domain/**'
      - 'feature/**'
      - 'media/**'
      - 'ui-next/**'
      - '.github/workflows/performance.yml'
  workflow_dispatch:

concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  benchmark-compile:
    name: Benchmark compile gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Compile macrobenchmark APKs
        run: ./gradlew :app:assembleDebug :benchmark:assemble

  macrobenchmark:
    name: Macrobenchmark metrics
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Seed debug signing key
        run: ./gradlew :app:assembleDebug
      - name: Run macrobenchmarks
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew :benchmark:connectedCheck -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.suppressErrors=EMULATOR,DEBUGGABLE
      - name: Upload benchmark reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macrobenchmark-results
          path: |
            benchmark/build/outputs/connected_android_test_additional_output/**
            benchmark/build/reports/androidTests/**
          if-no-files-found: ignore
