name: Performance

on:
  pull_request:
    paths:
      - 'app/**'
      - 'benchmark/**'
      - 'core/model/**'
      - 'core/reader/**'
      - 'core/ui/**'
      - 'core/designsystem/**'
      - 'data/**'
      - 'domain/**'
      - 'feature/**'
      - 'media/**'
      - 'ui-next/**'
      - '.github/workflows/performance.yml'
  workflow_dispatch:

concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  benchmark-compile:
    name: Benchmark compile gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up JDK and Gradle
        uses: ./.github/actions/setup-jdk-gradle
      - name: Compile macrobenchmark APKs
        run: ./gradlew :app:assembleDebug && ./gradlew :app:assembleBenchmarkRelease :app:assembleNonMinifiedRelease :benchmark:assemble
      - name: Verify benchmark report validator
        run: python -m unittest discover -s benchmark/tests

  measure:
    name: Measure ${{ matrix.case }}
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Keep artifact transfer and the next method's ART reset on different emulators.
    # Every existing method and measured iteration still runs; the aggregate requires all seven.
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        case:
          - coldStartup
          - warmStartup
          - catalogListScrollFrames
          - catalogGridScrollFrames
          - threadScrollFrames
          - filesScrollFrames
          - twoPaneScrollRetentionFrames
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up JDK and Gradle
        uses: ./.github/actions/setup-jdk-gradle
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Seed debug signing key
        run: |
          mkdir -p "$HOME/.config/.android"
          keytool -genkeypair -noprompt \
            -keystore "$HOME/.config/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000
          ./gradlew :app:assembleDebug
      # The emulator runner downloads the system image itself, and that download now and then comes
      # back truncated ("unknown archive"), failing the job before a benchmark runs. As in
      # instrumentation.yml: cache the image, and install it with retries on a miss.
      - name: System image cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: sysimg-cache
        with:
          path: |
            /usr/local/lib/android/sdk/system-images/android-35
            /usr/local/lib/android/sdk/platforms/android-35
          key: sysimg-35-google_apis-x86_64

      - name: Install system image
        if: steps.sysimg-cache.outputs.cache-hit != 'true'
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          PACKAGES="system-images;android-35;google_apis;x86_64 platforms;android-35 emulator"
          for attempt in 1 2 3; do
            if yes | "$SDKMANAGER" --install $PACKAGES > /dev/null; then
              exit 0
            fi
            echo "sdkmanager attempt $attempt failed; clearing partial downloads" >&2
            rm -rf "$ANDROID_HOME/.temp" "$HOME/.android/cache"
            sleep $((attempt * 15))
          done
          exit 1

      - name: Run macrobenchmarks
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          # Match profile collection while 37.2.13's process-exit regression is investigated.
          # https://github.com/zeroc-ice/ice/issues/6984
          emulator-build: '16428233' # 37.2.12
          emulator-options: -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim -camera-back none -show-kernel
          disable-animations: true
          # One unchanged method per fresh emulator: real MainActivity startup or a populated
          # production-reader journey. Separate workers retain every measured iteration.
          # HOT stays available for physical-device runs: a hosted HOT start can relaunch no
          # Activity and produce no startup sample. Run one target variant, rather than both
          # benchmarkRelease and nonMinifiedRelease through connectedCheck.
          script: >-
            ./gradlew :benchmark:connectedBenchmarkReleaseAndroidTest
            -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.suppressErrors=EMULATOR,DEBUGGABLE,NOT-PROFILEABLE
            '-Pandroid.testInstrumentationRunnerArguments.class=com.orbin.benchmark.AppPerformanceBenchmark#${{ matrix.case }}'
      - name: Upload the measured case
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macrobenchmark-case-${{ matrix.case }}
          path: |
            benchmark/build/outputs/connected_android_test_additional_output/**
            benchmark/build/reports/androidTests/**
            benchmark/build/outputs/androidTest-results/**
          if-no-files-found: error
          overwrite: true
      - name: Upload case diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macrobenchmark-diagnostics-${{ matrix.case }}
          path: |
            benchmark/build/reports/androidTests/**
            benchmark/build/outputs/androidTest-results/**
          if-no-files-found: warn
          overwrite: true

  macrobenchmark:
    name: Macrobenchmark metrics
    if: always()
    needs: measure
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require all seven measurement jobs
        env:
          MEASUREMENT_RESULT: ${{ needs.measure.result }}
        run: test "$MEASUREMENT_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download this run's original case reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: macrobenchmark-case-*
          path: downloaded-metrics
          # Each case has the same report basenames. Preserve its directory and original bytes.
          merge-multiple: false
      - name: Validate all populated journeys and finite frame samples
        run: python benchmark/validate_reports.py downloaded-metrics
      - name: Upload validated original benchmark reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macrobenchmark-results
          path: downloaded-metrics/**
          if-no-files-found: error
          overwrite: true
