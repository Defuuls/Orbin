name: Performance

on:
  pull_request:
    paths:
      - 'app/**'
      - 'benchmark/**'
      - 'data/**'
      - 'domain/**'
      - 'feature/**'
      - 'media/**'
      - 'ui-next/**'
      - '.github/workflows/performance.yml'
  workflow_dispatch:

concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  benchmark-compile:
    name: Benchmark compile gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK and Gradle
        uses: ./.github/actions/setup-jdk-gradle
      - name: Compile macrobenchmark APKs
        run: ./gradlew :app:assembleDebug :benchmark:assemble

  macrobenchmark:
    name: Macrobenchmark metrics
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK and Gradle
        uses: ./.github/actions/setup-jdk-gradle
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Seed debug signing key
        run: |
          mkdir -p "$HOME/.config/.android"
          keytool -genkeypair -noprompt \
            -keystore "$HOME/.config/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000
          ./gradlew :app:assembleDebug
      # The emulator runner downloads the system image itself, and that download now and then comes
      # back truncated ("unknown archive"), failing the job before a benchmark runs. As in
      # instrumentation.yml: cache the image, and install it with retries on a miss.
      - name: System image cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: sysimg-cache
        with:
          path: |
            /usr/local/lib/android/sdk/system-images/android-35
            /usr/local/lib/android/sdk/platforms/android-35
          key: sysimg-35-google_apis-x86_64

      - name: Install system image
        if: steps.sysimg-cache.outputs.cache-hit != 'true'
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          PACKAGES="system-images;android-35;google_apis;x86_64 platforms;android-35 emulator"
          for attempt in 1 2 3; do
            if yes | "$SDKMANAGER" --install $PACKAGES > /dev/null; then
              exit 0
            fi
            echo "sdkmanager attempt $attempt failed; clearing partial downloads" >&2
            rm -rf "$ANDROID_HOME/.temp" "$HOME/.android/cache"
            sleep $((attempt * 15))
          done
          exit 1

      - name: Run macrobenchmarks
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # Hosted emulators cannot reliably produce HOT-start or feed frame samples: HOT may
          # relaunch no activity and an unseeded feed can contain no scrollable frames. Keep those
          # benchmarks in the suite for real-device runs, while PR CI gates the deterministic
          # cold/warm startup metrics. Run one build variant instead of connectedCheck's duplicate
          # benchmarkRelease + nonMinifiedRelease executions.
          script: >-
            ./gradlew :benchmark:connectedBenchmarkReleaseAndroidTest
            -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.suppressErrors=EMULATOR,DEBUGGABLE,NOT-PROFILEABLE
            -Pandroid.testInstrumentationRunnerArguments.class=com.orbin.benchmark.AppPerformanceBenchmark#coldStartup,com.orbin.benchmark.AppPerformanceBenchmark#warmStartup
      - name: Upload benchmark reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macrobenchmark-results
          path: |
            benchmark/build/outputs/connected_android_test_additional_output/**
            benchmark/build/reports/androidTests/**
          if-no-files-found: ignore
