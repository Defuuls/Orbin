name: TestFlight

# Archives the iOS app and uploads it to App Store Connect for internal TestFlight testing.
#
# Runs by hand, and from release.yml after each release so iOS testers get the same version as
# Android.
#
# It needs these repository secrets (docs/ios.md explains how to get them):
#
#   APPLE_TEAM_ID                 your Apple Developer team id (10 characters)
#   APP_STORE_CONNECT_KEY_ID      an App Store Connect API key with the Admin role...
#   APP_STORE_CONNECT_ISSUER_ID   ...its issuer id...
#   APP_STORE_CONNECT_KEY         ...and the contents of its .p8 file
#
# and optionally the IOS_BUNDLE_ID repository variable (default io.github.defuuls.orbin).
# Signing is Xcode's cloud-managed signing through the API key, at export: the archive is built
# unsigned, so no certificates or provisioning profiles to export or store, and no development
# certificate made per run.
#
# The release runs it as a called workflow rather than this one listening for the release: a
# release is published with GITHUB_TOKEN, which starts no other workflow, and the alternative
# (`workflow_run`) would check out code in a job that holds the signing secrets.
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: The release tag to build.
        type: string
        required: true
    # Declared so release.yml can pass exactly these instead of `secrets: inherit`. Optional, so
    # a release still skips this quietly until they are configured.
    secrets:
      APPLE_TEAM_ID:
        required: false
      APP_STORE_CONNECT_KEY_ID:
        required: false
      APP_STORE_CONNECT_ISSUER_ID:
        required: false
      APP_STORE_CONNECT_KEY:
        required: false

concurrency:
  group: testflight
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  upload:
    name: Upload to TestFlight
    runs-on: macos-26
    # The App Store Connect key has the Admin role, so it is handed only to the steps that talk to
    # App Store Connect, never to the job: the Gradle build, XcodeGen and the archive (which runs
    # Gradle again) cannot read it from their environment, and the .p8 file does not exist on disk
    # until the archive is finished. Each step that needs the file writes it and removes it again.
    env:
      BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID || 'io.github.defuuls.orbin' }}
    steps:
      # Until the secrets exist, a release skips this quietly; a manual run says what is missing.
      - name: Check signing configuration
        id: config
        env:
          # Inside a release, github.workflow names the caller.
          STARTED_BY_HAND: ${{ github.workflow == 'TestFlight' }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          API_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
        run: |
          missing=()
          [ -n "$TEAM_ID" ] || missing+=(APPLE_TEAM_ID)
          [ -n "$KEY_ID" ] || missing+=(APP_STORE_CONNECT_KEY_ID)
          [ -n "$ISSUER_ID" ] || missing+=(APP_STORE_CONNECT_ISSUER_ID)
          [ -n "$API_KEY" ] || missing+=(APP_STORE_CONNECT_KEY)
          if [ ${#missing[@]} -eq 0 ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          elif [ "$STARTED_BY_HAND" = "true" ]; then
            echo "::error::Missing repository secrets: ${missing[*]}. See docs/ios.md."
            exit 1
          else
            echo "::notice::TestFlight upload skipped: secrets not configured (${missing[*]}). See docs/ios.md."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.config.outputs.configured == 'true'
        with:
          persist-credentials: false
          # From a release, build exactly the tag it published.
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up JDK and Gradle
        if: steps.config.outputs.configured == 'true'
        uses: ./.github/actions/setup-jdk-gradle

      - name: Set up XcodeGen
        if: steps.config.outputs.configured == 'true'
        uses: ./.github/actions/setup-xcodegen

      - name: Generate the Xcode project
        if: steps.config.outputs.configured == 'true'
        run: xcodegen --spec iosApp/project.yml

      # The Android release's number, so both platforms report the same version: "148" from
      # "148-Nectarine", built as <versionCode>.<yyyyMMddHHmm> in Chicago time so every upload is a new,
      # higher build. Not the run number: a manual run and one called from release.yml count separately
      # (11 against 189), so a newer manual build sorted below the release's and TestFlight
      # offered the older one as the latest.
      - name: Work out the version
        if: steps.config.outputs.configured == 'true'
        id: version
        run: |
          name=$(sed -n 's/^orbin.versionName=//p' gradle.properties)
          code=$(sed -n 's/^orbin.versionCode=//p' gradle.properties)
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "marketing=${name%%-*}" >> "$GITHUB_OUTPUT"
          echo "build=${code}.$(TZ=America/Chicago date +%Y%m%d%H%M)" >> "$GITHUB_OUTPUT"

      # Unsigned: signing here takes an Apple Development certificate, and each fresh runner asked
      # the account for a new one until Apple's limit refused the next build. The upload step signs
      # the archive with the team's cloud-managed distribution certificate instead, which lives
      # with Apple and is reused. The app has no entitlements file, so nothing is lost unsigned.
      # The team id is the only signing value the archive needs, and it is not a credential: it is
      # printed in every app the team ships.
      - name: Archive
        if: steps.config.outputs.configured == 'true'
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild archive \
            -project iosApp/Orbin.xcodeproj \
            -scheme Orbin \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Orbin.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            ORBIN_TEAM_ID="$TEAM_ID" \
            ORBIN_BUNDLE_ID="$BUNDLE_ID" \
            MARKETING_VERSION="${{ steps.version.outputs.marketing }}" \
            ORBIN_VERSION_NAME="${{ steps.version.outputs.name }}" \
            CURRENT_PROJECT_VERSION="${{ steps.version.outputs.build }}"

      - name: Upload to App Store Connect
        if: steps.config.outputs.configured == 'true'
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          API_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
        run: |
          key="$RUNNER_TEMP/AuthKey_${KEY_ID}.p8"
          trap 'rm -f "$key"' EXIT
          (umask 077 && printf '%s\n' "$API_KEY" > "$key")
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>testFlightInternalTestingOnly</key><true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Orbin.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$key" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"
          echo "Uploaded build ${{ steps.version.outputs.build }} (version ${{ steps.version.outputs.marketing }})." >> "$GITHUB_STEP_SUMMARY"

      # Installed before any step holds the key, so pip and package build scripts never see it.
      - name: Install the notes script's dependencies
        if: steps.config.outputs.configured == 'true'
        continue-on-error: true
        run: |
          python3 -m venv "$RUNNER_TEMP/notes-venv"
          "$RUNNER_TEMP/notes-venv/bin/pip" install --quiet "pyjwt[crypto]==2.10.1"

      # Testers read what changed in the TestFlight app: this release's changelog section, or
      # what is unreleased for a manual build between releases. Apple takes a few minutes to
      # register a new build, so this waits for it. A failure here leaves the build uploaded,
      # only without notes, so it warns rather than failing the upload.
      - name: Set What to Test from the changelog
        if: steps.config.outputs.configured == 'true'
        continue-on-error: true
        timeout-minutes: 35
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          API_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
        run: |
          export API_KEY_PATH="$RUNNER_TEMP/AuthKey_${KEY_ID}.p8"
          trap 'rm -f "$API_KEY_PATH"' EXIT
          (umask 077 && printf '%s\n' "$API_KEY" > "$API_KEY_PATH")
          "$RUNNER_TEMP/notes-venv/bin/python" scripts/testflight_notes.py \
            --version-name "${{ steps.version.outputs.name }}" \
            --marketing "${{ steps.version.outputs.marketing }}" \
            --build "${{ steps.version.outputs.build }}" \
            --bundle-id "$BUNDLE_ID" | tee -a "$GITHUB_STEP_SUMMARY"

      # Each step already removes the key on exit; this covers a step that was killed outright.
      - name: Remove the API key
        if: always()
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8
