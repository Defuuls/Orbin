name: Release Orbin Minimal

# Orbin Minimal releases on its own line, under `minimal-v*` tags, starting at minimal-v1.
#
# It is a separate app — its own applicationId, its own version in gradle.properties, its own
# cadence — so it gets its own workflow rather than riding along with the full client's release.
# Publishing it from both would ship one APK under two version schemes, and tie a reader's
# expectations about "version 1" to a number that says 114.
#
# workflow_dispatch mirrors release.yml, and is the path used when tag-push is unavailable.
#
# From minimal-v4 the tag carries a codename — a popular Japanese female name, the same pool
# the full client draws from and never reusing a name across the two. minimal-v1 to v3 were
# bare numbers; the 'minimal-v*' pattern above matches both shapes.
on:
  push:
    tags:
      - 'minimal-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to create and release (e.g. minimal-v5-Aoi). Must not already exist.'
        required: true
        type: string
      base_ref:
        description: 'Branch or SHA to tag (defaults to main)'
        required: false
        default: main
        type: string
      notes_only:
        description: 'Regenerate the notes of an already-published release; build and upload nothing'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    name: Build, sign & publish Orbin Minimal
    runs-on: ubuntu-latest
    env:
      # For tag-push events GITHUB_REF_NAME is the tag; for dispatch it is the branch.
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so release notes can diff against the previous tag
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.base_ref || github.ref }}

      # The release title is derived from the tag rather than typed into the dispatch form, so the
      # two lines read the same way on a releases page that mixes them: v101-Hana becomes
      # "Orbin 101 - Hana" and minimal-v5-Aoi becomes "Orbin Minimal 5 - Aoi". It used to be
      # whatever the tag message said, which is how the full client's releases came to be titled
      # with a bare codename ("Hana") while Orbin Minimal's spelled out the app and its number.
      # The same string annotates the tag, so the tag message and the release title cannot drift.
      - name: Derive the release name
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#minimal-v}"
          NUMBER="${VERSION%%-*}"
          CODENAME="${VERSION#*-}"
          if [ "$CODENAME" = "$NUMBER" ]; then
            # minimal-v1 to minimal-v3 carry no codename.
            RELEASE_NAME="Orbin Minimal ${NUMBER}"
          else
            RELEASE_NAME="Orbin Minimal ${NUMBER} - ${CODENAME//-/ }"
          fi
          echo "RELEASE_NAME=${RELEASE_NAME}" >> "$GITHUB_ENV"

          # The tag already begins with "minimal-", so naming assets after it whole spelled the
          # word twice: orbin-minimal-minimal-v6-Rin.apk. Derived here rather than beside the
          # build so the notes can quote the right filename even when nothing is being built.
          #
          # Strips "minimal-" and NOT "minimal-v": the title above wants the bare number, the
          # assets want the v. Reusing VERSION here published notes pointing at
          # orbin-minimal-6-Rin.apk — a file that does not exist — and would have dropped the v
          # from the next release's APK too.
          echo "ASSET_VERSION=${RELEASE_TAG#minimal-}" >> "$GITHUB_ENV"

      - name: Create and push annotated tag (dispatch only)
        if: github.event_name == 'workflow_dispatch' && !inputs.notes_only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --tags origin "${{ inputs.tag }}" | grep -q "${{ inputs.tag }}"; then
            echo "Tag ${{ inputs.tag }} already exists on remote — skipping creation."
          else
            git tag -a "${{ inputs.tag }}" -m "$RELEASE_NAME"
            git push origin "${{ inputs.tag }}"
          fi

      - name: Set up JDK 17
        if: ${{ !inputs.notes_only }}
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        if: ${{ !inputs.notes_only }}
        uses: gradle/actions/setup-gradle@v6

      - name: Decode signing keystore
        if: ${{ !inputs.notes_only }}
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 secret is not set"; exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/orbin-release.jks"
          echo "ORBIN_KEYSTORE_FILE=$RUNNER_TEMP/orbin-release.jks" >> "$GITHUB_ENV"

      # Only this module. `assembleRelease` would build the full client too — minutes of R8 for an
      # APK this release does not publish.
      - name: Build signed release APK
        if: ${{ !inputs.notes_only }}
        env:
          ORBIN_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          ORBIN_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          ORBIN_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app-minimal:assembleRelease

      - name: Locate artifacts and compute checksums
        if: ${{ !inputs.notes_only }}
        run: |
          set -euo pipefail
          mkdir -p release-staging
          VERSION="${ASSET_VERSION}"

          APK=$(find app-minimal/build/outputs/apk/release -name '*.apk' | head -n1)
          if [ -z "$APK" ]; then
            echo "::error::No APK found under app-minimal/build/outputs/apk/release"; exit 1
          fi
          MAPPING=$(find app-minimal/build/outputs/mapping/release -name 'mapping.txt' | head -n1 || true)
          cp "$APK" "release-staging/orbin-minimal-${VERSION}.apk"
          ( cd release-staging && sha256sum "orbin-minimal-${VERSION}.apk" > "orbin-minimal-${VERSION}.apk.sha256" )
          if [ -n "$MAPPING" ]; then
            cp "$MAPPING" "release-staging/orbin-minimal-${VERSION}-mapping.txt"
            ( cd release-staging && sha256sum "orbin-minimal-${VERSION}-mapping.txt" > "orbin-minimal-${VERSION}-mapping.txt.sha256" )
          fi

      - name: Generate release notes
        id: notes
        run: |
          set -euo pipefail
          # Make sure the tag object itself is present; the previous-tag lookup below reads it.
          git fetch --force origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          # Only this app's own tags, so the diff never spans the full client's release history.
          PREV_TAG=$(git tag --list 'minimal-v*' --sort=-creatordate | grep -v "^${RELEASE_TAG}$" | head -n1 || true)

          # Which paths count as a change to *this* app. It used to be `app-minimal` alone, which
          # describes the front end rather than the app: minimal-v6-Rin carried a fix to the image
          # copy — real, user-visible, and in :media — and published an empty changes list, which
          # reads as "nothing changed" and is worse than no list at all.
          #
          # The list is read out of app-minimal's own build file rather than written here, so
          # adding a module to the app widens its release notes automatically instead of waiting
          # for someone to notice that two lists disagree. Test-only dependencies are excluded by
          # matching implementation/api alone; the feature modules the app does not route to
          # (board, search, history, settings, downloads, onboarding) are excluded by simply not
          # being in that file.
          #
          # Build configuration is deliberately out of scope: a dependency bump in
          # gradle/libs.versions.toml does reach the APK, but listing it here would bury the app's
          # own changes under build noise. The changelog is where that belongs.
          mapfile -t MODULE_PATHS < <(
            grep -E '^[[:space:]]*(implementation|api)\(project\("' app-minimal/build.gradle.kts |
              sed -E 's/.*project\("(:[^"]+)"\).*/\1/' |
              sed -E 's|^:||; s|:|/|g' |
              sort -u
          )
          if [ "${#MODULE_PATHS[@]}" -eq 0 ]; then
            echo "::error::could not read Orbin Minimal's module list from app-minimal/build.gradle.kts"
            exit 1
          fi
          echo "Release notes cover: app-minimal ${MODULE_PATHS[*]}"
          echo "release_name=${RELEASE_NAME}" >> "$GITHUB_OUTPUT"
          {
            echo "## ${RELEASE_NAME}"
            echo
            echo "Orbin Minimal is a separate app: every board you follow, merged into one flat"
            echo "feed and sorted by latest activity. Each row carries the opening post's first"
            echo "attachment as a preview, and a row whose attachment is a video plays it — muted —"
            echo "for as long as the row is on screen, so the feed reads as a wall of live media"
            echo "rather than a list of links. Tap a row to read the thread, tap an image to open it"
            echo "full screen."
            echo
            echo "That is the entire interface. No bottom navigation, no settings hub, no search,"
            echo "gallery, downloads, bookmarks, history, notifications, app-lock or themes — and"
            echo "because there is no settings screen, autoplay is simply always on rather than a"
            echo "preference. On a feed spanning every board you follow, that will use mobile data"
            echo "without asking."
            echo
            echo "Underneath is the full client's machinery: the same providers, caching, encrypted"
            echo "storage, board filters and always-on content filter. It installs **alongside** the"
            echo "full Orbin client rather than replacing it, under its own applicationId. Android"
            echo "sandboxes the two separately, so its subscriptions are its own — pick boards from"
            echo "the list icon in its top bar."
            echo
            if [ -n "$PREV_TAG" ]; then
              echo "### Changes since ${PREV_TAG}"
              git log --no-merges --pretty='- %s (%h)' "${PREV_TAG}..${RELEASE_TAG}" \
                -- app-minimal "${MODULE_PATHS[@]}"
            else
              echo "### First release"
            fi
            echo
            echo "### Verifying downloads"
            echo "Each artifact ships with a \`.sha256\` checksum. Verify with:"
            echo '```'
            echo "sha256sum -c orbin-minimal-${ASSET_VERSION}.apk.sha256"
            echo '```'
          } > release-notes.md

      # A notes-only run repairs a release published before the notes covered the right paths:
      # minimal-v6-Rin shipped the image-copy fix from :media and listed nothing at all. The notes
      # are regenerated by the very step above that a real release uses, so a repaired release and
      # the next one cannot disagree about what counts as a change.
      - name: Update the notes of an existing release
        if: ${{ inputs.notes_only }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! RELEASE=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" 2>/dev/null); then
            echo "::error::no published release found for tag '${RELEASE_TAG}'"; exit 1
          fi
          ID=$(echo "$RELEASE" | jq -r '.id')
          if diff -q <(echo "$RELEASE" | jq -r '.body') release-notes.md >/dev/null 2>&1; then
            echo "Notes already match — nothing to do."
            exit 0
          fi
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${ID}" \
            -F body=@release-notes.md >/dev/null
          echo "Regenerated the notes for ${RELEASE_TAG}." >> "$GITHUB_STEP_SUMMARY"

      - name: Publish GitHub Release
        if: ${{ !inputs.notes_only }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ steps.notes.outputs.release_name }}
          body_path: release-notes.md
          files: |
            release-staging/*.apk
            release-staging/*.sha256
            release-staging/*-mapping.txt
          fail_on_unmatched_files: true
