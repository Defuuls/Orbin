name: Delete release mapping files (one-off)

# Temporary: lists (and, once confirmed, deletes) the R8 mapping files attached to past releases,
# now that release.yml keeps the mapping as a private artifact. Removed again after it runs.
on:
  push:
    branches:
      - claude/boards-alphabetical-sorting-2sepps
    paths:
      - .github/workflows/delete-release-mappings.yml

permissions:
  contents: write

env:
  # "list" only prints what matches; "delete" removes it.
  MODE: delete

jobs:
  mappings:
    runs-on: ubuntu-latest
    steps:
      - name: Mapping assets on releases
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$REPO/releases?per_page=100" \
            --jq '.[] | .tag_name as $t | .assets[] | select(.name | test("-mapping\\.txt(\\.sha256)?$")) | "\(.id) \($t) \(.name) \(.size)"' \
            > assets.txt
          echo "MATCHES $(wc -l < assets.txt)"
          cat assets.txt
          if [ "$MODE" = "delete" ]; then
            while read -r id tag name size; do
              echo "Deleting $name from $tag"
              # Immutable releases refuse any change; report those and carry on.
              gh api -X DELETE "repos/$REPO/releases/assets/$id" || echo "SKIPPED $name on $tag"
            done < assets.txt
            echo "REMAINING $(gh api --paginate "repos/$REPO/releases?per_page=100" --jq '.[] | .assets[] | select(.name | test("-mapping\\.txt(\\.sha256)?$")) | .name' | wc -l)"
          fi
