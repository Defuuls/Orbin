name: Screenshots

# Verifies Roborazzi screenshots against the goldens committed under
# src/test/screenshots (Android modules) and src/androidHostTest/screenshots
# (the Compose Multiplatform modules shared with iOS). Recording alone never compared anything — the goldens
# were checked in but nothing gated them, so a UI regression could land with
# the screenshot job green.
#
# Roborazzi renders through Robolectric on the JVM, which is reproducible
# across machines. If a legitimate UI change makes this fail, re-record locally
# (./gradlew recordRoborazziDebug recordRoborazziAndroidHostTest) and commit the new goldens, or download the
# roborazzi-diffs artifact to see what moved.
on:
  workflow_dispatch:
  pull_request:
    paths:
      # Keep this list aligned with modules that own Roborazzi coverage, plus
      # shared UI dependencies whose changes can alter those captured screens.
      - '.github/workflows/screenshots.yml'
      - '.github/actions/setup-jdk-gradle/**'
      - 'build-logic/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'core/designsystem/**'
      - 'core/ui/**'
      - 'feature/gallery/**'
      - 'media/**'
      - 'ui-next/**'

permissions:
  contents: read

jobs:
  verify:
    name: Verify screenshots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK and Gradle
        uses: ./.github/actions/setup-jdk-gradle

      - name: Verify Roborazzi screenshots
        id: verify
        # Android modules have a debug variant; multiplatform modules run their Android host tests.
        run: ./gradlew verifyRoborazziDebug verifyRoborazziAndroidHostTest

      - name: Record audit fixtures for review
        if: failure() && steps.verify.outcome == 'failure' && github.event_name == 'pull_request' && github.event.pull_request.number == 791 && github.event.pull_request.head.repo.full_name == github.repository
        env:
          AUDIT_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git diff --quiet HEAD
          git fetch --no-tags --depth=1 origin "$AUDIT_SOURCE_SHA"
          git checkout --detach "$AUDIT_SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$AUDIT_SOURCE_SHA"
          record_status=0
          ./gradlew recordRoborazziDebug recordRoborazziAndroidHostTest --continue || record_status=$?
          export AUDIT_RECORD_EXIT="$record_status"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          prefixes = (
              "ui-next/src/androidHostTest/screenshots/",
              "feature/gallery/src/test/screenshots/",
              "core/designsystem/src/androidHostTest/screenshots/",
          )
          changed = subprocess.check_output([
              "git", "diff", "--name-only", "--diff-filter=M", "-z", "HEAD", "--", *prefixes,
          ]).decode().split("\0")
          changed += subprocess.check_output([
              "git", "ls-files", "--others", "--exclude-standard", "-z", "--", *prefixes,
          ]).decode().split("\0")
          files = []
          total = 0
          for name in sorted(set(filter(None, changed))):
              path = Path(name)
              if not name.startswith(prefixes) or path.suffix != ".png" or path.is_symlink():
                  raise SystemExit("Unexpected changed fixture: " + name)
              data = path.read_bytes()
              total += len(data)
              if len(data) > 2 * 1024 * 1024 or total > 32 * 1024 * 1024:
                  raise SystemExit("Fixture payload exceeds diagnostic limit")
              if not data.startswith(b"\x89PNG\r\n\x1a\n"):
                  raise SystemExit("Not a PNG: " + name)
              blob = hashlib.sha1(b"blob " + str(len(data)).encode() + b"\0" + data).hexdigest()
              files.append({"path": name, "size": len(data), "sha256": hashlib.sha256(data).hexdigest(), "blob_sha": blob})
          manifest = {"sha": os.environ["AUDIT_SOURCE_SHA"], "record_exit": int(os.environ["AUDIT_RECORD_EXIT"]), "files": files}
          Path("audit-fixture-manifest.json").write_text(json.dumps(manifest))
          print("Recorded fixture evidence:", len(files), "files,", total, "bytes; test exit", manifest["record_exit"])
          PY
          exit "$record_status"

      - name: Upload comparison images
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: roborazzi-diffs
          path: |
            audit-fixture-manifest.json
            **/build/test-results/**/*.xml
            **/build/outputs/roborazzi/**
            **/src/test/screenshots/**
            **/src/androidHostTest/screenshots/**
          if-no-files-found: ignore

  export-audit-evidence:
    name: Review fixtures ${{ matrix.bucket }}
    needs: verify
    if: always() && github.event_name == 'pull_request' && github.event.pull_request.number == 791 && github.event.pull_request.head.repo.full_name == github.repository && needs.verify.result == 'failure'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        bucket: [0, 1, 2, 3, 4, 5, 6, 7]
      max-parallel: 4
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: roborazzi-diffs
          path: review-fixtures
      - name: Export bounded fixture evidence
        env:
          AUDIT_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          AUDIT_BUCKET: ${{ matrix.bucket }}
        run: |
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          root = Path("review-fixtures")
          manifest = json.loads((root / "audit-fixture-manifest.json").read_text())
          if manifest["sha"] != os.environ["AUDIT_SOURCE_SHA"]:
              raise SystemExit("Unexpected fixture source")
          bucket = int(os.environ["AUDIT_BUCKET"])
          print("ORBIN_GOLDEN_SOURCE " + json.dumps({"sha": manifest["sha"], "bucket": bucket, "total": len(manifest["files"]), "record_exit": manifest["record_exit"]}))
          if bucket == 0:
              for report in root.glob("**/build/test-results/**/TEST-*.xml"):
                  for case in ET.parse(report).getroot().iter("testcase"):
                      for failure in case.findall("failure"):
                          print("ORBIN_TEST_FAILURE " + json.dumps({"class": case.get("classname"), "name": case.get("name"), "message": failure.get("message", "")[:6000]}))
          for index, item in enumerate(manifest["files"]):
              if index % 8 != bucket:
                  continue
              name = item["path"]
              path = root / name
              if not name.startswith(("ui-next/src/androidHostTest/screenshots/", "feature/gallery/src/test/screenshots/", "core/designsystem/src/androidHostTest/screenshots/")) or path.is_symlink():
                  raise SystemExit("Unexpected evidence path")
              data = path.read_bytes()
              if len(data) != item["size"] or hashlib.sha256(data).hexdigest() != item["sha256"]:
                  raise SystemExit("Fixture checksum mismatch")
              encoded = base64.b64encode(data).decode("ascii")
              parts = (len(encoded) + 8191) // 8192
              print("ORBIN_GOLDEN_FILE " + json.dumps({**item, "parts": parts}))
              for part in range(parts):
                  print("ORBIN_GOLDEN_CHUNK " + json.dumps({"path": name, "part": part, "base64": encoded[part * 8192:(part + 1) * 8192]}))
          PY
