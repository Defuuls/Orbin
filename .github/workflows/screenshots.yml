name: Screenshots

# Verifies Roborazzi screenshots against the goldens committed under
# src/test/screenshots (Android modules) and src/androidHostTest/screenshots
# (the Compose Multiplatform modules shared with iOS). Recording alone never compared anything — the goldens
# were checked in but nothing gated them, so a UI regression could land with
# the screenshot job green.
#
# Roborazzi renders through Robolectric on the JVM, which is reproducible
# across machines. If a legitimate UI change makes this fail, re-record locally
# (./gradlew recordRoborazziDebug recordRoborazziAndroidHostTest) and commit the new goldens, or download the
# roborazzi-diffs artifact to see what moved.
on:
  workflow_dispatch:
  pull_request:
    paths:
      # Keep this list aligned with modules that own Roborazzi coverage, plus
      # shared UI dependencies whose changes can alter those captured screens.
      - 'core/designsystem/**'
      - 'core/ui/**'
      - 'feature/gallery/**'
      - 'media/**'
      - 'ui-next/**'

permissions:
  contents: read

jobs:
  verify:
    name: Verify screenshots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK and Gradle
        uses: ./.github/actions/setup-jdk-gradle

      - name: Verify Roborazzi screenshots
        # Android modules have a debug variant; multiplatform modules run their Android host tests.
        run: ./gradlew verifyRoborazziDebug verifyRoborazziAndroidHostTest

      - name: Upload comparison images
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: roborazzi-diffs
          path: |
            **/build/outputs/roborazzi/**
            **/src/test/screenshots/**
            **/src/androidHostTest/screenshots/**
          if-no-files-found: ignore
