name: Cut Orbin 120 Sora

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/cut-120-sora.yml'
      - 'gradle.properties'
      - 'CHANGELOG.md'
      - 'README.md'
      - 'docs/wiki/Home.md'

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  cut:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Decide whether to prepare or publish
        id: state
        shell: bash
        run: |
          set -euo pipefail
          if grep -qx 'orbin.versionName=120-Sora' gradle.properties; then
            echo 'mode=publish' >> "$GITHUB_OUTPUT"
          else
            echo 'mode=prepare' >> "$GITHUB_OUTPUT"
          fi

      - name: Validate release name
        if: steps.state.outputs.mode == 'prepare'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          if git tag --list | grep -Eiq '(^|[-])Sora$'; then
            echo '::error::Sora is already used by an existing release tag'; exit 1
          fi
          test -z "$(git tag --list 'v120-Sora')"

      - name: Prepare release metadata
        if: steps.state.outputs.mode == 'prepare'
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import re
          from datetime import date
          from pathlib import Path

          today = date.today().isoformat()
          base = 'https://github.com/Defuuls/Orbin'

          props = Path('gradle.properties')
          text = props.read_text()
          text = re.sub(r'^orbin\.versionCode=\d+$', 'orbin.versionCode=138', text, count=1, flags=re.M)
          text = re.sub(r'^orbin\.versionName=.+$', 'orbin.versionName=120-Sora', text, count=1, flags=re.M)
          props.write_text(text)

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text()
          if '## [120-Sora]' not in text:
              section = f'''## [120-Sora] - {today}\n\n### Fixed\n- Restored BBW-Chan image, animated-media, and video loading by sending same-origin media referrers instead of missing or hard-coded 4chan referrers.\n- Synchronized thread scroll with the gallery's active media page so returning from full-screen media lands on the post that owns the viewed attachment.\n\n### Reliability\n- Added regression coverage for media request headers and gallery-to-thread media index mapping.\n'''
              text = text.replace('## [Unreleased]\n', f'## [Unreleased]\n\n{section}\n', 1)
              text = re.sub(
                  r'^\[Unreleased\]: .*$',
                  f'[Unreleased]: {base}/compare/v120-Sora...HEAD\n[120-Sora]: {base}/compare/v119-Aiko...v120-Sora',
                  text,
                  count=1,
                  flags=re.M,
              )
          changelog.write_text(text)

          readme = Path('README.md')
          text = readme.read_text()
          text = re.sub(
              r'\*\*Current release:\*\* \[[^\]]+\]\([^)]+\)',
              f'**Current release:** [120 — Sora]({base}/releases/tag/v120-Sora)',
              text,
              count=1,
          )
          readme.write_text(text)

          home = Path('docs/wiki/Home.md')
          text = home.read_text()
          text = re.sub(
              r'\| Current release \| \*\*[^*]+\*\* \([0-9-]+\) \|',
              f'| Current release | **v120 — Sora** ({today}) |',
              text,
              count=1,
          )
          home.write_text(text)
          PY
          python3 scripts/validate_repo.py

      - name: Push release-prep branch and open PR
        if: steps.state.outputs.mode == 'prepare'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B release/prep-v120-sora
          git add gradle.properties CHANGELOG.md README.md docs/wiki/Home.md
          git commit -m 'chore: Prepare Orbin 120 Sora release'
          git push --force-with-lease --set-upstream origin release/prep-v120-sora
          if ! gh pr view release/prep-v120-sora --json number >/dev/null 2>&1; then
            gh pr create --base main --head release/prep-v120-sora \
              --title 'chore: Prepare v120-Sora release' \
              --body $'## Summary\n- bump Orbin to 120-Sora / versionCode 138\n- document BBW-Chan media restoration and gallery/thread scroll synchronization\n- update current-release documentation\n\nAfter this PR merges, the cutter dispatches the signed v120-Sora release.'
          fi

      - name: Validate merged release metadata
        if: steps.state.outputs.mode == 'publish'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          grep -qx 'orbin.versionCode=138' gradle.properties
          grep -qx 'orbin.versionName=120-Sora' gradle.properties
          test -z "$(git tag --list 'v120-Sora')"
          python3 scripts/validate_repo.py

      - name: Dispatch signed release build
        if: steps.state.outputs.mode == 'publish'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run release.yml --ref main -f tag=v120-Sora -f base_ref=main
