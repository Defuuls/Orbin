name: Clover Settings reference inspection

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clover-settings-reference
  cancel-in-progress: false

jobs:
  inspect:
    name: Inspect Clover fonts and safe reader structure
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOVER_ARTIFACT_DIR: /tmp/clover-settings-evidence
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/workflows/instrumentation.yml
      - name: Enable KVM
        run: sudo chmod a+rw /dev/kvm
      - name: Restore existing API 31 system image
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /usr/local/lib/android/sdk/system-images/android-31
            /usr/local/lib/android/sdk/platforms/android-31
          key: sysimg-31-google_apis-x86_64
      - name: Download and verify exact supplied reference APK
        run: |
          set -euo pipefail
          mkdir -p "$CLOVER_ARTIFACT_DIR"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/Clover-v3.0.2.apk" https://github.com/chandevel/Clover/releases/download/v3.0.2/Clover-v3.0.2.apk
          printf '%s  %s\n' 3dfc46508958c53b2eedeb48be22304c4c5d1debf9b19172b09eaa1709441300 "$RUNNER_TEMP/Clover-v3.0.2.apk" | sha256sum --check
          sha256sum "$RUNNER_TEMP/Clover-v3.0.2.apk" > "$CLOVER_ARTIFACT_DIR/apk-sha256.txt"
      - name: Prepare focused UI inspection
        run: |
          cat > "$RUNNER_TEMP/clover-inspect.py" <<'PYCODE'
          import gzip,hashlib,json,os,re,struct,subprocess,time,traceback,xml.etree.ElementTree as ET
          from pathlib import Path
          out=Path(os.environ['CLOVER_ARTIFACT_DIR']);out.mkdir(parents=True,exist_ok=True)
          apk=Path(os.environ['RUNNER_TEMP'])/'Clover-v3.0.2.apk'
          expected='3dfc46508958c53b2eedeb48be22304c4c5d1debf9b19172b09eaa1709441300'
          actual=hashlib.sha256(apk.read_bytes()).hexdigest()
          assert actual==expected,(actual,expected)
          events=[];screens=[]
          def adb(*args,timeout=40,binary=False,check=True):
           p=subprocess.run(['adb',*args],capture_output=True,text=not binary,timeout=timeout)
           if check and p.returncode:raise RuntimeError('adb '+repr(args)+' failed: '+str(p.stderr)[-1200:])
           return p.stdout

          def nodes(xml):
           try:return list(ET.fromstring(xml).iter('node'))
           except ET.ParseError:return []
          def capture(name):
           time.sleep(1)
           try:
            adb('shell','uiautomator','dump','/sdcard/clover-reference.xml',timeout=35)
            xml=adb('exec-out','cat','/sdcard/clover-reference.xml',timeout=15)
           except Exception as e:
            xml='<hierarchy error='+json.dumps(str(e))+'/>'
           (out/(name+'.xml')).write_text(xml)
           png=adb('exec-out','screencap','-p',timeout=30,binary=True)
           assert png.startswith(b'\x89PNG\r\n\x1a\n'),'Not a PNG'
           (out/(name+'.png')).write_bytes(png)
           labels=[{'text':n.get('text',''),'description':n.get('content-desc',''),'id':n.get('resource-id',''),'bounds':n.get('bounds',''),'class':n.get('class','')} for n in nodes(xml) if n.get('text') or n.get('content-desc')]
           events.append({'capture':name,'labels':labels});screens.append(name)
           (out/'timeline.json').write_text(json.dumps(events,indent=2)+'\n')
           print(name,[(n['text'] or n['description']) for n in labels][:35],flush=True)
           return xml

          def tap_node(n,label):
           box=list(map(int,re.findall(r'\d+',n.get('bounds',''))))
           if len(box)!=4:return False
           x=(box[0]+box[2])//2;y=(box[1]+box[3])//2
           adb('shell','input','tap',str(x),str(y));events.append({'action':'tap','label':label,'coordinates':[x,y]});time.sleep(1)
           return True

          def click(xml,*labels):
           for label in labels:
            for n in nodes(xml):
             text=n.get('text','').strip();desc=n.get('content-desc','').strip()
             if text.casefold()==label.casefold() or desc.casefold()==label.casefold():return tap_node(n,label)
           return False

          def back():
           adb('shell','input','keyevent','KEYCODE_BACK');events.append({'action':'Back'});time.sleep(1)

          def status_dialogs(xml):
           for i in range(4):
            texts=' '.join(n.get('text','') for n in nodes(xml)).lower()
            is_system=any(n.get('package') in ('android','com.android.permissioncontroller') for n in nodes(xml))
            if is_system and ('older version' in texts or 'permission' in texts or 'allow' in texts):
             if click(xml,'OK','Allow','Continue'):xml=capture('startup_system_dialog_dismissed_'+str(i));continue
            if ('crash' in texts or 'welcome' in texts) and click(xml,'No','Not now','Skip','Continue','OK'):
             xml=capture('startup_notice_dismissed_'+str(i));continue
            break
           return xml

          result={'apk_sha256':actual,'source_url':'https://github.com/chandevel/Clover/releases/download/v3.0.2/Clover-v3.0.2.apk','package':'org.floens.chan','installed':False,'settings_root_observed':False,'captures':screens,'method':'Actual installed APK and adb UI interaction on API31 accelerated emulator; no application build'}
          try:
           adb('shell','wm','size','480x800');adb('shell','wm','density','160');time.sleep(2)
           (out/'display.txt').write_text(adb('shell','wm','size')+adb('shell','wm','density'))
           fonts=out/'fonts';fonts.mkdir(exist_ok=True)
           adb('pull','/system/etc/fonts.xml',str(fonts/'fonts.xml'))
           font_records=[]
           def font_names(data):
            names={};count=struct.unpack_from('>H',data,4)[0]
            for i in range(count):
             tag,checksum,offset,length=struct.unpack_from('>4sIII',data,12+i*16)
             if tag!=b'name':continue
             fmt,n,strings=struct.unpack_from('>HHH',data,offset)
             for j in range(n):
              platform,encoding,language,nameid,size,start=struct.unpack_from('>HHHHHH',data,offset+6+j*12)
              if nameid not in (0,1,2,5,8,13,14):continue
              value=data[offset+strings+start:offset+strings+start+size].decode('utf-16-be' if platform in (0,3) else 'latin-1',errors='replace')
              names.setdefault(str(nameid),[])
              if value not in names[str(nameid)]:names[str(nameid)].append(value)
            return names
           for face in ['Regular','Bold','Italic','BoldItalic']:
            name='Roboto-'+face+'.ttf';adb('pull','/system/fonts/'+name,str(fonts/name))
            data=(fonts/name).read_bytes();font_records.append({'file':name,'system_path':'/system/fonts/'+name,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'name_table':font_names(data)})
           (fonts/'font-provenance.json').write_text(json.dumps({'api_level':31,'source':'Actual/system/fonts files pulled from the running reference emulator','faces':font_records},indent=2)+'\n')
           try:
            notice=adb('exec-out','cat','/system/etc/NOTICE.xml.gz',binary=True,check=False)
            tree=ET.fromstring(gzip.decompress(notice));matched=[n for n in tree.iter('file-name') if 'roboto' in (n.text or '').lower()];ids={n.get('contentId') for n in matched};selected=ET.Element('licenses')
            for n in matched:selected.append(n)
            for n in tree.iter('file-content'):
             if n.get('contentId') in ids:selected.append(n)
            ET.ElementTree(selected).write(fonts/'NOTICE-Roboto.xml',encoding='utf-8',xml_declaration=True)
           except Exception as e:(fonts/'notice-extraction.txt').write_text(str(e)+'\nLicense metadata is also preserved from each actual font name table.\n')
           print('Pulled four exact runtime Roboto faces and font mapping before UI inspection',flush=True)
           (out/'device-properties.txt').write_text(adb('shell','getprop'))
           (out/'install.log').write_text(adb('install','-g','--no-streaming',str(apk),timeout=90));result['installed']=True
           (out/'package.txt').write_text(adb('shell','dumpsys','package','org.floens.chan'))
           (out/'launch.log').write_text(adb('shell','am','start','-W','-n','org.floens.chan/.ui.activity.BoardActivity',timeout=90))
           xml=status_dialogs(capture('startup'))
           adb('shell','input','tap','240','400');time.sleep(1)
           opened=False
           for attempt in range(3):
            adb('shell','input','tap','28','52')
            xml=capture('navigation_drawer_'+str(attempt+1))
            if click(xml,'Settings'):
             opened=True;break
           if not opened:
            adb('shell','input','swipe','1','300','350','300','350')
            xml=capture('navigation_drawer_swipe')
            opened=click(xml,'Settings')
           assert opened,'Settings footer not found after dismissing startup hint and opening drawer'
           xml=capture('settings_root_light')
           result['settings_root_observed']=True
           (out/'root-labels.txt').write_text('\n'.join(n.get('text','') for n in nodes(xml) if n.get('text'))+'\n')
           if click(xml,'Appearance'):
            appearance=capture('appearance')
            if click(appearance,'Theme'):
             capture('builtin_theme_post_preview');back();appearance=capture('appearance_after_preview_back')
            back();xml=capture('settings_root_after_appearance_back')
           if click(xml,'Sites'):
            capture('sites_picker');back();xml=capture('settings_root_after_sites_back')
           back();capture('main_after_settings_back')
           safe=out/'safe-local-reference.png'
           import zlib
           def chunk(tag,data):return struct.pack('>I',len(data))+tag+data+struct.pack('>I',zlib.crc32(tag+data)&0xffffffff)
           safe.write_bytes(b'\x89PNG\r\n\x1a\n'+chunk(b'IHDR',struct.pack('>IIBBBBB',16,16,8,2,0,0,0))+chunk(b'IDAT',zlib.compress(b''.join(b'\0'+bytes([24,130,98])*16 for i in range(16))))+chunk(b'IEND',b''))
           adb('push',str(safe),'/sdcard/Download/clover-safe-reference.png')
           local_launch=adb('shell','am','start','-W','-a','android.intent.action.VIEW','-t','image/png','-d','file:///sdcard/Download/clover-safe-reference.png','-n','org.floens.chan/.ui.activity.BoardActivity',check=False)
           (out/'safe-viewer-attempt.txt').write_text(local_launch)
           capture('safe_local_media_view_attempt')
           result['live_catalog_thread_not_captured']='No live board was opened, avoiding unreviewed sensitive thumbnails/content. Built-in theme preview renders the real PostCell with bundled safe sample text; media attempt uses only a generated16x16local PNG.'
           result['result']='PASS exact fonts and focused safe reference UI captured'
          except Exception as e:
           result['result']='FAIL';result['error']=str(e);(out/'error.txt').write_text(traceback.format_exc())
           try:capture('failure')
           except Exception:pass
          finally:
           result['captures']=screens;(out/'result.json').write_text(json.dumps(result,indent=2)+'\n')
           try:(out/'logcat-tail.txt').write_text(adb('logcat','-d','-t','200',check=False))
           except Exception:pass
           print(json.dumps(result,indent=2),flush=True)
          if result.get('result')=='FAIL':raise SystemExit(1)
          PYCODE
      - name: Install and inspect Clover Settings on accelerated emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 31
          target: google_apis
          arch: x86_64
          avd-name: clover-settings-reference-ci
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none -memory 2048 -cores 2 -skin 480x800
          disable-animations: true
          script: python3 "$RUNNER_TEMP/clover-inspect.py"
      - name: Upload reference evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: clover-fonts-reader-runtime
          path: ${{ env.CLOVER_ARTIFACT_DIR }}/
          retention-days: 14
          if-no-files-found: warn
