name: Instrumentation tests

# The androidTest sources in app, feature:settings and feature:downloads were compiled by ci.yml
# but never executed — running them needs an emulator, which needs KVM. GitHub's ubuntu runners
# expose nested virtualisation, so they can. This is a separate workflow rather than a job in
# ci.yml because an emulator boot plus a test run is minutes of wall clock, and it should not sit
# in the path of every lint fix.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: instrumentation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  instrumentation:
    name: Instrumentation tests (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Both ends of the supported range. 31 is minSdk and the one that earns its minutes:
        # it is where predictive back is absent, the notification-permission branch is live, and
        # edge-to-edge is opt-in rather than enforced. A green run on 35 alone says nothing about
        # the devices minSdk 31 admits.
        api-level: [31, 35]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true

      - name: Set up JDK and Gradle
        uses: ./.github/actions/setup-jdk-gradle

      # The runner ships KVM but leaves it root-owned; without this the emulator silently falls
      # back to software rendering and the job times out rather than failing usefully.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The emulator runner downloads the system image and platform itself, and a truncated
      # download fails the job with "Error on ZipFile unknown archive" before any test runs.
      # Cache them, and on a miss install them here with retries, clearing partial downloads.
      - name: System image cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: sysimg-cache
        with:
          path: |
            /usr/local/lib/android/sdk/system-images/android-${{ matrix.api-level }}
            /usr/local/lib/android/sdk/platforms/android-${{ matrix.api-level }}
          key: sysimg-${{ matrix.api-level }}-google_apis-x86_64

      - name: Install system image
        if: steps.sysimg-cache.outputs.cache-hit != 'true'
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          PACKAGES="system-images;android-${{ matrix.api-level }};google_apis;x86_64 platforms;android-${{ matrix.api-level }} emulator"
          for attempt in 1 2 3; do
            if yes | "$SDKMANAGER" --install $PACKAGES > /dev/null; then
              exit 0
            fi
            echo "sdkmanager attempt $attempt failed; clearing partial downloads" >&2
            rm -rf "$ANDROID_HOME/.temp" "$HOME/.android/cache"
            sleep $((attempt * 15))
          done
          exit 1

      - name: AVD cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ matrix.api-level }}

      # Booting once on a cache miss and saving the snapshot turns a ~4 minute cold boot into
      # seconds on subsequent runs.
      - name: Create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      - name: Resolve modules with instrumentation tests
        run: |
          TASKS=$(find . -type d -path '*/src/androidTest' -not -path './build/*' \
            | sed 's|^\./||; s|/src/androidTest$||; s|/|:|g; s|^|:|; s|$|:connectedDebugAndroidTest|' \
            | sort | tr '\n' ' ')
          if [ -z "$TASKS" ]; then
            echo "No androidTest sources found" >&2
            exit 1
          fi
          echo "Running: $TASKS"
          echo "INSTRUMENTATION_TASKS=$TASKS" >> "$GITHUB_ENV"

      - name: Run instrumentation tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew $INSTRUMENTATION_TASKS --continue; S=$?; timeout 60 adb logcat -d > logcat-api-${{ matrix.api-level }}.txt 2>&1; exit $S

      - name: Summarise logcat
        if: failure()
        run: |
          echo "--- app and test process lines ---"
          grep -iE "orbin|AndroidRuntime|FATAL|ActivityManager.*com\.orbin" \
            "logcat-api-${{ matrix.api-level }}.txt" | tail -200 || true

      - name: Upload logcat
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logcat-api-${{ matrix.api-level }}
          path: logcat-api-${{ matrix.api-level }}.txt
          if-no-files-found: ignore

      - name: Upload instrumentation reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: instrumentation-reports-api-${{ matrix.api-level }}
          path: |
            **/build/reports/androidTests/**
            **/build/outputs/androidTest-results/**
          if-no-files-found: ignore
