name: Instrumentation tests

# The androidTest sources in app, feature:settings and feature:downloads were compiled by ci.yml
# but never executed — running them needs an emulator, which needs KVM. GitHub's ubuntu runners
# expose nested virtualisation, so they can. This is a separate workflow rather than a job in
# ci.yml because an emulator boot plus a test run is minutes of wall clock, and it should not sit
# in the path of every lint fix.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: instrumentation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  instrumentation:
    name: Instrumentation tests (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # The app's minSdk is 35, so there is nothing below it to test against. A second, higher
        # level can be added here when one is worth the minutes.
        api-level: [35]

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # The runner ships KVM but leaves it root-owned; without this the emulator silently falls
      # back to software rendering and the job times out rather than failing usefully.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ matrix.api-level }}

      # Booting once on a cache miss and saving the snapshot turns a ~4 minute cold boot into
      # seconds on subsequent runs.
      - name: Create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      # Only the modules that actually have androidTest sources. A blanket
      # `connectedDebugAndroidTest` also builds, installs and runs an empty instrumentation APK for
      # every other module, which fails outright: the convention plugins name AndroidJUnitRunner as
      # the runner for all of them but only these depend on it. Discovering the list keeps it
      # correct as modules gain and lose test sources.
      #
      # Resolved in its own step because the emulator action hands `script:` to `sh -c` as one
      # string, where a multi-line command substitution does not survive.
      - name: Resolve modules with instrumentation tests
        run: |
          TASKS=$(find . -type d -path '*/src/androidTest' -not -path './build/*' \
            | sed 's|^\./||; s|/src/androidTest$||; s|/|:|g; s|^|:|; s|$|:connectedDebugAndroidTest|' \
            | sort | tr '\n' ' ')
          if [ -z "$TASKS" ]; then
            echo "No androidTest sources found" >&2
            exit 1
          fi
          echo "Running: $TASKS"
          echo "INSTRUMENTATION_TASKS=$TASKS" >> "$GITHUB_ENV"

      - name: Run instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # Compose tests wait on idleness, which never arrives while animations run.
          disable-animations: true
          # Logcat has to be pulled here, not in a later step: the action tears the emulator down
          # when this step ends, and `adb logcat -d` against no device blocks rather than failing.
          script: |
            set +e
            ./gradlew $INSTRUMENTATION_TASKS --continue
            GRADLE_STATUS=$?
            timeout 60 adb logcat -d > logcat-api-${{ matrix.api-level }}.txt 2>&1
            exit $GRADLE_STATUS

      # Instrumentation failures usually report only that a test failed; the reason is in logcat.
      - name: Summarise logcat
        if: failure()
        run: |
          echo "--- app and test process lines ---"
          grep -iE "orbin|AndroidRuntime|FATAL|ActivityManager.*com\.orbin" \
            "logcat-api-${{ matrix.api-level }}.txt" | tail -200 || true

      - name: Upload logcat
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: logcat-api-${{ matrix.api-level }}
          path: logcat-api-${{ matrix.api-level }}.txt
          if-no-files-found: ignore

      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: instrumentation-reports-api-${{ matrix.api-level }}
          path: |
            **/build/reports/androidTests/**
            **/build/outputs/androidTest-results/**
          if-no-files-found: ignore
