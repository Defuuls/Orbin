name: Instrumentation tests

# The androidTest sources in app, feature:settings and feature:downloads were compiled by ci.yml
# but never executed — running them needs an emulator, which needs KVM. GitHub's ubuntu runners
# expose nested virtualisation, so they can. This is a separate workflow rather than a job in
# ci.yml because an emulator boot plus a test run is minutes of wall clock, and it should not sit
# in the path of every lint fix.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: instrumentation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  instrumentation:
    name: Instrumentation tests (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # The app's minSdk is 35, so there is nothing below it to test against. A second, higher
        # level can be added here when one is worth the minutes.
        api-level: [35]

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # The runner ships KVM but leaves it root-owned; without this the emulator silently falls
      # back to software rendering and the job times out rather than failing usefully.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ matrix.api-level }}

      # Booting once on a cache miss and saving the snapshot turns a ~4 minute cold boot into
      # seconds on subsequent runs.
      - name: Create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      - name: Run instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # Compose tests wait on idleness, which never arrives while animations run.
          disable-animations: true
          # Only the modules that actually have androidTest sources. A blanket
          # `connectedDebugAndroidTest` also builds, installs and runs an empty instrumentation APK
          # for every other module — which fails outright, since the convention plugin declares
          # AndroidJUnitRunner for all of them but only these provide the dependency. Discovering
          # the list keeps it correct as modules gain and lose test sources.
          script: |
            TASKS=$(find . -type d -path '*/src/androidTest' -not -path './build/*' \
              | sed 's|^\./||; s|/src/androidTest$||; s|/|:|g; s|^|:|; s|$|:connectedDebugAndroidTest|' \
              | sort | tr '\n' ' ')
            echo "Running: $TASKS"
            test -n "$TASKS" || { echo "No androidTest sources found"; exit 1; }
            ./gradlew $TASKS --continue

      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: instrumentation-reports-api-${{ matrix.api-level }}
          path: |
            **/build/reports/androidTests/**
            **/build/outputs/androidTest-results/**
          if-no-files-found: ignore
