name: New Version

# Prepares a release PR for Orbin: bumps the version, closes the [Unreleased]
# changelog section, and updates documentation that quotes the current release.
#
# The version is a number and a codename that travel together — "100" +
# "Sakura" become versionName "100-Sakura" and tag "v100-Sakura".
# Codenames are popular Japanese female names from v100 onward; do not reuse an
# existing Orbin release codename.

on:
  workflow_dispatch:
    inputs:
      version_number:
        description: 'Release number, for example 117'
        required: true
        type: string
      codename:
        description: 'Release codename — a popular Japanese female name, for example Sakura'
        required: true
        type: string
      version_code:
        description: 'Android versionCode, must be greater than the current value'
        required: true
        type: number
      base_branch:
        description: 'Branch to prepare the release from'
        required: true
        default: main
        type: string
      draft:
        description: 'Open the release PR as a draft'
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    name: Prepare release PR
    runs-on: ubuntu-latest
    env:
      VERSION_NUMBER: ${{ inputs.version_number }}
      CODENAME: ${{ inputs.codename }}
      VERSION_CODE: ${{ inputs.version_code }}
      BASE_BRANCH: ${{ inputs.base_branch }}
      DRAFT_PR: ${{ inputs.draft }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.base_branch }}
          fetch-depth: 0

      - name: Validate inputs
        run: |
          set -euo pipefail
          if ! [[ "$VERSION_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::error::version_number must be a whole number"; exit 1
          fi
          if ! [[ "$CODENAME" =~ ^[A-Za-z][A-Za-z0-9\ \'-]*$ ]]; then
            echo "::error::codename must be a readable name, e.g. Sakura"; exit 1
          fi
          if ! [[ "$VERSION_CODE" =~ ^[0-9]+$ ]]; then
            echo "::error::version_code must be a whole number"; exit 1
          fi
          CURRENT_CODE=$(grep -E '^orbin\.versionCode=[0-9]+$' gradle.properties | cut -d= -f2)
          if [ -z "$CURRENT_CODE" ]; then
            echo "::error::could not read orbin.versionCode from gradle.properties"; exit 1
          fi
          if [ "$VERSION_CODE" -le "$CURRENT_CODE" ]; then
            echo "::error::version_code must be greater than current versionCode $CURRENT_CODE"; exit 1
          fi
          VERSION_NAME="${VERSION_NUMBER}-${CODENAME// /-}"
          if git rev-parse "v${VERSION_NAME}" >/dev/null 2>&1; then
            echo "::error::tag v${VERSION_NAME} already exists"; exit 1
          fi
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"

      - name: Update version metadata, changelog and docs
        run: |
          set -euo pipefail
          python3 <<'PY'
          import os, re
          from datetime import date
          from pathlib import Path

          number = os.environ["VERSION_NUMBER"].strip()
          codename = " ".join(os.environ["CODENAME"].split())
          version_code = os.environ["VERSION_CODE"].strip()
          version_name = os.environ["VERSION_NAME"].strip()
          today = date.today().isoformat()
          base = "https://github.com/Defuuls/Orbin"

          props = Path("gradle.properties")
          text = props.read_text()
          text = re.sub(r'^orbin\.versionCode=\d+$', f'orbin.versionCode={version_code}', text, count=1, flags=re.M)
          text = re.sub(r'^orbin\.versionName=.+$', f'orbin.versionName={version_name}', text, count=1, flags=re.M)
          props.write_text(text)

          changelog = Path("CHANGELOG.md")
          text = changelog.read_text()
          if f"## [{version_name}]" in text:
              raise SystemExit(f"CHANGELOG.md already contains {version_name}")
          previous = re.search(r'^## \[([^\]]+)\] - ', text, flags=re.M)
          if not previous:
              raise SystemExit("Could not find the previous released version in CHANGELOG.md")
          previous = previous.group(1)
          text = text.replace("## [Unreleased]\n", f"## [Unreleased]\n\n## [{version_name}] - {today}\n", 1)
          text = re.sub(
              r'^\[Unreleased\]: .*$',
              f'[Unreleased]: {base}/compare/v{version_name}...HEAD\n'
              f'[{version_name}]: {base}/compare/v{previous.replace(" ", "-")}...v{version_name}',
              text, count=1, flags=re.M,
          )
          changelog.write_text(text)

          readme = Path("README.md")
          readme.write_text(re.sub(
              r'\*\*Current release:\*\* \[[^\]]+\]\([^)]+\)',
              f'**Current release:** [{number} — {codename}]({base}/releases/tag/v{version_name})',
              readme.read_text(), count=1))

          home = Path("docs/wiki/Home.md")
          home.write_text(re.sub(
              r'\| Current release \| \*\*[^*]+\*\* \([0-9-]+\) \|',
              f'| Current release | **v{number} — {codename}** ({today}) |',
              home.read_text(), count=1))
          PY

      - name: Verify the repository is consistent
        run: python3 scripts/validate_repo.py

      - name: Open release pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RELEASE_BRANCH="release/v$(echo "$VERSION_NAME" | tr '[:upper:]' '[:lower:]')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$RELEASE_BRANCH"
          git add gradle.properties CHANGELOG.md README.md docs/wiki/Home.md
          git commit -m "chore: Prepare v${VERSION_NAME} release"
          git push --set-upstream origin "$RELEASE_BRANCH"

          BODY=$(cat <<EOF
          ## Summary
          - bump Orbin to ${VERSION_NAME} / versionCode ${VERSION_CODE}
          - close the [Unreleased] changelog section as ${VERSION_NAME}
          - update current-release pointers in README.md and docs/wiki/Home.md

          After merging, push the tag to publish:
          \`\`\`
          git tag -a v${VERSION_NAME} -m "${CODENAME}" && git push origin v${VERSION_NAME}
          \`\`\`
          EOF
          )

          DRAFT_FLAG=""
          if [ "$DRAFT_PR" = "true" ]; then DRAFT_FLAG="--draft"; fi
          gh pr create --base "$BASE_BRANCH" --head "$RELEASE_BRANCH" \
            --title "chore: Prepare v${VERSION_NAME} release" --body "$BODY" $DRAFT_FLAG
