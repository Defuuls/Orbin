name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static-analysis:
    name: Lint & static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: ktlint
        run: ./gradlew ktlintCheck --continue

      - name: detekt
        run: ./gradlew detekt --continue

      # ktlint and detekt read Kotlin as a language; only Android Lint knows about API levels,
      # manifests and resources. Existing findings are recorded in per-module lint-baseline.xml,
      # so this gates new ones.
      - name: Android Lint
        run: ./gradlew lint --continue

      - name: Upload analysis reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: static-analysis-reports
          path: |
            **/build/reports/detekt/**
            **/build/reports/ktlint/**
            **/build/reports/lint-results-*.html
            **/build/reports/lint-results-*.sarif
          if-no-files-found: ignore

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run JVM unit tests
        run: ./gradlew test --continue -Porbin.warningsAsErrors=true

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports
          path: '**/build/reports/tests/**'
          if-no-files-found: ignore

  build-debug:
    name: Build debug APK
    runs-on: ubuntu-latest
    needs: [static-analysis, unit-tests]
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Assemble debug APK
        run: ./gradlew assembleDebug -Porbin.warningsAsErrors=true

      # Compiles the androidTest sources in app, feature:settings and feature:downloads. They are
      # not executed here — that needs an emulator — but without this they are built nowhere in CI
      # and can rot silently against the code they are meant to guard.
      - name: Compile instrumentation tests
        run: ./gradlew assembleDebugAndroidTest -Porbin.warningsAsErrors=true

      - name: Upload debug APKs
        uses: actions/upload-artifact@v7
        with:
          name: orbin-debug-apk
          # Both shipped apps: the full client and the pared-back subscription reader. They are
          # separate applicationIds and install side by side, so both are worth having to hand.
          path: |
            app/build/outputs/apk/debug/*.apk
            app-minimal/build/outputs/apk/debug/*.apk
          if-no-files-found: error
