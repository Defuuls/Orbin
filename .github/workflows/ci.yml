name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static-analysis:
    name: Lint & static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The consistency check verifies CHANGELOG link refs against the real
          # tag list. A default checkout is shallow and carries no tags, which
          # would make every ref look like it points at a missing tag. Tags
          # only — full history is not needed here.
          fetch-tags: true
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: ktlint
        run: ./gradlew ktlintCheck --continue

      - name: detekt
        run: ./gradlew detekt --continue

      # ktlint and detekt read Kotlin as a language; only Android Lint knows about API levels,
      # manifests and resources. Existing findings are recorded in per-module lint-baseline.xml,
      # so this gates new ones.
      - name: Android Lint
        run: ./gradlew lint --continue

      # The version is written in gradle.properties but quoted in README,
      # docs/wiki/Home.md and CHANGELOG. Nothing used to hold those in step:
      # v85-v89 all shipped versionCode 107, and README has been left a
      # release behind more than once. This also checks the CHANGELOG's link
      # refs resolve to real tags — 38 of 102 headings once had none at all.
      - name: Repository consistency
        run: python3 scripts/validate_repo.py

      # Prose only. Kotlin source is excluded in .codespellrc: API names like
      # OptIn and launchIn trip the dictionary, and a check with 40 false
      # positives is one nobody reads.
      - name: Spell check prose
        run: |
          python3 -m pip install --quiet codespell
          git ls-files -z '*.md' '*.html' '*/values/strings.xml' | xargs -0 codespell

      - name: Upload analysis reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: static-analysis-reports
          path: |
            **/build/reports/detekt/**
            **/build/reports/ktlint/**
            **/build/reports/lint-results-*.html
            **/build/reports/lint-results-*.sarif
          if-no-files-found: ignore

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run JVM unit tests
        run: ./gradlew test --continue -Porbin.warningsAsErrors=true

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports
          path: '**/build/reports/tests/**'
          if-no-files-found: ignore

  build-debug:
    name: Build debug APK
    runs-on: ubuntu-latest
    needs: [static-analysis, unit-tests]
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Assemble debug APK
        run: ./gradlew assembleDebug -Porbin.warningsAsErrors=true

      # Compiles the androidTest sources in app, feature:settings and feature:downloads. They are
      # not executed here — that needs an emulator — but without this they are built nowhere in CI
      # and can rot silently against the code they are meant to guard.
      - name: Compile instrumentation tests
        run: ./gradlew assembleDebugAndroidTest -Porbin.warningsAsErrors=true

      - name: Upload debug APKs
        uses: actions/upload-artifact@v7
        with:
          name: orbin-debug-apk
          # Both shipped apps: the full client and the pared-back subscription reader. They are
          # separate applicationIds and install side by side, so both are worth having to hand.
          path: |
            app/build/outputs/apk/debug/*.apk
            app-minimal/build/outputs/apk/debug/*.apk
          if-no-files-found: error
