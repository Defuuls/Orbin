name: Baseline profile

# Records a baseline profile on an emulator and opens a PR with the result.
#
# The documentation used to say this had no CI path because generation needs a rooted device. The
# runner's `google_apis` image *is* rootable — only `google_apis_playstore` is not — so it does.
# Manual rather than automatic: a profile is worth re-recording when startup or the feed changes
# shape, not on every push, and each run costs an emulator boot plus a release-shaped build.

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    name: Generate baseline profile
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Record profile
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          # google_apis, not google_apis_playstore: only the former allows `adb root`, which the
          # macrobenchmark tooling needs to read the compiled profile back off the device.
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # One line: the action runs each line of `script:` as its own `sh -c`.
          #
          # `assembleDebug` first because profile generation builds the release-shaped
          # `nonMinifiedRelease` variant, whose signing config borrows the debug key when no release
          # secrets are present — and AGP only creates `debug.keystore` when it actually signs a
          # debug build. On a fresh runner nothing has, so validateSigning fails on a missing file.
          script: adb root; ./gradlew :app:assembleDebug && ./gradlew :app:generateReleaseBaselineProfile

      - name: Show what was generated
        run: |
          find app/src/release/generated -name '*.txt' -print -exec wc -l {} \; || true

      - name: Open a pull request with the profile
        uses: peter-evans/create-pull-request@v8
        with:
          branch: claude/baseline-profile-generated
          add-paths: app/src/release/generated/**
          commit-message: |
            Record a baseline profile

            Generated by the Baseline profile workflow on an API 35 emulator.
          title: Record a baseline profile
          body: |
            Generated by the **Baseline profile** workflow on a rooted API 35 `google_apis`
            emulator, covering app startup and the subscribed feed.

            Re-record this when startup or the feed changes shape. A stale profile is not harmful,
            only progressively less useful.
          draft: true
