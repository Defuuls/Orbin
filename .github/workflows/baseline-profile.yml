name: Baseline profile

# Records a baseline profile on an emulator and opens a PR with the result.
#
# The documentation used to say this had no CI path because generation needs a rooted device. The
# runner's `google_apis` image *is* rootable — only `google_apis_playstore` is not — so it does.
# Relevant feature PRs generate an artifact for review without opening another PR. Monthly and
# manual runs retain the publishing path so the committed profile does not go stale.

on:
  pull_request:
    paths:
      - 'app/**'
      - 'benchmark/**'
      - 'core/model/**'
      - 'core/data/**'
      - 'core/reader/**'
      - 'core/ui/**'
      - 'core/designsystem/**'
      - 'domain/**'
      - 'feature/board/**'
      - 'feature/thread/**'
      - 'media/**'
      - 'ui-next/**'
      - '.github/workflows/baseline-profile.yml'
  workflow_dispatch:
  schedule:
    # 10:17 UTC on the 1st — odd minute to miss the top-of-hour rush.
    - cron: '17 10 1 * *'

concurrency:
  group: baseline-profile-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  collect:
    name: Record profile (${{ matrix.case }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        case: [startup, catalogList, catalogGrid, thread, files, twoPane]
    env:
      PROFILE_CASE: ${{ matrix.case }}
      PROFILE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up JDK and Gradle
        uses: ./.github/actions/setup-jdk-gradle
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prepare a fresh isolated case
        run: |
          set -euo pipefail
          rm -rf benchmark/build/intermediates/baselineprofiles/nonMinifiedRelease \
            benchmark/build/outputs/connected_android_test_additional_output/nonMinifiedRelease \
            benchmark/build/outputs/androidTest-results/connected/nonMinifiedRelease \
            app/src/release/generated/baselineProfiles
          echo "PROFILE_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - name: Record one profile case
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          emulator-build: '16428233' # 37.2.12
          force-avd-creation: false
          emulator-options: -no-snapshot -no-window -gpu swiftshader -noaudio -no-boot-anim -camera-back none -show-kernel
          disable-animations: true
          # One folded line: the action executes each script line in a separate shell.
          script: >-
            bash scripts/ensure_rooted_emulator.sh &&
            ./gradlew :app:assembleDebug &&
            ./gradlew :app:generateReleaseBaselineProfile
            '-Pandroid.testInstrumentationRunnerArguments.class=com.orbin.benchmark.BaselineProfileGenerator#${{ matrix.case }}'
      - name: Validate and export the recorded case
        run: |
          python3 benchmark/profile_artifacts.py export \
            --case "$PROFILE_CASE" \
            --producer-dir benchmark/build/intermediates/baselineprofiles/nonMinifiedRelease \
            --xml-dir benchmark/build/outputs/androidTest-results/connected/nonMinifiedRelease \
            --output-dir "$RUNNER_TEMP/profile-case" \
            --started-at "$PROFILE_STARTED_AT" \
            --head-sha "$PROFILE_HEAD_SHA" \
            --checkout-sha "$(git rev-parse HEAD)" \
            --tree-sha "$(git rev-parse 'HEAD^{tree}')" \
            --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            --api-level 35 --emulator-build 16428233
      - name: Upload the validated case
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: baseline-profile-case-${{ matrix.case }}
          path: ${{ runner.temp }}/profile-case/**
          if-no-files-found: error
          overwrite: true
      - name: Upload case diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: baseline-profile-diagnostics-${{ matrix.case }}
          path: |
            benchmark/build/outputs/connected_android_test_additional_output/**
            benchmark/build/reports/androidTests/**
            benchmark/build/outputs/androidTest-results/**
          if-no-files-found: warn
          overwrite: true

  generate:
    name: Generate baseline profile
    needs: collect
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PROFILE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Require every case to pass
        env:
          COLLECTION_RESULT: ${{ needs.collect.result }}
        run: |
          if [ "$COLLECTION_RESULT" != success ]; then
            echo '::error::All six isolated profile cases must pass before merging.'
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up JDK and Gradle
        uses: ./.github/actions/setup-jdk-gradle
      - name: Download the six validated cases
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: baseline-profile-case-*
          path: ${{ runner.temp }}/profile-cases
          merge-multiple: false
      - name: Validate provenance and restore genuine inputs
        run: |
          set -euo pipefail
          rm -rf benchmark/build/intermediates/baselineprofiles/nonMinifiedRelease \
            app/src/release/generated/baselineProfiles
          python3 benchmark/profile_artifacts.py aggregate \
            --artifacts-dir "$RUNNER_TEMP/profile-cases" \
            --producer-dir benchmark/build/intermediates/baselineprofiles/nonMinifiedRelease \
            --manifest "$RUNNER_TEMP/profile-aggregate.json" \
            --head-sha "$PROFILE_HEAD_SHA" \
            --checkout-sha "$(git rev-parse HEAD)" \
            --tree-sha "$(git rev-parse 'HEAD^{tree}')" \
            --run-id "$GITHUB_RUN_ID" --api-level 35 --emulator-build 16428233
      - name: Merge with the official profile plugin
        # Seed the debug key on this fresh worker too. The supported skip property disables
        # connected/collection actions while retaining the verified producer inputs and merge.
        run: >-
          ./gradlew :app:assembleDebug &&
          ./gradlew :app:generateReleaseBaselineProfile -Pandroidx.baselineprofile.skipgeneration=true
      - name: Verify the merged shipping profile
        run: |
          python3 benchmark/profile_artifacts.py verify-generated \
            --aggregate-manifest "$RUNNER_TEMP/profile-aggregate.json" \
            --producer-dir benchmark/build/intermediates/baselineprofiles/nonMinifiedRelease \
            --generated-dir app/src/release/generated/baselineProfiles \
            --manifest "$RUNNER_TEMP/profile-provenance.json"
      - name: Upload the recorded profile
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: baseline-profile
          path: app/src/release/generated/**
          if-no-files-found: error
          overwrite: true
      - name: Upload merged provenance
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: baseline-profile-provenance
          path: |
            ${{ runner.temp }}/profile-aggregate.json
            ${{ runner.temp }}/profile-provenance.json
          if-no-files-found: warn
          overwrite: true

  publish:
    name: Propose the generated profile
    if: github.event_name != 'pull_request'
    needs: generate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the generated profile
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: baseline-profile
          path: app/src/release/generated

      - name: Open a pull request with the profile
        if: github.event_name != 'pull_request'
        id: profile_pr
        continue-on-error: true
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: automation/baseline-profile
          add-paths: app/src/release/generated/**
          commit-message: |
            Record a baseline profile

            Generated by the Baseline profile workflow on an API 35 emulator.
          title: Record a baseline profile
          body: |
            Generated by the **Baseline profile** workflow on a rooted API 35 `google_apis`
            emulator, covering real app startup and populated catalog list/grid, thread, Files,
            and two-pane renderer journeys. Benchmark-only fixture classes are excluded.

            Re-record this when startup or the reader changes shape. A stale profile is not harmful,
            only progressively less useful.
          draft: true

      # Creating a pull request from a workflow needs "Allow GitHub Actions to create and approve
      # pull requests" (Settings -> Actions -> General). Without it this step fails in seconds, so
      # say which setting is missing rather than leaving a red run and no explanation. The profile
      # itself is already uploaded above, so the run has still produced what it exists to produce.
      - name: Explain a failed pull request
        if: github.event_name != 'pull_request' && steps.profile_pr.outcome != 'success'
        run: |
          echo "::warning::Could not open a pull request with the profile. Enable" \
            "'Allow GitHub Actions to create and approve pull requests' in Settings -> Actions ->" \
            "General, or download the 'baseline-profile' artifact from this run and commit it by hand."
