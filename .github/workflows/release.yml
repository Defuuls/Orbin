name: Release

# Every git tag matching v* triggers a full release build of the main client: signs the APK,
# generates release notes, and publishes a GitHub Release with the APK, the R8 mapping file,
# and SHA-256 checksums.
#
# Orbin Minimal is NOT released here. It is a separate app on its own version line and its own
# cadence — see release-minimal.yml, which triggers on minimal-v* tags. Publishing it from both
# would ship one APK under two version schemes.
# workflow_dispatch allows triggering a release manually when tag-push is unavailable.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to create and release (e.g. v101-Hana). Must not already exist.'
        required: true
        type: string
      base_ref:
        description: 'Branch or SHA to tag (defaults to main)'
        required: false
        default: main
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build, sign & publish release
    runs-on: ubuntu-latest
    env:
      # For tag-push events GITHUB_REF_NAME is the tag; for dispatch it is the branch.
      # RELEASE_TAG normalises this so all steps can use a single variable.
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so release notes can diff against the previous tag
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.base_ref || github.ref }}

      # The release title is derived from the tag rather than typed into the dispatch form, so the
      # two lines read the same way on a releases page that mixes them: v101-Hana becomes
      # "Orbin 101 - Hana" and minimal-v5-Aoi becomes "Orbin Minimal 5 - Aoi". It used to be
      # whatever the tag message said, which is how the full client's releases came to be titled
      # with a bare codename ("Hana") while Orbin Minimal's spelled out the app and its number.
      # The same string annotates the tag, so the tag message and the release title cannot drift.
      - name: Derive the release name
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          NUMBER="${VERSION%%-*}"
          CODENAME="${VERSION#*-}"
          if [ "$CODENAME" = "$NUMBER" ]; then
            RELEASE_NAME="Orbin ${NUMBER}"
          else
            # Tags hyphenate a multi-word codename (v48-Sirius-B); the title spaces it back out.
            RELEASE_NAME="Orbin ${NUMBER} - ${CODENAME//-/ }"
          fi
          echo "RELEASE_NAME=${RELEASE_NAME}" >> "$GITHUB_ENV"

      - name: Create and push annotated tag (dispatch only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --tags origin "${{ inputs.tag }}" | grep -q "${{ inputs.tag }}"; then
            echo "Tag ${{ inputs.tag }} already exists on remote — skipping creation."
          else
            git tag -a "${{ inputs.tag }}" -m "$RELEASE_NAME"
            git push origin "${{ inputs.tag }}"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 secret is not set"; exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/orbin-release.jks"
          echo "ORBIN_KEYSTORE_FILE=$RUNNER_TEMP/orbin-release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          ORBIN_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          ORBIN_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          ORBIN_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Locate artifacts and compute checksums
        id: artifacts
        run: |
          set -euo pipefail
          mkdir -p release-staging
          VERSION="${RELEASE_TAG}"

          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -n1)
          MAPPING=$(find app/build/outputs/mapping/release -name 'mapping.txt' | head -n1 || true)
          cp "$APK" "release-staging/orbin-${VERSION}.apk"
          ( cd release-staging && sha256sum "orbin-${VERSION}.apk" > "orbin-${VERSION}.apk.sha256" )
          if [ -n "$MAPPING" ]; then
            cp "$MAPPING" "release-staging/orbin-${VERSION}-mapping.txt"
            ( cd release-staging && sha256sum "orbin-${VERSION}-mapping.txt" > "orbin-${VERSION}-mapping.txt.sha256" )
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        id: notes
        run: |
          set -euo pipefail
          # Make sure the tag object itself is present: the step below walks from it, and a
          # shallow or lightweight ref is not enough to resolve "${RELEASE_TAG}^".
          git fetch --force origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          # Restrict to this app's own tags. Both APKs are tagged on the same
          # branch, so an unfiltered describe returns whichever tag is nearest —
          # v97-Penne's notes read "Changes since minimal-v1" because the minimal
          # app happened to release in between. minimal-v* does not match 'v*',
          # which is what separates the two lines here.
          PREV_TAG=$(git describe --tags --abbrev=0 --match 'v*' "${RELEASE_TAG}^" 2>/dev/null || true)
          echo "release_name=${RELEASE_NAME}" >> "$GITHUB_OUTPUT"
          {
            echo "## ${RELEASE_NAME}"
            echo
            if [ -n "$PREV_TAG" ]; then
              echo "### Changes since ${PREV_TAG}"
              git log --no-merges --pretty='- %s (%h)' "${PREV_TAG}..${RELEASE_TAG}"
            else
              echo "### Changes"
              git log --no-merges --pretty='- %s (%h)' "${RELEASE_TAG}"
            fi
            echo
            echo "### Verifying downloads"
            echo "Each artifact ships with a \`.sha256\` checksum. Verify with:"
            echo '```'
            echo "sha256sum -c orbin-${RELEASE_TAG}.apk.sha256"
            echo '```'
          } > release-notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ steps.notes.outputs.release_name }}
          body_path: release-notes.md
          files: |
            release-staging/*.apk
            release-staging/*.sha256
            release-staging/*-mapping.txt
          fail_on_unmatched_files: true
