name: Release

# Every git tag matching v* triggers a full release build of the main client: signs the APK,
# generates release notes, and publishes a GitHub Release with the APK and its SHA-256 checksum.
# The R8 mapping file is kept out of the release and uploaded as a workflow artifact instead: it
# is only needed to decode crash stack traces, not by anyone installing the app. On a public
# repository workflow artifacts can be downloaded by any signed-in GitHub user, so the mapping is
# not secret; it only keeps the release page free of it.
#
# Supply chain: every third-party action is pinned to a full commit SHA (Dependabot bumps the
# pins), the signing keystore only exists on disk for the single Gradle step that needs it, and
# only the App Store Connect secrets are passed on to the TestFlight workflow.
#
# Orbin Minimal is NOT released here. It is a separate app on its own version line and its own
# cadence — see release-minimal.yml, which triggers on minimal-v* tags. Publishing it from both
# would ship one APK under two version schemes.
# workflow_dispatch allows triggering a release manually when tag-push is unavailable.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to create and release (e.g. v101-Hana). Must not already exist.'
        required: true
        type: string
      base_ref:
        description: 'Branch or SHA to tag (defaults to main)'
        required: false
        default: main
        type: string

permissions:
  contents: read

jobs:
  release:
    name: Build, sign & publish release
    runs-on: ubuntu-latest
    permissions:
      # Pushes the dispatch tag and publishes the GitHub Release.
      contents: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.base_ref || github.ref }}

      - name: Validate the release tag
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+(-[A-Za-z0-9]+)*$ ]]; then
            echo "::error::Release tag '$RELEASE_TAG' must look like v101 or v101-Hana"; exit 1
          fi

      - name: Derive the release name
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          NUMBER="${VERSION%%-*}"
          CODENAME="${VERSION#*-}"
          if [ "$CODENAME" = "$NUMBER" ]; then
            RELEASE_NAME="Orbin ${NUMBER}"
          else
            RELEASE_NAME="Orbin ${NUMBER} - ${CODENAME//-/ }"
          fi
          echo "RELEASE_NAME=${RELEASE_NAME}" >> "$GITHUB_ENV"

      - name: Create and push annotated tag (dispatch only)
        if: github.event_name == 'workflow_dispatch'
        # The tag reaches the shell only through the validated RELEASE_TAG env var, never through
        # a ${{ }} expression inside the script.
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" > /dev/null; then
            echo "Tag ${RELEASE_TAG} already exists on remote — skipping creation."
          else
            git tag -a "${RELEASE_TAG}" -m "$RELEASE_NAME"
            git push origin "refs/tags/${RELEASE_TAG}"
          fi

      - name: Set up JDK and Gradle
        uses: ./.github/actions/setup-jdk-gradle
        with:
          # Never let a release build write the shared Gradle cache that other jobs restore.
          cache-read-only: 'true'

      - name: Release preflight
        run: |
          python3 scripts/validate_architecture.py
          python3 scripts/validate_repo.py
          ./gradlew :provider:api:test -Porbin.warningsAsErrors=true

      # The keystore is decoded, used and shredded inside this one step, and the Gradle daemon that
      # saw the passwords is stopped, so no later step (including third-party actions and their
      # post-job hooks) can read either from disk or from a lingering process.
      - name: Build signed release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          ORBIN_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          ORBIN_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          ORBIN_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 secret is not set"; exit 1
          fi
          export ORBIN_KEYSTORE_FILE="$RUNNER_TEMP/orbin-release.jks"
          cleanup() {
            ./gradlew --stop > /dev/null 2>&1 || true
            if [ -f "$ORBIN_KEYSTORE_FILE" ]; then shred -u "$ORBIN_KEYSTORE_FILE" || rm -f "$ORBIN_KEYSTORE_FILE"; fi
          }
          trap cleanup EXIT
          ( umask 077 && printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$ORBIN_KEYSTORE_FILE" )
          unset KEYSTORE_BASE64
          ./gradlew assembleRelease

      # Belt and braces: covers a cancelled run that skipped the trap above.
      - name: Remove signing keystore
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/orbin-release.jks" ]; then
            shred -u "$RUNNER_TEMP/orbin-release.jks" || rm -f "$RUNNER_TEMP/orbin-release.jks"
          fi

      - name: Locate artifacts and compute checksums
        id: artifacts
        run: |
          set -euo pipefail
          mkdir -p release-staging
          VERSION="${RELEASE_TAG}"

          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -n1)
          MAPPING=$(find app/build/outputs/mapping/release -name 'mapping.txt' | head -n1 || true)
          cp "$APK" "release-staging/orbin-${VERSION}.apk"
          ( cd release-staging && sha256sum "orbin-${VERSION}.apk" > "orbin-${VERSION}.apk.sha256" )
          # Staged apart from release-staging so the release's file globs cannot pick it up.
          if [ -n "$MAPPING" ]; then
            mkdir -p mapping-staging
            cp "$MAPPING" "mapping-staging/orbin-${VERSION}-mapping.txt"
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Keep the R8 mapping file as a workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: orbin-${{ env.RELEASE_TAG }}-mapping
          path: mapping-staging/
          # The longest a public repository keeps an artifact; decode crashes from a release
          # within this window, or rebuild the tag to regenerate its mapping.
          retention-days: 90
          if-no-files-found: warn

      - name: Generate release notes
        id: notes
        run: |
          set -euo pipefail
          git fetch --force origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          PREV_TAG=$(git describe --tags --abbrev=0 --match 'v*' "${RELEASE_TAG}^" 2>/dev/null || true)
          echo "release_name=${RELEASE_NAME}" >> "$GITHUB_OUTPUT"
          {
            echo "## ${RELEASE_NAME}"
            echo
            if [ -n "$PREV_TAG" ]; then
              echo "### Changes since ${PREV_TAG}"
              git log --no-merges --pretty='- %s (%h)' "${PREV_TAG}..${RELEASE_TAG}"
            else
              echo "### Changes"
              git log --no-merges --pretty='- %s (%h)' "${RELEASE_TAG}"
            fi
            echo
            echo "### Verifying downloads"
            echo "Each artifact ships with a \`.sha256\` checksum. Verify with:"
            echo '```'
            echo "sha256sum -c orbin-${RELEASE_TAG}.apk.sha256"
            echo '```'
          } > release-notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ steps.notes.outputs.release_name }}
          body_path: release-notes.md
          files: |
            release-staging/*.apk
            release-staging/*.sha256
          fail_on_unmatched_files: true

  # Upload the same release to TestFlight for the iOS app. It skips itself, with a notice, until
  # the App Store Connect secrets are configured (docs/ios.md).
  testflight:
    name: TestFlight
    needs: release
    uses: ./.github/workflows/testflight.yml
    permissions:
      contents: read
    # Only what TestFlight needs; the Android signing secrets stay in the release job.
    secrets:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
    with:
      ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
