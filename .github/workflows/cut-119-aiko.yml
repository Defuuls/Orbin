name: Cut Orbin 119 Aiko

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/cut-119-aiko.yml'
      - 'gradle.properties'
      - 'CHANGELOG.md'
      - 'README.md'
      - 'docs/wiki/Home.md'

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  cut:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Decide whether to prepare or publish
        id: state
        shell: bash
        run: |
          set -euo pipefail
          if grep -qx 'orbin.versionName=119-Aiko' gradle.properties; then
            echo 'mode=publish' >> "$GITHUB_OUTPUT"
          else
            echo 'mode=prepare' >> "$GITHUB_OUTPUT"
          fi

      - name: Validate release name
        if: steps.state.outputs.mode == 'prepare'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          if git tag --list | grep -Eiq '(^|[-])Aiko$'; then
            echo '::error::Aiko is already used by an existing release tag'; exit 1
          fi
          test -z "$(git tag --list 'v119-Aiko')"

      - name: Prepare release metadata
        if: steps.state.outputs.mode == 'prepare'
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import re
          from datetime import date
          from pathlib import Path

          today = date.today().isoformat()
          base = 'https://github.com/Defuuls/Orbin'

          props = Path('gradle.properties')
          text = props.read_text()
          text = re.sub(r'^orbin\.versionCode=\d+$', 'orbin.versionCode=137', text, count=1, flags=re.M)
          text = re.sub(r'^orbin\.versionName=.+$', 'orbin.versionName=119-Aiko', text, count=1, flags=re.M)
          props.write_text(text)

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text()
          if '## [119-Aiko]' not in text:
              section = f'''## [119-Aiko] - {today}\n\n### Performance\n- Bounded complete-thread caching to stabilize memory during long browsing sessions.\n- Removed whole-feed minute-tick rebuilds and limited feed autoplay to one visible video player.\n- Scoped visited-history queries, reduced encrypted scroll-position writes, and consolidated thread presentation indexes.\n- Added low-RAM image-cache tuning, foreground-aware media preloading, and expanded startup/feed Macrobenchmark coverage with CI performance gates.\n\n### Fixed\n- Preserved exact thread scroll position around media viewing while reducing persistence overhead.\n'''
              text = text.replace('## [Unreleased]\n', f'## [Unreleased]\n\n{section}\n', 1)
              text = re.sub(
                  r'^\[Unreleased\]: .*$',
                  f'[Unreleased]: {base}/compare/v119-Aiko...HEAD\n[119-Aiko]: {base}/compare/v118-Hotaru...v119-Aiko',
                  text,
                  count=1,
                  flags=re.M,
              )
          changelog.write_text(text)

          readme = Path('README.md')
          text = readme.read_text()
          text = re.sub(
              r'\*\*Current release:\*\* \[[^\]]+\]\([^)]+\)',
              f'**Current release:** [119 — Aiko]({base}/releases/tag/v119-Aiko)',
              text,
              count=1,
          )
          readme.write_text(text)

          home = Path('docs/wiki/Home.md')
          text = home.read_text()
          text = re.sub(
              r'\| Current release \| \*\*[^*]+\*\* \([0-9-]+\) \|',
              f'| Current release | **v119 — Aiko** ({today}) |',
              text,
              count=1,
          )
          home.write_text(text)
          PY
          python3 scripts/validate_repo.py

      - name: Push release-prep branch and open PR
        if: steps.state.outputs.mode == 'prepare'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B release/prep-v119-aiko
          git add gradle.properties CHANGELOG.md README.md docs/wiki/Home.md
          git commit -m 'chore: Prepare Orbin 119 Aiko release'
          git push --force-with-lease --set-upstream origin release/prep-v119-aiko
          if ! gh pr view release/prep-v119-aiko --json number >/dev/null 2>&1; then
            gh pr create --base main --head release/prep-v119-aiko \
              --title 'chore: Prepare v119-Aiko release' \
              --body $'## Summary\n- bump Orbin to 119-Aiko / versionCode 137\n- close the Unreleased changelog section with the four-phase performance program\n- update current-release documentation\n\nAfter this PR merges, the cutter dispatches the signed v119-Aiko release.'
          fi

      - name: Validate merged release metadata
        if: steps.state.outputs.mode == 'publish'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          grep -qx 'orbin.versionCode=137' gradle.properties
          grep -qx 'orbin.versionName=119-Aiko' gradle.properties
          test -z "$(git tag --list 'v119-Aiko')"
          python3 scripts/validate_repo.py

      - name: Dispatch signed release build
        if: steps.state.outputs.mode == 'publish'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run release.yml --ref main -f tag=v119-Aiko -f base_ref=main
