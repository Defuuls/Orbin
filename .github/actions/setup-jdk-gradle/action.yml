name: Set up JDK and Gradle
description: Temurin JDK 17 plus gradle/actions/setup-gradle (shared cache across jobs).

inputs:
  cache-disabled:
    description: Disable the Gradle action cache (use for CodeQL clean builds).
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Set up JDK 17
      uses: actions/setup-java@v6.0.0
      with:
        distribution: temurin
        java-version: '17'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        cache-disabled: ${{ inputs.cache-disabled }}
