name: Set up JDK and Gradle
description: Temurin JDK 17 plus gradle/actions/setup-gradle (shared cache across jobs).

inputs:
  cache-disabled:
    description: Disable the Gradle action cache (use for CodeQL clean builds).
    required: false
    default: 'false'
  cache-read-only:
    description: Restore the Gradle cache without writing it back (use for release builds).
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Set up JDK 17
      uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
      with:
        distribution: temurin
        java-version: '17'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      with:
        cache-disabled: ${{ inputs.cache-disabled }}
        cache-read-only: ${{ inputs.cache-read-only == 'true' || (github.event.repository != null && github.ref_name != github.event.repository.default_branch) }}
