version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    # Let a new release age a week before proposing it, so a hijacked or yanked version is
    # usually caught upstream first.
    cooldown:
      default-days: 7
    groups:
      android-build:
        patterns:
          - "com.android.*"
          - "com.google.devtools.ksp"
          - "org.jetbrains.kotlin.*"
      androidx:
        patterns:
          - "androidx.*"
      media:
        patterns:
          - "androidx.media3:*"
    open-pull-requests-limit: 10

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Actions are pinned to commit SHAs; Dependabot updates the SHA and its version comment.
    cooldown:
      default-days: 7
