// Compose compiler stability configuration, shared by every Compose module (Android and KMP).
// See https://developer.android.com/develop/ui/compose/performance/stability/fix#configuration-file
//
// Types listed here are treated as stable, so Compose compares them with equals() and can skip
// a composable whose inputs are equal instead of comparing references. Only list types that are
// never mutated after they are handed to the UI.

// Read-only standard collections. Orbin builds these once (map/filter/mapTo/buildList) and
// replaces them on change; it never mutates a List/Set/Map after passing it to a composable.
kotlin.collections.List
kotlin.collections.Set
kotlin.collections.Map
kotlin.collections.Collection

// Orbin's domain models: deeply immutable data classes (vals and read-only collections only),
// compiled in a module without the Compose compiler, so Compose can't infer their stability.
com.orbin.core.model.**
