AutoName: Orbin
Summary: Read-only Android client for imageboards, starting with 4chan
Description: |-
    Orbin is a browsing client for imageboards. It reads boards, catalogs
    and threads. It does not post, reply, or create threads.

    4chan is a first-class site via the bundled Vichan-compatible provider.
    BBW Chan is included via LynxChan. Additional engines can be added
    through the ImageBoardProvider interface.

    Local data is encrypted at rest (SQLCipher and an encrypted DataStore).
    An always-on keyword filter hides shock and illegal terms; an optional
    setting extends that list with everyday words.

