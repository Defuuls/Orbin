  <text x="437" y="595" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="800" fill="#202431">edition</text>
  <text x="437" y="624" font-family="Inter, Arial, sans-serif" font-size="11.5" fill="#697183">1h ago</text>
  <text x="519" y="624" font-family="Inter, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#697183">156 ↩</text>

  <rect x="595" y="430" width="156" height="220" rx="18" fill="#F8F9FC" stroke="#E4E7EE"/>
  <rect x="605" y="440" width="136" height="92" rx="12" fill="#E2DAEF"/>
  <rect x="617" y="452" width="36" height="20" rx="10" fill="#FFFFFF" fill-opacity="0.92"/>
  <text x="626" y="466" font-family="Inter, Arial, sans-serif" font-size="10.5" font-weight="800" fill="#72559A">/lit/</text>
  <text x="607" y="557" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#666D7B">Reading list for</text>
  <text x="607" y="576" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#666D7B">winter</text>
  <text x="607" y="624" font-family="Inter, Arial, sans-serif" font-size="11.5" fill="#8B92A1">3h ago · read</text>

  <!-- bottom gesture bar -->
  <rect x="528" y="687" width="120" height="5" rx="2.5" fill="#B6BBC6"/>

  <!-- Right feature cards -->
  <rect x="824" y="112" width="286" height="158" rx="26" fill="#FFFFFF"/>
  <rect x="850" y="138" width="42" height="42" rx="12" fill="#DCE6FF"/>
  <path d="M860 153h22M860 160h16M860 167h19" stroke="#274B9F" stroke-width="2.4" stroke-linecap="round"/>
  <text x="850" y="207" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="900" fill="#202431">Save links</text>
  <text x="850" y="230" font-family="Inter, Arial, sans-serif" font-size="12.5" fill="#596171">Deduplicated thread URLs → .txt</text>
  <text x="850" y="249" font-family="Inter, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#274B9F">Downloads/Orbin by default</text>

  <rect x="824" y="292" width="286" height="158" rx="26" fill="#FFFFFF"/>
  <rect x="850" y="318" width="42" height="42" rx="12" fill="#E8F6EF"/>
  <path d="M860 339l7 7 15-17" stroke="#226642" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="850" y="387" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="900" fill="#202431">Provider contracts</text>
  <text x="850" y="410" font-family="Inter, Arial, sans-serif" font-size="12.5" fill="#596171">Vichan + LynxChan normalized</text>
  <text x="850" y="429" font-family="Inter, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#226642">BBW Chan tolerant parsing</text>

  <rect x="824" y="472" width="286" height="158" rx="26" fill="#FFFFFF"/>
  <rect x="850" y="498" width="42" height="42" rx="12" fill="#F0F4FF"/>
  <path d="M863 516a8 8 0 0 1 16 0v6" stroke="#274B9F" stroke-width="2.6" fill="none"/>
  <rect x="859" y="522" width="24" height="18" rx="4" fill="#274B9F"/>
  <text x="850" y="567" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="900" fill="#202431">Private by design</text>
  <text x="850" y="590" font-family="Inter, Arial, sans-serif" font-size="12.5" fill="#596171">Encrypted local data + safe diagnostics</text>
  <text x="850" y="609" font-family="Inter, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#274B9F">No URLs or thread IDs logged</text>
</svg>
