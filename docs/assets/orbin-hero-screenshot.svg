<svg width="1200" height="760" viewBox="0 0 1200 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" data-release-version="124-Airi">
  <title id="title">Orbin grid-first feed on a compact Android phone</title>
  <desc id="desc">Screenshot-style illustration of Orbin 124 Airi showing the adaptive two-column thread grid on a compact phone, readable thread titles, provider-aware browsing, Save links export, and privacy-focused diagnostics.</desc>
