  <text x="576" y="314" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#202431">normalized</text>
  <text x="432" y="480" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#202431">Subjects get</text>
  <text x="432" y="498" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#202431">room to breathe</text>
  <text x="576" y="480" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#596171">Read state stays</text>
