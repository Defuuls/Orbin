  <rect x="120" y="214" width="168" height="40" rx="20" fill="#DCE6FF"/>
  <text id="release-label" x="142" y="240" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#274B9F">124 · Airi</text>
