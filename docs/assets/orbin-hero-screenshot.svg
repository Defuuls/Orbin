<svg width="1200" height="760" viewBox="0 0 1200 760" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Orbin grid-first feed on a compact Android phone</title>
  <desc id="desc">Screenshot-style illustration of Orbin 121 Yuki showing the adaptive two-column thread grid on a compact phone, with readable thread titles, board labels, activity, media previews, an Images alternate view, Save links export, and privacy-focused provider diagnostics.</desc>

  <rect width="1200" height="760" fill="#F4F6FA"/>

  <!-- Left product panel -->
  <rect x="92" y="114" width="250" height="518" rx="30" fill="#FFFFFF"/>
  <text x="124" y="166" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="900" fill="#202431">Orbin</text>
  <text x="124" y="196" font-family="Inter, Arial, sans-serif" font-size="14" fill="#5A6272">Android imageboard browser</text>

  <rect x="124" y="226" width="142" height="34" rx="17" fill="#DCE6FF"/>
  <text x="145" y="248" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800" fill="#274B9F">121 · Yuki</text>

  <text x="124" y="304" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800" fill="#202431">GRID-FIRST</text>
  <text x="124" y="329" font-family="Inter, Arial, sans-serif" font-size="13" fill="#596171">Readable on compact phones</text>
  <rect x="124" y="350" width="186" height="8" rx="4" fill="#E5E9F2"/>
  <rect x="124" y="368" width="154" height="8" rx="4" fill="#E5E9F2"/>

  <text x="124" y="418" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800" fill="#202431">READ-ONLY</text>
  <text x="124" y="443" font-family="Inter, Arial, sans-serif" font-size="13" fill="#596171">Browse · watch · save · export</text>
  <rect x="124" y="464" width="166" height="8" rx="4" fill="#E5E9F2"/>
  <rect x="124" y="482" width="118" height="8" rx="4" fill="#E5E9F2"/>

  <rect x="124" y="534" width="186" height="58" rx="18" fill="#F0F4FF"/>
  <text x="142" y="558" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="800" fill="#274B9F">Vichan + LynxChan</text>
  <text x="142" y="578" font-family="Inter, Arial, sans-serif" font-size="11.5" fill="#596171">provider-contract validated</text>

  <!-- Compact phone -->
  <rect x="392" y="32" width="392" height="696" rx="42" fill="#17181D"/>
  <rect x="405" y="46" width="366" height="668" rx="32" fill="#FAFBFF"/>

  <!-- Status / top rail -->
  <rect x="405" y="46" width="366" height="82" rx="32" fill="#EEF2FF"/>
  <text x="430" y="82" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#677087">FEED</text>
  <text x="430" y="108" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="800" fill="#1E2433">8 threads · 3 boards</text>
  <circle cx="735" cy="86" r="15" fill="#DCE6FF"/>
  <path d="M730 86h10M735 81v10" stroke="#274B9F" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Layout selector -->
  <rect x="425" y="142" width="326" height="42" rx="16" fill="#FFFFFF" stroke="#E2E6EF"/>
  <rect x="434" y="149" width="132" height="28" rx="12" fill="#DCE6FF"/>
  <text x="477" y="168" font-family="Inter, Arial, sans-serif" font-size="12.5" font-weight="800" fill="#274B9F">Grid</text>
  <text x="641" y="168" font-family="Inter, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#687083">Images</text>

  <!-- Two-column readable card grid -->
  <!-- Row 1 -->
  <rect x="425" y="198" width="156" height="218" rx="18" fill="#FFFFFF" stroke="#E4E7EE"/>
  <rect x="435" y="208" width="136" height="92" rx="12" fill="#C9D7F5"/>
  <rect x="447" y="220" width="36" height="20" rx="10" fill="#FFFFFF" fill-opacity="0.92"/>
