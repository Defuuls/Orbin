  <text x="437" y="325" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="800" fill="#202431">Home server on</text>
  <text x="437" y="344" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="800" fill="#202431">ARM that actually</text>
  <text x="437" y="363" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="800" fill="#202431">works?</text>
  <text x="437" y="390" font-family="Inter, Arial, sans-serif" font-size="11.5" fill="#697183">4m ago</text>
  <text x="523" y="390" font-family="Inter, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#697183">218 ↩</text>

  <rect x="595" y="198" width="156" height="218" rx="18" fill="#FFFFFF" stroke="#E4E7EE"/>
  <rect x="605" y="208" width="136" height="92" rx="12" fill="#D7E7D8"/>
  <rect x="617" y="220" width="40" height="20" rx="10" fill="#FFFFFF" fill-opacity="0.92"/>
  <text x="626" y="234" font-family="Inter, Arial, sans-serif" font-size="10.5" font-weight="800" fill="#287348">/ck/</text>
  <text x="607" y="325" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="800" fill="#202431">What did you cook</text>
  <text x="607" y="344" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="800" fill="#202431">this week?</text>
  <text x="607" y="390" font-family="Inter, Arial, sans-serif" font-size="11.5" fill="#697183">31m ago</text>
  <text x="693" y="390" font-family="Inter, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#697183">47 ↩</text>

  <!-- Row 2 -->
  <rect x="425" y="430" width="156" height="220" rx="18" fill="#FFFFFF" stroke="#E4E7EE"/>
  <rect x="435" y="440" width="136" height="92" rx="12" fill="#F0DCCB"/>
  <circle cx="549" cy="510" r="14" fill="#17181D" fill-opacity="0.62"/>
  <path d="M545 503l10 7-10 7z" fill="#FFFFFF"/>
  <rect x="447" y="452" width="34" height="20" rx="10" fill="#FFFFFF" fill-opacity="0.92"/>
  <text x="456" y="466" font-family="Inter, Arial, sans-serif" font-size="10.5" font-weight="800" fill="#8A5C2D">/p/</text>
  <text x="437" y="557" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="800" fill="#202431">Film photography</text>
