<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Orbin brand showcase</title>
  <desc id="desc">Hero showcase of Orbin redesign with frosted glass, floating pill, and night theater identity.</desc>
  <defs>
    <!-- Vector aperture logo -->
    <g id="aperture-mark-vector" fill="#E8E4DC">
      <path d="M-18.74,-98.23 L-4.71,-99.89 L9.41,-99.56 L23.34,-97.24 L36.81,-92.98 L49.55,-86.86 L61.29,-79.02 L71.81,-69.59 L80.90,-58.78 L88.38,-46.79 L94.09,-33.87 L97.92,-20.28 L99.80,-6.28 L30.43,-9.89 Q21.63,-29.77 0.00,-32.00 Z"/>
      <path d="M87.63,-48.18 L93.54,-35.35 L97.59,-21.81 L99.69,-7.85 L99.80,6.28 L97.92,20.28 L94.09,33.87 L88.38,46.79 L80.90,58.78 L71.81,69.59 L61.29,79.02 L49.55,86.86 L36.81,92.98 L18.81,25.89 Q35.00,11.37 30.43,-9.89 Z"/>
      <path d="M72.90,68.45 L62.52,78.04 L50.90,86.07 L38.27,92.39 L24.87,96.86 L10.97,99.40 L-3.14,99.95 L-17.19,98.51 L-30.90,95.11 L-43.99,89.80 L-56.21,82.71 L-67.30,73.96 L-77.05,63.74 L-18.81,25.89 Q0.00,36.80 18.81,25.89 Z"/>
      <path d="M-42.58,90.48 L-54.90,83.58 L-66.13,75.01 L-76.04,64.94 L-84.43,53.58 L-91.14,41.15 L-96.03,27.90 L-99.00,14.09 L-100.00,0.00 L-99.00,-14.09 L-96.03,-27.90 L-91.14,-41.15 L-84.43,-53.58 L-30.43,-9.89 Q-35.00,11.37 -18.81,25.89 Z"/>
      <path d="M-99.21,-12.53 L-96.46,-26.39 L-91.78,-39.71 L-85.26,-52.25 L-77.05,-63.74 L-67.30,-73.96 L-56.21,-82.71 L-43.99,-89.80 L-30.90,-95.11 L-17.19,-98.51 L-3.14,-99.95 L10.97,-99.40 L24.87,-96.86 L-0.00,-32.00 Q-21.63,-29.77 -30.43,-9.89 Z"/>
    </g>
    <clipPath id="phone-clip">
      <rect x="1000" y="80" width="400" height="740" rx="40"/>
    </clipPath>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3D5A80;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#12141A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8B919C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0A0A0C;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad3" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#C45C26;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#12141A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1C1E26;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0A0A0C;stop-opacity:1" />
    </linearGradient>
    
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1600" height="900" fill="#0A0A0C"/>
  <rect width="1600" height="900" fill="url(#grad4)" opacity="0.4"/>

  <!-- Left Side Text & Typography -->
  <g transform="translate(180, 200)">
    <g transform="translate(0, 50) scale(0.6)">
      <use href="#aperture-mark-vector"/>
    </g>
    <text x="120" y="80" font-family="Inter, Arial, Helvetica, sans-serif" font-size="64" font-weight="700" fill="#E8E4DC" letter-spacing="1">Orbin</text>
    <text x="0" y="180" font-family="Inter, Arial, Helvetica, sans-serif" font-size="32" font-weight="600" fill="#E8E4DC">Dim the room. Let the board fill the frame.</text>
    <text x="0" y="230" font-family="Inter, Arial, Helvetica, sans-serif" font-size="22" fill="#8B919C" line-height="1.5">Privacy-focused, read-only imageboard browser with a</text>
    <text x="0" y="265" font-family="Inter, Arial, Helvetica, sans-serif" font-size="22" fill="#8B919C" line-height="1.5">cinematic night theater identity.</text>

    <!-- Palette Swatches -->
    <g transform="translate(0, 360)">
      <text x="0" y="-20" font-family="Inter, Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#3D5A80" letter-spacing="3">PALETTE</text>
      <rect x="0" y="0" width="60" height="60" rx="12" fill="#0A0A0C" stroke="#1C1E26" stroke-width="2"/>
      <rect x="80" y="0" width="60" height="60" rx="12" fill="#12141A"/>
      <rect x="160" y="0" width="60" height="60" rx="12" fill="#8B919C"/>
      <rect x="240" y="0" width="60" height="60" rx="12" fill="#E8E4DC"/>
      <rect x="320" y="0" width="60" height="60" rx="12" fill="#C45C26"/>
      <rect x="400" y="0" width="60" height="60" rx="12" fill="#3D5A80"/>
      
      <text x="30" y="90" text-anchor="middle" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#E8E4DC">Void</text>
      <text x="110" y="90" text-anchor="middle" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#E8E4DC">Stage</text>
      <text x="190" y="90" text-anchor="middle" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#E8E4DC">Fog</text>
      <text x="270" y="90" text-anchor="middle" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#E8E4DC">Beam</text>
      <text x="350" y="90" text-anchor="middle" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#E8E4DC">Ember</text>
      <text x="430" y="90" text-anchor="middle" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#E8E4DC">Soft key</text>
    </g>

    <g transform="translate(0, 520)">
        <text x="0" y="0" font-family="Inter, Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#3D5A80" letter-spacing="3">FEATURES</text>
        <text x="0" y="30" font-family="Inter, Arial, Helvetica, sans-serif" font-size="18" fill="#E8E4DC">? Immersive edge-to-edge media</text>
        <text x="0" y="60" font-family="Inter, Arial, Helvetica, sans-serif" font-size="18" fill="#E8E4DC">? Frosted glass & floating app bars</text>
        <text x="0" y="90" font-family="Inter, Arial, Helvetica, sans-serif" font-size="18" fill="#E8E4DC">? Floating bottom pill navigation</text>
        <text x="0" y="120" font-family="Inter, Arial, Helvetica, sans-serif" font-size="18" fill="#E8E4DC">? Dense multi-column walls</text>
    </g>
  </g>

  <!-- Phone Hardware Frame -->
  <rect x="992" y="72" width="416" height="756" rx="48" fill="#1C1E26" stroke="#2B2F3A" stroke-width="2"/>
  <rect x="1000" y="80" width="400" height="740" rx="40" fill="#0A0A0C"/>

  <!-- Phone Screen Content (Clipped) -->
  <g clip-path="url(#phone-clip)">
    <!-- 2 Column Feed Gallery -->
    <rect x="1000" y="80" width="400" height="740" fill="#0A0A0C"/>

    <!-- Left Column -->
    <!-- Card 1 -->
    <g transform="translate(1012, 50)">
        <rect x="0" y="0" width="182" height="240" rx="16" fill="url(#grad1)"/>
        <rect x="0" y="180" width="182" height="60" rx="16" fill="#12141A" opacity="0.85"/>
        <text x="12" y="204" font-family="Inter, Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#E8E4DC">Neon cityscapes and long exposures</text>
        <text x="12" y="222" font-family="Inter, Arial, Helvetica, sans-serif" font-size="11" fill="#8B919C">/p/ A 42 replies</text>
        <!-- Ember indicator -->
        <circle cx="160" cy="215" r="4" fill="#C45C26"/>
    </g>

    <!-- Card 2 -->
    <g transform="translate(1012, 300)">
        <rect x="0" y="0" width="182" height="190" rx="16" fill="url(#grad2)"/>
        <rect x="0" y="130" width="182" height="60" rx="16" fill="#12141A" opacity="0.85"/>
        <text x="12" y="154" font-family="Inter, Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#E8E4DC">Mechanical keyboard build log</text>
        <text x="12" y="172" font-family="Inter, Arial, Helvetica, sans-serif" font-size="11" fill="#8B919C">/g/ A 120 replies</text>
    </g>

    <!-- Card 3 -->
    <g transform="translate(1012, 500)">
        <rect x="0" y="0" width="182" height="280" rx="16" fill="url(#grad3)"/>
        <rect x="0" y="220" width="182" height="60" rx="16" fill="#12141A" opacity="0.85"/>
        <text x="12" y="244" font-family="Inter, Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#E8E4DC">Local LLM benchmarking thread</text>
        <text x="12" y="262" font-family="Inter, Arial, Helvetica, sans-serif" font-size="11" fill="#8B919C">/g/ A 14 replies</text>
    </g>

    <!-- Right Column -->
    <!-- Card 4 -->
    <g transform="translate(1206, 120)">
        <rect x="0" y="0" width="182" height="280" rx="16" fill="url(#grad3)"/>
        <rect x="0" y="220" width="182" height="60" rx="16" fill="#12141A" opacity="0.85"/>
        <text x="12" y="244" font-family="Inter, Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#E8E4DC">Arch Linux setup showcase</text>
        <text x="12" y="262" font-family="Inter, Arial, Helvetica, sans-serif" font-size="11" fill="#8B919C">/g/ A 300 replies</text>
    </g>

    <!-- Card 5 -->
    <g transform="translate(1206, 410)">
        <rect x="0" y="0" width="182" height="180" rx="16" fill="url(#grad1)"/>
        <rect x="0" y="120" width="182" height="60" rx="16" fill="#12141A" opacity="0.85"/>
        <text x="12" y="144" font-family="Inter, Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#E8E4DC">Retro console restoration</text>
        <text x="12" y="162" font-family="Inter, Arial, Helvetica, sans-serif" font-size="11" fill="#8B919C">/vr/ A 18 replies</text>
    </g>

    <!-- Card 6 -->
    <g transform="translate(1206, 600)">
        <rect x="0" y="0" width="182" height="200" rx="16" fill="url(#grad2)"/>
        <rect x="0" y="140" width="182" height="60" rx="16" fill="#12141A" opacity="0.85"/>
        <text x="12" y="164" font-family="Inter, Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#E8E4DC">Weekly server administration</text>
        <text x="12" y="182" font-family="Inter, Arial, Helvetica, sans-serif" font-size="11" fill="#8B919C">/g/ A 88 replies</text>
        <circle cx="160" cy="175" r="4" fill="#C45C26"/>
    </g>


    <!-- Frosted Top App Bar -->
    <g>
        <rect x="1000" y="80" width="400" height="90" fill="#0A0A0C" opacity="0.6"/>
        <!-- A simple backdrop filter representation since SVGs can be tricky, we just use a rectangle with opacity -->
        <rect x="1000" y="80" width="400" height="90" fill="#12141A" opacity="0.65" style="backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);"/>
        
        <!-- Header Content -->
        <g transform="translate(1020, 115) scale(0.25)">
            <use href="#aperture-mark-vector"/>
        </g>
        <text x="1060" y="138" font-family="Inter, Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#E8E4DC">Feed</text>
        <!-- Search icon -->
        <circle cx="1350" cy="130" r="8" fill="none" stroke="#E8E4DC" stroke-width="2"/>
        <line x1="1356" y1="136" x2="1362" y2="142" stroke="#E8E4DC" stroke-width="2" stroke-linecap="round"/>
        <!-- Settings icon -->
        <circle cx="1310" cy="130" r="2" fill="#E8E4DC"/>
        <circle cx="1310" cy="122" r="2" fill="#E8E4DC"/>
        <circle cx="1310" cy="138" r="2" fill="#E8E4DC"/>
    </g>

    <!-- Floating Bottom Pill -->
    <g transform="translate(1080, 720)">
        <rect x="0" y="0" width="240" height="64" rx="32" fill="#12141A" stroke="#1C1E26" stroke-width="1.5" style="box-shadow: 0 8px 32px rgba(0,0,0,0.5);"/>
        
        <!-- Tab 1: Feed (Active - Soft Key) -->
        <rect x="8" y="8" width="68" height="48" rx="24" fill="#3D5A80"/>
        <!-- Feed Icon -->
        <rect x="36" y="24" width="12" height="16" rx="2" fill="#E8E4DC"/>
        <rect x="20" y="24" width="12" height="16" rx="2" fill="#E8E4DC"/>
        
        <!-- Tab 2: Downloads -->
        <!-- Download Icon -->
        <path d="M120 22 L120 34 M114 28 L120 36 L126 28 M112 40 L128 40" fill="none" stroke="#8B919C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        
        <!-- Tab 3: Boards -->
        <!-- List Icon -->
        <line x1="186" y1="24" x2="204" y2="24" stroke="#8B919C" stroke-width="2" stroke-linecap="round"/>
        <line x1="186" y1="32" x2="204" y2="32" stroke="#8B919C" stroke-width="2" stroke-linecap="round"/>
        <line x1="186" y1="40" x2="204" y2="40" stroke="#8B919C" stroke-width="2" stroke-linecap="round"/>
        <circle cx="178" cy="24" r="1.5" fill="#8B919C"/>
        <circle cx="178" cy="32" r="1.5" fill="#8B919C"/>
        <circle cx="178" cy="40" r="1.5" fill="#8B919C"/>
    </g>
    
  </g>
</svg>
