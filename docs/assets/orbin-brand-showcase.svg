<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Orbin brand showcase — cinematic night theater</title>
  <desc id="desc">Aperture mark, void palette, and product posture for Orbin's night-mode native identity.</desc>

  <defs>
    <g id="aperture-mark" fill="#E8E4DC">
        <path d="M0.00,-100.00 L46.33,-95.34 L78.63,-61.79 L10.49,-21.59 Z"/>
        <path d="M95.11,-30.90 L99.05,13.78 L83.06,55.69 L23.77,3.31 Z"/>
        <path d="M58.78,80.90 L17.50,98.46 L-27.30,96.20 L4.20,23.63 Z"/>
        <path d="M-58.78,80.90 L-88.23,47.07 L-99.93,3.77 L-21.17,11.30 Z"/>
        <path d="M-95.11,-30.90 L-72.03,-69.37 L-34.46,-93.87 L-17.29,-16.65 Z"/>
      <circle cx="0" cy="0" r="24" fill="#0A0A0C"/>
      <circle cx="0" cy="0" r="24" fill="none" stroke="#E8E4DC" stroke-width="2.5"/>
    </g>
  </defs>

  <rect width="1600" height="900" fill="#0A0A0C"/>
  <rect x="72" y="72" width="620" height="756" rx="28" fill="#12141A"/>

  <g transform="translate(382 300)">
    <use href="#aperture-mark" transform="scale(1.9)"/>
  </g>

  <text x="382" y="560" text-anchor="middle" font-family="Inter, Arial, Helvetica, sans-serif" font-size="64" font-weight="600" fill="#E8E4DC" letter-spacing="2">Orbin</text>
  <text x="382" y="604" text-anchor="middle" font-family="Inter, Arial, Helvetica, sans-serif" font-size="20" fill="#8B919C">Dim the room. Let the board fill the frame.</text>

  <text x="780" y="140" font-family="Inter, Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#3D5A80" letter-spacing="3">IDENTITY</text>
  <text x="780" y="188" font-family="Inter, Arial, Helvetica, sans-serif" font-size="36" font-weight="600" fill="#E8E4DC">Night theater</text>
  <text x="780" y="228" font-family="Inter, Arial, Helvetica, sans-serif" font-size="18" fill="#8B919C">Immersive · media-first · night-mode native</text>
  <text x="780" y="268" font-family="Inter, Arial, Helvetica, sans-serif" font-size="18" fill="#8B919C">Privacy-focused, read-only imageboard browser</text>

  <text x="780" y="340" font-family="Inter, Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#3D5A80" letter-spacing="3">PALETTE</text>

