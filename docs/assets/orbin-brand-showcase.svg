    <rect x="780" y="368" width="100" height="100" rx="16" fill="#0A0A0C" stroke="#1C1E26" stroke-width="2"/>
    <text x="830" y="492" text-anchor="middle" font-size="13" font-weight="600" fill="#E8E4DC">Void</text>
    <text x="830" y="512" text-anchor="middle" font-size="12" fill="#8B919C">#0A0A0C</text>

    <rect x="900" y="368" width="100" height="100" rx="16" fill="#12141A"/>
    <text x="950" y="492" text-anchor="middle" font-size="13" font-weight="600" fill="#E8E4DC">Stage</text>
    <text x="950" y="512" text-anchor="middle" font-size="12" fill="#8B919C">#12141A</text>

    <rect x="1020" y="368" width="100" height="100" rx="16" fill="#8B919C"/>
    <text x="1070" y="492" text-anchor="middle" font-size="13" font-weight="600" fill="#E8E4DC">Fog</text>
    <text x="1070" y="512" text-anchor="middle" font-size="12" fill="#8B919C">#8B919C</text>

    <rect x="1140" y="368" width="100" height="100" rx="16" fill="#E8E4DC"/>
    <text x="1190" y="492" text-anchor="middle" font-size="13" font-weight="600" fill="#E8E4DC">Beam</text>
    <text x="1190" y="512" text-anchor="middle" font-size="12" fill="#8B919C">#E8E4DC</text>

    <rect x="1260" y="368" width="100" height="100" rx="16" fill="#C45C26"/>
    <text x="1310" y="492" text-anchor="middle" font-size="13" font-weight="600" fill="#E8E4DC">Ember</text>
    <text x="1310" y="512" text-anchor="middle" font-size="12" fill="#8B919C">#C45C26</text>

    <rect x="1380" y="368" width="100" height="100" rx="16" fill="#3D5A80"/>
    <text x="1430" y="492" text-anchor="middle" font-size="13" font-weight="600" fill="#E8E4DC">Soft key</text>
    <text x="1430" y="512" text-anchor="middle" font-size="12" fill="#8B919C">#3D5A80</text>
