<svg width="1600" height="1040" viewBox="0 0 1600 1040" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Orbin brand showcase</title>
  <desc id="desc">A dark brand board presenting Orbin's redesigned broken-orbit O logo, monochrome variants, color palette, small-size icon behavior, and brand positioning.</desc>
  <defs>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.34"/>
    </filter>
    <clipPath id="appIconClip">
      <rect x="0" y="0" width="216" height="216" rx="52"/>
    </clipPath>
  </defs>

  <rect width="1600" height="1040" fill="#0D0D11"/>
  <circle cx="1390" cy="-10" r="300" fill="#171717"/>
  <circle cx="1490" cy="90" r="190" fill="#212121" opacity="0.74"/>

  <text x="96" y="104" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="8">ORBIN</text>
  <text x="96" y="180" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="64" font-weight="800">Built to browse. Not to perform.</text>
  <text x="96" y="226" fill="#A9A9B2" font-family="Inter, Arial, sans-serif" font-size="24">A privacy-focused, read-only Android imageboard browser with a mark built around motion, restraint, and clarity.</text>

  <!-- Primary app icon -->
  <g transform="translate(96 310)" filter="url(#shadow)">
    <rect width="360" height="360" rx="88" fill="#171717"/>
    <g transform="translate(72 72) scale(2)">
      <path fill="#FFFFFF" fill-rule="evenodd" d="M54,20 C35.22,20 20,35.22 20,54 C20,72.78 35.22,88 54,88 C69.13,88 81.95,78.12 86.36,64.47 L73.77,60.89 C70.93,69.02 63.19,74.85 54.08,74.85 C42.65,74.85 33.38,65.58 33.38,54.15 C33.38,42.72 42.65,33.45 54.08,33.45 C63.20,33.45 70.95,39.30 73.78,47.46 L86.37,43.89 C81.99,30.18 69.15,20.25 54,20.25 Z M54,43.2 C60.02,43.2 64.9,48.08 64.9,54.1 C64.9,60.12 60.02,65 54,65 C47.98,65 43.1,60.12 43.1,54.1 C43.1,48.08 47.98,43.2 54,43.2 Z"/>
      <path fill="#FFFFFF" d="M67.5,22.4 L91.2,15.8 L84.6,39.5 L79.2,31.9 L67.5,22.4 Z"/>
      <path fill="#FFFFFF" d="M87,47 A6,6 0,1 0,87,59 A6,6 0,1 0,87,47 Z"/>
    </g>
  </g>

  <text x="96" y="724" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700">The orbital O</text>
  <text x="96" y="760" fill="#A9A9B2" font-family="Inter, Arial, sans-serif" font-size="18">The broken ring is the product's motion. The open counter keeps it legible.</text>
  <text x="96" y="790" fill="#A9A9B2" font-family="Inter, Arial, sans-serif" font-size="18">The wedge pushes forward. The node turns the mark from a generic circle into Orbin.</text>

  <!-- Anatomy -->
  <g transform="translate(560 310)">
    <rect width="420" height="360" rx="36" fill="#151519" stroke="#28282F"/>
    <text x="36" y="52" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">MARK ANATOMY</text>
    <g transform="translate(36 88)">
      <circle cx="104" cy="104" r="92" fill="#0D0D11" stroke="#34343C"/>
      <g transform="translate(50 50)">
        <path fill="#FFFFFF" fill-rule="evenodd" d="M54,20 C35.22,20 20,35.22 20,54 C20,72.78 35.22,88 54,88 C69.13,88 81.95,78.12 86.36,64.47 L73.77,60.89 C70.93,69.02 63.19,74.85 54.08,74.85 C42.65,74.85 33.38,65.58 33.38,54.15 C33.38,42.72 42.65,33.45 54.08,33.45 C63.20,33.45 70.95,39.30 73.78,47.46 L86.37,43.89 C81.99,30.18 69.15,20.25 54,20.25 Z M54,43.2 C60.02,43.2 64.9,48.08 64.9,54.1 C64.9,60.12 60.02,65 54,65 C47.98,65 43.1,60.12 43.1,54.1 C43.1,48.08 47.98,43.2 54,43.2 Z"/>
        <path fill="#FFFFFF" d="M67.5,22.4 L91.2,15.8 L84.6,39.5 L79.2,31.9 L67.5,22.4 Z"/>
        <path fill="#FFFFFF" d="M87,47 A6,6 0,1 0,87,59 A6,6 0,1 0,87,47 Z"/>
      </g>
      <line x1="224" y1="48" x2="325" y2="48" stroke="#555560" stroke-width="2"/>
      <circle cx="224" cy="48" r="4" fill="#FFFFFF"/>
      <text x="238" y="40" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">Trajectory wedge</text>
      <text x="238" y="60" fill="#8F8F99" font-family="Inter, Arial, sans-serif" font-size="13">direction + speed</text>
      <line x1="208" y1="118" x2="325" y2="118" stroke="#555560" stroke-width="2"/>
      <circle cx="208" cy="118" r="4" fill="#FFFFFF"/>
      <text x="222" y="110" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">Broken orbit</text>
      <text x="222" y="130" fill="#8F8F99" font-family="Inter, Arial, sans-serif" font-size="13">recognizable O silhouette</text>
      <line x1="208" y1="186" x2="325" y2="186" stroke="#555560" stroke-width="2"/>
      <circle cx="208" cy="186" r="4" fill="#FFFFFF"/>
      <text x="222" y="178" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">Satellite node</text>
      <text x="222" y="198" fill="#8F8F99" font-family="Inter, Arial, sans-serif" font-size="13">ownable detail at small size</text>
    </g>
  </g>

  <!-- Palette -->
  <g transform="translate(1032 310)">
    <rect width="472" height="360" rx="36" fill="#151519" stroke="#28282F"/>
    <text x="36" y="52" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">CORE PALETTE</text>
    <g transform="translate(36 90)">
      <rect width="116" height="116" rx="24" fill="#0D0D11" stroke="#34343C"/>
      <text x="0" y="146" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">Orbit black</text>
      <text x="0" y="168" fill="#8F8F99" font-family="Inter, Arial, sans-serif" font-size="13">#0D0D11</text>
      <rect x="142" width="116" height="116" rx="24" fill="#171717" stroke="#34343C"/>
      <text x="142" y="146" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">Icon field</text>
      <text x="142" y="168" fill="#8F8F99" font-family="Inter, Arial, sans-serif" font-size="13">#171717</text>
      <rect x="284" width="116" height="116" rx="24" fill="#212121" stroke="#34343C"/>
      <text x="284" y="146" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">Surface</text>
      <text x="284" y="168" fill="#8F8F99" font-family="Inter, Arial, sans-serif" font-size="13">#212121</text>
      <rect y="205" width="400" height="68" rx="20" fill="#FFFFFF"/>
      <text x="22" y="247" fill="#0D0D11" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800">WHITE MARK / SYSTEM-TINT READY</text>
    </g>
  </g>

  <!-- Small size behavior -->
  <g transform="translate(560 724)">
    <text x="0" y="0" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">SMALL-SIZE BEHAVIOR</text>
    <g transform="translate(0 28)">
      <g transform="translate(0 0)">
        <rect width="144" height="144" rx="36" fill="#171717"/>
        <g transform="translate(18 18)">
          <path fill="#FFFFFF" fill-rule="evenodd" d="M54,20 C35.22,20 20,35.22 20,54 C20,72.78 35.22,88 54,88 C69.13,88 81.95,78.12 86.36,64.47 L73.77,60.89 C70.93,69.02 63.19,74.85 54.08,74.85 C42.65,74.85 33.38,65.58 33.38,54.15 C33.38,42.72 42.65,33.45 54.08,33.45 C63.20,33.45 70.95,39.30 73.78,47.46 L86.37,43.89 C81.99,30.18 69.15,20.25 54,20.25 Z M54,43.2 C60.02,43.2 64.9,48.08 64.9,54.1 C64.9,60.12 60.02,65 54,65 C47.98,65 43.1,60.12 43.1,54.1 C43.1,48.08 47.98,43.2 54,43.2 Z"/>
          <path fill="#FFFFFF" d="M67.5,22.4 L91.2,15.8 L84.6,39.5 L79.2,31.9 L67.5,22.4 Z"/>
          <path fill="#FFFFFF" d="M87,47 A6,6 0,1 0,87,59 A6,6 0,1 0,87,47 Z"/>
        </g>
        <text x="0" y="174" fill="#8F8F99" font-family="Inter, Arial, sans-serif" font-size="13">144 px</text>
      </g>
      <g transform="translate(186 24)">
        <rect width="96" height="96" rx="24" fill="#171717"/>
        <g transform="translate(0 0) scale(.8889)">
          <path fill="#FFFFFF" fill-rule="evenodd" d="M54,20 C35.22,20 20,35.22 20,54 C20,72.78 35.22,88 54,88 C69.13,88 81.95,78.12 86.36,64.47 L73.77,60.89 C70.93,69.02 63.19,74.85 54.08,74.85 C42.65,74.85 33.38,65.58 33.38,54.15 C33.38,42.72 42.65,33.45 54.08,33.45 C63.20,33.45 70.95,39.30 73.78,47.46 L86.37,43.89 C81.99,30.18 69.15,20.25 54,20.25 Z M54,43.2 C60.02,43.2 64.9,48.08 64.9,54.1 C64.9,60.12 60.02,65 54,65 C47.98,65 43.1,60.12 43.1,54.1 C43.1,48.08 47.98,43.2 54,43.2 Z"/>
          <path fill="#FFFFFF" d="M67.5,22.4 L91.2,15.8 L84.6,39.5 L79.2,31.9 L67.5,22.4 Z"/>
          <path fill="#FFFFFF" d="M87,47 A6,6 0,1 0,87,59 A6,6 0,1 0,87,47 Z"/>
        </g>
        <text x="0" y="126" fill="#8F8F99" font-family="Inter, Arial, sans-serif" font-size="13">96 px</text>
      </g>
      <g transform="translate(326 42)">
        <rect width="60" height="60" rx="16" fill="#171717"/>
        <g transform="translate(0 0) scale(.5556)">
          <path fill="#FFFFFF" fill-rule="evenodd" d="M54,20 C35.22,20 20,35.22 20,54 C20,72.78 35.22,88 54,88 C69.13,88 81.95,78.12 86.36,64.47 L73.77,60.89 C70.93,69.02 63.19,74.85 54.08,74.85 C42.65,74.85 33.38,65.58 33.38,54.15 C33.38,42.72 42.65,33.45 54.08,33.45 C63.20,33.45 70.95,39.30 73.78,47.46 L86.37,43.89 C81.99,30.18 69.15,20.25 54,20.25 Z M54,43.2 C60.02,43.2 64.9,48.08 64.9,54.1 C64.9,60.12 60.02,65 54,65 C47.98,65 43.1,60.12 43.1,54.1 C43.1,48.08 47.98,43.2 54,43.2 Z"/>
          <path fill="#FFFFFF" d="M67.5,22.4 L91.2,15.8 L84.6,39.5 L79.2,31.9 L67.5,22.4 Z"/>
          <path fill="#FFFFFF" d="M87,47 A6,6 0,1 0,87,59 A6,6 0,1 0,87,47 Z"/>
        </g>
        <text x="0" y="90" fill="#8F8F99" font-family="Inter, Arial, sans-serif" font-size="13">60 px</text>
      </g>
    </g>
  </g>

  <!-- Usage principles -->
  <g transform="translate(1032 724)">
    <text x="0" y="0" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">BRAND PRINCIPLES</text>
    <g transform="translate(0 34)">
      <text x="0" y="0" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700">01  Quiet confidence</text>
      <text x="0" y="26" fill="#8F8F99" font-family="Inter, Arial, sans-serif" font-size="14">Dark fields, strong contrast, no decorative noise.</text>
      <text x="0" y="78" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700">02  Motion without chaos</text>
      <text x="0" y="104" fill="#8F8F99" font-family="Inter, Arial, sans-serif" font-size="14">Use the orbit as a directional cue, not a space-theme costume.</text>
      <text x="0" y="156" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700">03  Privacy by posture</text>
      <text x="0" y="182" fill="#8F8F99" font-family="Inter, Arial, sans-serif" font-size="14">The brand observes. It does not shout, post, or perform.</text>
    </g>
  </g>

  <text x="96" y="988" fill="#5F5F69" font-family="Inter, Arial, sans-serif" font-size="14">ORBIN BRAND SHOWCASE · PRIMARY MARK / MONOCHROME / ANDROID ADAPTIVE ICON SYSTEM</text>
</svg>
