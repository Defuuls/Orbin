<svg width="1600" height="1100" viewBox="0 0 1600 1100" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Orbin brand showcase</title>
  <desc id="desc">A dark brand board presenting Orbin's broken-orbit O logo, mark anatomy, color palette, small-size icon behavior, and brand principles.</desc>
  <defs>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.34"/>
    </filter>
</defs>

  <rect width="1600" height="1100" fill="#0D0D11"/>
  <circle cx="1390" cy="-10" r="300" fill="#171717"/>
  <circle cx="1490" cy="90" r="190" fill="#212121" opacity="0.74"/>

  <text x="96" y="88" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="6">ORBIN</text>
  <text x="96" y="152" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="48" font-weight="800">Built to browse. Not to perform.</text>
  <text x="96" y="192" fill="#A9A9B2" font-family="Inter, Arial, sans-serif" font-size="20">A privacy-focused, read-only Android imageboard browser.</text>
  <text x="96" y="222" fill="#A9A9B2" font-family="Inter, Arial, sans-serif" font-size="20">The mark is built around motion, restraint, and clarity.</text>

  <!-- Column 1: primary icon + caption (width capped at 420) -->
  <g transform="translate(96 280)">
    <g filter="url(#shadow)">
      <rect width="360" height="360" rx="88" fill="#171717"/>
      <g transform="translate(72 72) scale(2)">
        <path fill="#FFFFFF" fill-rule="evenodd" d="M54,20 C35.22,20 20,35.22 20,54 C20,72.78 35.22,88 54,88 C69.13,88 81.95,78.12 86.36,64.47 L73.77,60.89 C70.93,69.02 63.19,74.85 54.08,74.85 C42.65,74.85 33.38,65.58 33.38,54.15 C33.38,42.72 42.65,33.45 54.08,33.45 C63.20,33.45 70.95,39.30 73.78,47.46 L86.37,43.89 C81.99,30.18 69.15,20.25 54,20.25 Z M54,43.2 C60.02,43.2 64.9,48.08 64.9,54.1 C64.9,60.12 60.02,65 54,65 C47.98,65 43.1,60.12 43.1,54.1 C43.1,48.08 47.98,43.2 54,43.2 Z"/>
      <path fill="#FFFFFF" d="M67.5,22.4 L91.2,15.8 L84.6,39.5 L79.2,31.9 L67.5,22.4 Z"/>
      <path fill="#FFFFFF" d="M87,47 A6,6 0,1 0,87,59 A6,6 0,1 0,87,47 Z"/>
      </g>
    </g>
    <text x="0" y="412" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700">The orbital O</text>
    <text x="0" y="448" fill="#A9A9B2" font-family="Inter, Arial, sans-serif" font-size="16">The broken ring is the product's motion.</text>
    <text x="0" y="474" fill="#A9A9B2" font-family="Inter, Arial, sans-serif" font-size="16">The open counter keeps it legible.</text>
    <text x="0" y="510" fill="#A9A9B2" font-family="Inter, Arial, sans-serif" font-size="16">The wedge pushes forward. The node</text>
    <text x="0" y="536" fill="#A9A9B2" font-family="Inter, Arial, sans-serif" font-size="16">makes the circle Orbin — not generic.</text>
  </g>

  <!-- Column 2: mark anatomy (self-contained, no overflow) -->
  <g transform="translate(520 280)">
    <rect width="500" height="360" rx="36" fill="#151519" stroke="#28282F"/>
    <text x="32" y="48" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">MARK ANATOMY</text>
    <circle cx="140" cy="200" r="100" fill="#0D0D11" stroke="#34343C"/>
    <g transform="translate(86 146)">
      <path fill="#FFFFFF" fill-rule="evenodd" d="M54,20 C35.22,20 20,35.22 20,54 C20,72.78 35.22,88 54,88 C69.13,88 81.95,78.12 86.36,64.47 L73.77,60.89 C70.93,69.02 63.19,74.85 54.08,74.85 C42.65,74.85 33.38,65.58 33.38,54.15 C33.38,42.72 42.65,33.45 54.08,33.45 C63.20,33.45 70.95,39.30 73.78,47.46 L86.37,43.89 C81.99,30.18 69.15,20.25 54,20.25 Z M54,43.2 C60.02,43.2 64.9,48.08 64.9,54.1 C64.9,60.12 60.02,65 54,65 C47.98,65 43.1,60.12 43.1,54.1 C43.1,48.08 47.98,43.2 54,43.2 Z"/>
      <path fill="#FFFFFF" d="M67.5,22.4 L91.2,15.8 L84.6,39.5 L79.2,31.9 L67.5,22.4 Z"/>
      <path fill="#FFFFFF" d="M87,47 A6,6 0,1 0,87,59 A6,6 0,1 0,87,47 Z"/>
    </g>
    <!-- Labels stacked in the right half with short copy -->
    <g transform="translate(270 110)">
      <circle cx="0" cy="0" r="4" fill="#FFFFFF"/>
      <line x1="8" y1="0" x2="40" y2="0" stroke="#555560" stroke-width="2"/>
      <text x="52" y="-6" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">Trajectory wedge</text>
      <text x="52" y="16" fill="#8F8F99" font-family="Inter, Arial, sans-serif" font-size="13">direction + speed</text>

      <circle cx="0" cy="78" r="4" fill="#FFFFFF"/>
      <line x1="8" y1="78" x2="40" y2="78" stroke="#555560" stroke-width="2"/>
      <text x="52" y="72" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">Broken orbit</text>
      <text x="52" y="94" fill="#8F8F99" font-family="Inter, Arial, sans-serif" font-size="13">readable O silhouette</text>

      <circle cx="0" cy="156" r="4" fill="#FFFFFF"/>
      <line x1="8" y1="156" x2="40" y2="156" stroke="#555560" stroke-width="2"/>
      <text x="52" y="150" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">Satellite node</text>
      <text x="52" y="172" fill="#8F8F99" font-family="Inter, Arial, sans-serif" font-size="13">detail at small sizes</text>
    </g>
  </g>

  <!-- Column 3: palette -->
  <g transform="translate(1060 280)">
    <rect width="444" height="360" rx="36" fill="#151519" stroke="#28282F"/>
    <text x="32" y="48" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">CORE PALETTE</text>
    <g transform="translate(32 84)">
      <rect width="112" height="112" rx="22" fill="#0D0D11" stroke="#34343C"/>
      <text x="0" y="140" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700">Orbit black</text>
      <text x="0" y="160" fill="#8F8F99" font-family="Inter, Arial, sans-serif" font-size="12">#0D0D11</text>

      <rect x="136" width="112" height="112" rx="22" fill="#171717" stroke="#34343C"/>
      <text x="136" y="140" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700">Icon field</text>
      <text x="136" y="160" fill="#8F8F99" font-family="Inter, Arial, sans-serif" font-size="12">#171717</text>

      <rect x="272" width="112" height="112" rx="22" fill="#212121" stroke="#34343C"/>
      <text x="272" y="140" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700">Surface</text>
      <text x="272" y="160" fill="#8F8F99" font-family="Inter, Arial, sans-serif" font-size="12">#212121</text>

      <rect y="196" width="380" height="64" rx="18" fill="#FFFFFF"/>
      <text x="24" y="236" fill="#0D0D11" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800">WHITE MARK · SYSTEM-TINT READY</text>
    </g>
  </g>

  <!-- Bottom row: small-size (left) + principles (right), clear of captions above -->
  <g transform="translate(96 850)">
    <text x="0" y="0" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">SMALL-SIZE BEHAVIOR</text>
    <!-- 144 -->
    <g transform="translate(0 24)">
      <rect width="144" height="144" rx="36" fill="#171717"/>
      <g transform="translate(18 18) scale(1.0)">
        <path fill="#FFFFFF" fill-rule="evenodd" d="M54,20 C35.22,20 20,35.22 20,54 C20,72.78 35.22,88 54,88 C69.13,88 81.95,78.12 86.36,64.47 L73.77,60.89 C70.93,69.02 63.19,74.85 54.08,74.85 C42.65,74.85 33.38,65.58 33.38,54.15 C33.38,42.72 42.65,33.45 54.08,33.45 C63.20,33.45 70.95,39.30 73.78,47.46 L86.37,43.89 C81.99,30.18 69.15,20.25 54,20.25 Z M54,43.2 C60.02,43.2 64.9,48.08 64.9,54.1 C64.9,60.12 60.02,65 54,65 C47.98,65 43.1,60.12 43.1,54.1 C43.1,48.08 47.98,43.2 54,43.2 Z"/>
      <path fill="#FFFFFF" d="M67.5,22.4 L91.2,15.8 L84.6,39.5 L79.2,31.9 L67.5,22.4 Z"/>
      <path fill="#FFFFFF" d="M87,47 A6,6 0,1 0,87,59 A6,6 0,1 0,87,47 Z"/>
      </g>
      <text x="0" y="148" fill="#8F8F99" font-family="Inter, Arial, sans-serif" font-size="13">144 px</text>
    </g>
    <!-- 96 centered in box -->
    <g transform="translate(160 36)">
      <rect width="96" height="96" rx="24" fill="#171717"/>
      <g transform="translate(0 0) scale(0.8889)">
        <path fill="#FFFFFF" fill-rule="evenodd" d="M54,20 C35.22,20 20,35.22 20,54 C20,72.78 35.22,88 54,88 C69.13,88 81.95,78.12 86.36,64.47 L73.77,60.89 C70.93,69.02 63.19,74.85 54.08,74.85 C42.65,74.85 33.38,65.58 33.38,54.15 C33.38,42.72 42.65,33.45 54.08,33.45 C63.20,33.45 70.95,39.30 73.78,47.46 L86.37,43.89 C81.99,30.18 69.15,20.25 54,20.25 Z M54,43.2 C60.02,43.2 64.9,48.08 64.9,54.1 C64.9,60.12 60.02,65 54,65 C47.98,65 43.1,60.12 43.1,54.1 C43.1,48.08 47.98,43.2 54,43.2 Z"/>
      <path fill="#FFFFFF" d="M67.5,22.4 L91.2,15.8 L84.6,39.5 L79.2,31.9 L67.5,22.4 Z"/>
      <path fill="#FFFFFF" d="M87,47 A6,6 0,1 0,87,59 A6,6 0,1 0,87,47 Z"/>
      </g>
      <text x="0" y="124" fill="#8F8F99" font-family="Inter, Arial, sans-serif" font-size="13">96 px</text>
    </g>
    <!-- 60 -->
    <g transform="translate(300 54)">
      <rect width="60" height="60" rx="15" fill="#171717"/>
      <g transform="translate(0 0) scale(0.5556)">
        <path fill="#FFFFFF" fill-rule="evenodd" d="M54,20 C35.22,20 20,35.22 20,54 C20,72.78 35.22,88 54,88 C69.13,88 81.95,78.12 86.36,64.47 L73.77,60.89 C70.93,69.02 63.19,74.85 54.08,74.85 C42.65,74.85 33.38,65.58 33.38,54.15 C33.38,42.72 42.65,33.45 54.08,33.45 C63.20,33.45 70.95,39.30 73.78,47.46 L86.37,43.89 C81.99,30.18 69.15,20.25 54,20.25 Z M54,43.2 C60.02,43.2 64.9,48.08 64.9,54.1 C64.9,60.12 60.02,65 54,65 C47.98,65 43.1,60.12 43.1,54.1 C43.1,48.08 47.98,43.2 54,43.2 Z"/>
      <path fill="#FFFFFF" d="M67.5,22.4 L91.2,15.8 L84.6,39.5 L79.2,31.9 L67.5,22.4 Z"/>
      <path fill="#FFFFFF" d="M87,47 A6,6 0,1 0,87,59 A6,6 0,1 0,87,47 Z"/>
      </g>
      <text x="0" y="88" fill="#8F8F99" font-family="Inter, Arial, sans-serif" font-size="13">60 px</text>
    </g>
  </g>

  <g transform="translate(560 850)">
    <text x="0" y="0" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">BRAND PRINCIPLES</text>
    <text x="0" y="40" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">01  Quiet confidence</text>
    <text x="0" y="64" fill="#8F8F99" font-family="Inter, Arial, sans-serif" font-size="14">Dark fields, strong contrast, no decorative noise.</text>
    <text x="0" y="104" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">02  Motion without chaos</text>
    <text x="0" y="128" fill="#8F8F99" font-family="Inter, Arial, sans-serif" font-size="14">Orbit as a directional cue — not a space costume.</text>
    <text x="520" y="40" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">03  Privacy by posture</text>
    <text x="520" y="64" fill="#8F8F99" font-family="Inter, Arial, sans-serif" font-size="14">The brand observes. It does not shout or post.</text>
  </g>

  <text x="96" y="1070" fill="#5F5F69" font-family="Inter, Arial, sans-serif" font-size="13">ORBIN BRAND SHOWCASE · PRIMARY MARK / MONOCHROME / ANDROID ADAPTIVE ICON SYSTEM</text>
</svg>
