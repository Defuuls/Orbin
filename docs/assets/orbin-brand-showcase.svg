  <text x="780" y="580" font-family="Inter, Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#3D5A80" letter-spacing="3">MARK</text>
  <text x="780" y="620" font-family="Inter, Arial, Helvetica, sans-serif" font-size="22" font-weight="600" fill="#E8E4DC">Aperture / lens iris</text>
  <text x="780" y="656" font-family="Inter, Arial, Helvetica, sans-serif" font-size="16" fill="#8B919C">Five geometric blades · open counter · white on Void</text>
  <text x="780" y="684" font-family="Inter, Arial, Helvetica, sans-serif" font-size="16" fill="#8B919C">No planets, stars, orbits, or gradients</text>

  <text x="780" y="748" font-family="Inter, Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#3D5A80" letter-spacing="3">PRINCIPLES</text>
  <text x="780" y="788" font-family="Inter, Arial, Helvetica, sans-serif" font-size="16" fill="#E8E4DC">Immersion first · Night by default · Rare heat · Quiet chrome</text>
  <text x="780" y="820" font-family="Inter, Arial, Helvetica, sans-serif" font-size="15" fill="#8B919C">See docs/brand.md for screen implications and usage.</text>
