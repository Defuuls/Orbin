<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Orbin brand showcase</title>
  <desc id="desc">Hero showcase of Orbin OPTIC-26 2026 industrial hardware redesign with machined instrument chassis, tactile switchboard deck, and spec-sheet cassettes.</desc>
  <defs>
    <!-- Vector aperture logo -->
    <g id="aperture-mark-vector" fill="#E8E4DC">
      <path d="M-18.74,-98.23 L-4.71,-99.89 L9.41,-99.56 L23.34,-97.24 L36.81,-92.98 L49.55,-86.86 L61.29,-79.02 L71.81,-69.59 L80.90,-58.78 L88.38,-46.79 L94.09,-33.87 L97.92,-20.28 L99.80,-6.28 L30.43,-9.89 Q21.63,-29.77 0.00,-32.00 Z"/>
      <path d="M87.63,-48.18 L93.54,-35.35 L97.59,-21.81 L99.69,-7.85 L99.80,6.28 L97.92,20.28 L94.09,33.87 L88.38,46.79 L80.90,58.78 L71.81,69.59 L61.29,79.02 L49.55,86.86 L36.81,92.98 L18.81,25.89 Q35.00,11.37 30.43,-9.89 Z"/>
      <path d="M72.90,68.45 L62.52,78.04 L50.90,86.07 L38.27,92.39 L24.87,96.86 L10.97,99.40 L-3.14,99.95 L-17.19,98.51 L-30.90,95.11 L-43.99,89.80 L-56.21,82.71 L-67.30,73.96 L-77.05,63.74 L-18.81,25.89 Q0.00,36.80 18.81,25.89 Z"/>
      <path d="M-42.58,90.48 L-54.90,83.58 L-66.13,75.01 L-76.04,64.94 L-84.43,53.58 L-91.14,41.15 L-96.03,27.90 L-99.00,14.09 L-100.00,0.00 L-99.00,-14.09 L-96.03,-27.90 L-91.14,-41.15 L-84.43,-53.58 L-30.43,-9.89 Q-35.00,11.37 -18.81,25.89 Z"/>
      <path d="M-99.21,-12.53 L-96.46,-26.39 L-91.78,-39.71 L-85.26,-52.25 L-77.05,-63.74 L-67.30,-73.96 L-56.21,-82.71 L-43.99,-89.80 L-30.90,-95.11 L-17.19,-98.51 L-3.14,-99.95 L10.97,-99.40 L24.87,-96.86 L-0.00,-32.00 Q-21.63,-29.77 -30.43,-9.89 Z"/>
    </g>
    <clipPath id="phone-clip">
      <rect x="1000" y="80" width="400" height="740" rx="40"/>
    </clipPath>
    <linearGradient id="grad-titanium" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#202431;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0D0F14;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad-cell1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E293B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0A0A0C;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad-cell2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#334155;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0F172A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad-cell3" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#475569;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#12141A;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background: Deep Void Industrial Grid -->
  <rect width="1600" height="900" fill="#0A0A0C"/>
  <!-- Hairline background technical grid -->
  <g stroke="#161820" stroke-width="1" opacity="0.6">
    <line x1="0" y1="150" x2="1600" y2="150"/>
    <line x1="0" y1="300" x2="1600" y2="300"/>
    <line x1="0" y1="450" x2="1600" y2="450"/>
    <line x1="0" y1="600" x2="1600" y2="600"/>
    <line x1="0" y1="750" x2="1600" y2="750"/>
    <line x1="200" y1="0" x2="200" y2="900"/>
    <line x1="500" y1="0" x2="500" y2="900"/>
    <line x1="800" y1="0" x2="800" y2="900"/>
    <line x1="1100" y1="0" x2="1100" y2="900"/>
    <line x1="1400" y1="0" x2="1400" y2="900"/>
  </g>

  <!-- Left Side: Industrial Identity & Technical Readout -->
  <g transform="translate(140, 140)">
    <!-- Chassis Badge -->
    <rect x="0" y="0" width="280" height="28" rx="2" fill="#12141A" stroke="#1C1E26" stroke-width="1"/>
    <circle cx="14" cy="14" r="3.5" fill="#22C55E"/>
    <text x="26" y="19" font-family="'JetBrains Mono', 'SF Mono', Consolas, monospace" font-size="11" font-weight="700" fill="#8B919C" letter-spacing="1.5">SYS:NOMINAL // OPTIC-26 CHASSIS</text>

    <!-- Logo & Product Wordmark -->
    <g transform="translate(0, 48)">
      <g transform="translate(0, 24) scale(0.48)">
        <use href="#aperture-mark-vector"/>
      </g>
      <text x="76" y="52" font-family="'Inter', -apple-system, sans-serif" font-size="56" font-weight="800" fill="#E8E4DC" letter-spacing="1">ORBIN</text>
      <rect x="290" y="24" width="76" height="24" rx="2" fill="#C45C26"/>
      <text x="328" y="40" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#FFFFFF" letter-spacing="1">2026</text>
    </g>

    <!-- Punchy Headline & Mission -->
    <text x="0" y="165" font-family="'Inter', -apple-system, sans-serif" font-size="34" font-weight="700" fill="#E8E4DC" letter-spacing="-0.5">Machined precision. Zero clutter. Pure telemetry.</text>
    <text x="0" y="206" font-family="'Inter', -apple-system, sans-serif" font-size="18" fill="#8B919C" line-height="1.5">Privacy-focused, read-only imageboard browser engineered with a 2026</text>
    <text x="0" y="232" font-family="'Inter', -apple-system, sans-serif" font-size="18" fill="#8B919C" line-height="1.5">industrial instrument chassis for Android &amp; iOS.</text>

    <!-- Architecture Spec Readouts -->
    <g transform="translate(0, 280)">
      <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#3D5A80" letter-spacing="2">HARDWARE SPECIFICATIONS</text>

      <!-- Spec Row 1 -->
      <g transform="translate(0, 20)">
        <rect x="0" y="0" width="700" height="42" rx="2" fill="#12141A" stroke="#1C1E26" stroke-width="1"/>
        <text x="16" y="26" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#E8E4DC">01 // INSTRUMENT HUD</text>
        <text x="260" y="26" font-family="'Inter', sans-serif" font-size="13" fill="#8B919C">Machined top bar with live telemetry &amp; optical aperture crosshairs</text>
      </g>

      <!-- Spec Row 2 -->
      <g transform="translate(0, 72)">
        <rect x="0" y="0" width="700" height="42" rx="2" fill="#12141A" stroke="#1C1E26" stroke-width="1"/>
        <text x="16" y="26" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#E8E4DC">02 // SPEC CASSETTES</text>
        <text x="260" y="26" font-family="'Inter', sans-serif" font-size="13" fill="#8B919C">CNC-milled baffles, hairline dividers &amp; 4-corner camera reticles</text>
      </g>

      <!-- Spec Row 3 -->
      <g transform="translate(0, 124)">
        <rect x="0" y="0" width="700" height="42" rx="2" fill="#12141A" stroke="#1C1E26" stroke-width="1"/>
        <text x="16" y="26" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#E8E4DC">03 // SWITCHBOARD DOCK</text>
        <text x="260" y="26" font-family="'Inter', sans-serif" font-size="13" fill="#8B919C">Flush tactile deck with [01 · 02 · 03] detents &amp; active LED bars</text>
      </g>

      <!-- Spec Row 4 -->
      <g transform="translate(0, 176)">
        <rect x="0" y="0" width="700" height="42" rx="2" fill="#12141A" stroke="#1C1E26" stroke-width="1"/>
        <text x="16" y="26" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#E8E4DC">04 // MECHANICAL BUS</text>
        <text x="260" y="26" font-family="'Inter', sans-serif" font-size="13" fill="#8B919C">Multi-lane thread reply trace, [OP // ORIGIN] beacon &amp; viewfinder HUD</text>
      </g>
    </g>

    <!-- Industrial Color Standard Swatches -->
    <g transform="translate(0, 540)">
      <text x="0" y="-14" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#3D5A80" letter-spacing="2">INDUSTRIAL COLOR STANDARD</text>
      <rect x="0" y="0" width="64" height="48" rx="2" fill="#0A0A0C" stroke="#1C1E26" stroke-width="1"/>
      <rect x="76" y="0" width="64" height="48" rx="2" fill="#12141A" stroke="#1C1E26" stroke-width="1"/>
      <rect x="152" y="0" width="64" height="48" rx="2" fill="#1C1E26" stroke="#2B2F3A" stroke-width="1"/>
      <rect x="228" y="0" width="64" height="48" rx="2" fill="#8B919C" stroke="#1C1E26" stroke-width="1"/>
      <rect x="304" y="0" width="64" height="48" rx="2" fill="#E8E4DC" stroke="#1C1E26" stroke-width="1"/>
      <rect x="380" y="0" width="64" height="48" rx="2" fill="#C45C26" stroke="#1C1E26" stroke-width="1"/>
      <rect x="456" y="0" width="64" height="48" rx="2" fill="#22C55E" stroke="#1C1E26" stroke-width="1"/>

      <text x="32" y="68" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#8B919C">VOID</text>
      <text x="108" y="68" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#8B919C">STAGE</text>
      <text x="184" y="68" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#8B919C">BAFFLE</text>
      <text x="260" y="68" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#8B919C">FOG</text>
      <text x="336" y="68" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#8B919C">BEAM</text>
      <text x="412" y="68" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#8B919C">EMBER</text>
      <text x="488" y="68" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#8B919C">SIGNAL</text>
    </g>
  </g>

  <!-- Right Side: Machined Titanium Device Chassis -->
  <rect x="980" y="68" width="440" height="764" rx="48" fill="#12141A" stroke="#2B2F3A" stroke-width="2.5"/>
  <rect x="996" y="84" width="408" height="732" rx="36" fill="#0A0A0C"/>

  <!-- Device Screen (Clipped) -->
  <g clip-path="url(#phone-clip)">
    <!-- Device Background -->
    <rect x="1000" y="80" width="400" height="740" fill="#0A0A0C"/>

    <!-- 1. Instrument Chassis Header (Item 1) -->
    <rect x="1000" y="80" width="400" height="88" fill="#12141A"/>
    <line x1="1000" y1="168" x2="1400" y2="168" stroke="#1C1E26" stroke-width="1.5"/>

    <!-- Telemetry Status Bar -->
    <rect x="1012" y="92" width="376" height="22" rx="2" fill="#0A0A0C" stroke="#1C1E26" stroke-width="1"/>
    <circle cx="1024" cy="103" r="3.5" fill="#22C55E"/>
    <text x="1034" y="107" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#E8E4DC">[CH-01 // INSTRUMENT]</text>
    <text x="1230" y="107" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600" fill="#8B919C">SIG:NOMINAL</text>
    <text x="1334" y="107" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#C45C26">[OPTIC-26]</text>

    <!-- Header Action Bay -->
    <g transform="translate(1012, 122)">
      <!-- Aperture mark -->
      <g transform="translate(14, 18) scale(0.16)">
        <use href="#aperture-mark-vector"/>
      </g>
      <text x="40" y="24" font-family="'Inter', sans-serif" font-size="20" font-weight="800" fill="#E8E4DC">FEED</text>

      <!-- Command search bay with optical reticle crosshair -->
      <rect x="130" y="4" width="246" height="30" rx="2" fill="#0A0A0C" stroke="#2B2F3A" stroke-width="1"/>
      <!-- Crosshair symbol -->
      <circle cx="148" cy="19" r="6" fill="none" stroke="#8B919C" stroke-width="1.2"/>
      <line x1="148" y1="10" x2="148" y2="28" stroke="#8B919C" stroke-width="1"/>
      <line x1="139" y1="19" x2="157" y2="19" stroke="#8B919C" stroke-width="1"/>
      <text x="162" y="23" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#8B919C">COMMAND // SIFT THREADS</text>
    </g>

    <!-- 2. Modular Spec-Sheet Cassettes (Item 2) -->
    <!-- Cassette 1 -->
    <g transform="translate(1012, 178)">
      <rect x="0" y="0" width="376" height="258" rx="2" fill="#12141A" stroke="#1C1E26" stroke-width="1"/>

      <!-- Cassette Spec Header -->
      <rect x="0" y="0" width="376" height="28" rx="2" fill="#161822"/>
      <line x1="0" y1="28" x2="376" y2="28" stroke="#1C1E26" stroke-width="1"/>
      <text x="10" y="18" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#E8E4DC">#276A3C2</text>
      <text x="82" y="18" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="600" fill="#3D5A80">[CH: /g/ - TECHNOLOGY]</text>
      <text x="312" y="18" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#8B919C">4m // TEL</text>
      <!-- Unread LED pip -->
      <circle cx="362" cy="14" r="3" fill="#C45C26"/>

      <!-- Viewfinder Media Frame with 4-Corner Reticles -->
      <g transform="translate(10, 36)">
        <rect x="0" y="0" width="356" height="132" rx="2" fill="url(#grad-cell1)"/>
        <!-- 4-Corner Viewfinder Reticles -->
        <!-- Top Left Reticle -->
        <path d="M6,16 L6,6 L16,6" stroke="#E8E4DC" stroke-width="1.8" fill="none"/>
        <!-- Top Right Reticle -->
        <path d="M340,6 L350,6 L350,16" stroke="#E8E4DC" stroke-width="1.8" fill="none"/>
        <!-- Bottom Left Reticle -->
        <path d="M6,116 L6,126 L16,126" stroke="#E8E4DC" stroke-width="1.8" fill="none"/>
        <!-- Bottom Right Reticle -->
        <path d="M350,116 L350,126 L340,126" stroke="#E8E4DC" stroke-width="1.8" fill="none"/>

        <!-- Viewfinder HUD Telemetry -->
        <rect x="12" y="12" width="132" height="18" rx="1" fill="#0A0A0C" opacity="0.8"/>
        <text x="18" y="24" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#22C55E">VIEWFINDER // RAW 16:9</text>
      </g>

      <!-- Post Body Text -->
      <text x="12" y="188" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#E8E4DC">Anyone else running a home server on ARM architecture?</text>
      <text x="12" y="206" font-family="'Inter', sans-serif" font-size="10.5" fill="#8B919C">Been running a small NAS cluster on custom milled ARM boards...</text>

      <!-- Cassette Spec-Sheet Footer -->
      <rect x="0" y="226" width="376" height="32" rx="2" fill="#0E1015"/>
      <line x1="0" y1="226" x2="376" y2="226" stroke="#1C1E26" stroke-width="1"/>
      <text x="12" y="246" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="600" fill="#8B919C">REPLIES: 218</text>
      <text x="110" y="246" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="600" fill="#8B919C">FILES: 31</text>
      <text x="190" y="246" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="600" fill="#8B919C">VOL: 142MB</text>
      <text x="320" y="246" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#22C55E">[SYNCED]</text>
    </g>

    <!-- Peeking Cassette 2 -->
    <g transform="translate(1012, 444)">
      <rect x="0" y="0" width="376" height="210" rx="2" fill="#12141A" stroke="#1C1E26" stroke-width="1"/>
      <rect x="0" y="0" width="376" height="28" rx="2" fill="#161822"/>
      <line x1="0" y1="28" x2="376" y2="28" stroke="#1C1E26" stroke-width="1"/>
      <text x="10" y="18" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#E8E4DC">#276B819</text>
      <text x="82" y="18" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="600" fill="#3D5A80">[CH: /p/ - PHOTO]</text>
      <text x="312" y="18" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#8B919C">12m // TEL</text>
      <circle cx="362" cy="14" r="3" fill="#2B2F3A"/>

      <g transform="translate(10, 36)">
        <rect x="0" y="0" width="356" height="110" rx="2" fill="url(#grad-cell2)"/>
        <path d="M6,16 L6,6 L16,6" stroke="#E8E4DC" stroke-width="1.8" fill="none"/>
        <path d="M340,6 L350,6 L350,16" stroke="#E8E4DC" stroke-width="1.8" fill="none"/>
        <path d="M6,94 L6,104 L16,104" stroke="#E8E4DC" stroke-width="1.8" fill="none"/>
        <path d="M350,94 L350,104 L340,104" stroke="#E8E4DC" stroke-width="1.8" fill="none"/>
      </g>
      <text x="12" y="168" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#E8E4DC">Tokyo night telemetry and 35mm long exposures</text>
    </g>

    <!-- 3. Hardware Switchboard Dock (Item 3) -->
    <!-- Flush-Pinned Tactile Switchboard Deck -->
    <g transform="translate(1000, 752)">
      <rect x="0" y="0" width="400" height="68" fill="#12141A"/>
      <line x1="0" y1="0" x2="400" y2="0" stroke="#1C1E26" stroke-width="1.5"/>

      <!-- Vertical Hairline Baffle Dividers -->
      <line x1="133" y1="0" x2="133" y2="68" stroke="#1C1E26" stroke-width="1"/>
      <line x1="267" y1="0" x2="267" y2="68" stroke="#1C1E26" stroke-width="1"/>

      <!-- Detent 01: FEED (Active) -->
      <g transform="translate(0, 0)">
        <!-- Active Illuminated Amber/Soft-Key LED Bar -->
        <rect x="36" y="0" width="60" height="3" fill="#C45C26"/>
        <text x="66" y="24" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#C45C26">01</text>
        <text x="66" y="44" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" fill="#E8E4DC" letter-spacing="1">FEED</text>
      </g>

      <!-- Detent 02: DOWNLOADS (Inactive) -->
      <g transform="translate(134, 0)">
        <text x="66" y="24" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#4B5563">02</text>
        <text x="66" y="44" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#8B919C" letter-spacing="1">DOWNLOADS</text>
      </g>

      <!-- Detent 03: BOARDS (Inactive) -->
      <g transform="translate(268, 0)">
        <text x="66" y="24" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#4B5563">03</text>
        <text x="66" y="44" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#8B919C" letter-spacing="1">BOARDS</text>
      </g>
    </g>
  </g>
</svg>
