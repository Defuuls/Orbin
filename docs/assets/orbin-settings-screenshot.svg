<svg width="1200" height="760" viewBox="0 0 1200 760" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Orbin settings screenshot</title>
  <desc id="desc">Screenshot-style Orbin 155 Ugli settings showing streamlined controls, theme and true black toggles, app lock, and in-app update checks.</desc>
  <rect width="1200" height="760" fill="#F6F7FB"/>

  <!-- Left logo card -->
  <rect x="120" y="140" width="260" height="420" rx="28" fill="#FFFFFF"/>
  <text x="148" y="188" font-family="Arial,sans-serif" font-size="28" font-weight="900" fill="#202431">Orbin</text>
  <text x="148" y="220" font-family="Arial,sans-serif" font-size="14" fill="#596171">Modern imageboard</text>
  <text x="148" y="242" font-family="Arial,sans-serif" font-size="14" fill="#596171">browser for Android</text>
  <rect x="148" y="268" width="132" height="32" rx="16" fill="#DCE6FF"/>
  <text x="214" y="289" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="800" fill="#274B9F">Version 155</text>
  <text x="148" y="336" font-family="Arial,sans-serif" font-size="13" fill="#596171">• Streamlined controls</text>
  <text x="148" y="364" font-family="Arial,sans-serif" font-size="13" fill="#596171">• True black &amp; App lock</text>
  <text x="148" y="392" font-family="Arial,sans-serif" font-size="13" fill="#596171">• In-app updates &amp; export</text>
  <text x="148" y="420" font-family="Arial,sans-serif" font-size="13" fill="#596171">• Cover violent media</text>
  <text x="148" y="472" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#3157B8">Ugli release</text>

  <!-- Phone frame (x 412–788, centered) -->
  <rect x="412" y="36" width="376" height="688" rx="36" fill="#15161B"/>
  <rect x="424" y="48" width="352" height="664" rx="28" fill="#FAFBFF"/>

  <defs>
    <clipPath id="settings-screen-clip">
      <rect x="424" y="48" width="352" height="664" rx="28"/>
    </clipPath>
  </defs>

  <g clip-path="url(#settings-screen-clip)">
    <!-- App bar -->
    <rect x="424" y="48" width="352" height="64" fill="#FAFBFF"/>
    <text x="448" y="92" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#1D2233">Settings</text>

    <!-- Card 1: Preferences & Appearance -->
    <rect x="444" y="112" width="312" height="216" rx="20" fill="#F4F5FA"/>

    <!-- Row 1: Hide NSFW boards -->
    <text x="464" y="144" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#1D2233">Hide NSFW boards</text>
    <rect x="694" y="130" width="44" height="24" rx="12" fill="#5C606E"/>
    <circle cx="706" cy="142" r="8" fill="#FAFBFF"/>
    <line x1="464" y1="166" x2="738" y2="166" stroke="#E4E7F0" stroke-width="1"/>

    <!-- Row 2: Theme -->
    <text x="464" y="196" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#1D2233">Theme</text>
    <text x="738" y="196" text-anchor="end" font-family="Arial,sans-serif" font-size="13" fill="#5A6272">System</text>
    <line x1="464" y1="218" x2="738" y2="218" stroke="#E4E7F0" stroke-width="1"/>

    <!-- Row 3: True black -->
    <text x="464" y="248" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#1D2233">True black</text>
    <rect x="694" y="234" width="44" height="24" rx="12" fill="#5C606E"/>
    <circle cx="706" cy="246" r="8" fill="#FAFBFF"/>
    <line x1="464" y1="270" x2="738" y2="270" stroke="#E4E7F0" stroke-width="1"/>

    <!-- Row 4: App lock -->
    <text x="464" y="300" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#1D2233">App lock</text>
    <rect x="694" y="286" width="44" height="24" rx="12" fill="#5C606E"/>
    <circle cx="706" cy="298" r="8" fill="#FAFBFF"/>

    <!-- Card 2: Privacy, Cache & Updates -->
    <rect x="444" y="344" width="312" height="328" rx="20" fill="#F4F5FA"/>

    <!-- Row 1: Clear local activity -->
    <text x="464" y="374" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#1D2233">Clear local activity</text>
    <text x="464" y="394" font-family="Arial,sans-serif" font-size="11" fill="#717A8C">Deletes browsing history, recent searches and</text>
    <text x="464" y="410" font-family="Arial,sans-serif" font-size="11" fill="#717A8C">download history on this device.</text>
    <text x="738" y="394" text-anchor="end" font-family="Arial,sans-serif" font-size="13" font-weight="600" fill="#274B9F">Delete</text>
    <line x1="464" y1="424" x2="738" y2="424" stroke="#E4E7F0" stroke-width="1"/>

    <!-- Row 2: Clear image cache -->
    <text x="464" y="454" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#1D2233">Clear image cache</text>
    <text x="738" y="454" text-anchor="end" font-family="Arial,sans-serif" font-size="13" fill="#274B9F">12 MB · Clear</text>
    <line x1="464" y1="474" x2="738" y2="474" stroke="#E4E7F0" stroke-width="1"/>

    <!-- Row 3: Check for updates -->
    <text x="464" y="504" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#1D2233">Check for updates</text>
    <text x="738" y="504" text-anchor="end" font-family="Arial,sans-serif" font-size="13" fill="#5A6272">Up to date</text>
    <line x1="464" y1="524" x2="738" y2="524" stroke="#E4E7F0" stroke-width="1"/>

    <!-- Row 4: Export data -->
    <text x="464" y="554" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#1D2233">Export data</text>
    <text x="738" y="554" text-anchor="end" font-family="Arial,sans-serif" font-size="13" font-weight="600" fill="#274B9F">Save</text>
    <line x1="464" y1="574" x2="738" y2="574" stroke="#E4E7F0" stroke-width="1"/>

    <!-- Row 5: Import data -->
    <text x="464" y="604" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#1D2233">Import data</text>
    <text x="738" y="604" text-anchor="end" font-family="Arial,sans-serif" font-size="13" font-weight="600" fill="#274B9F">Restore</text>
  </g>

  <!-- Right callouts -->
  <rect x="824" y="140" width="240" height="150" rx="24" fill="#FFFFFF"/>
  <circle cx="862" cy="174" r="14" fill="#EDF1FF"/>
  <path d="M862 167v10m-3-3l3 3 3-3" stroke="#274B9F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="844" y="210" font-family="Arial,sans-serif" font-size="17" font-weight="800" fill="#202431">In-app updates</text>
  <text x="844" y="234" font-family="Arial,sans-serif" font-size="13" fill="#596171">Signed APK download</text>
  <text x="844" y="254" font-family="Arial,sans-serif" font-size="13" fill="#596171">with SHA-256 validation</text>
  <rect x="844" y="266" width="96" height="26" rx="13" fill="#DCE6FF"/>
  <text x="892" y="283" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#274B9F">Verified</text>

  <rect x="824" y="324" width="240" height="150" rx="24" fill="#FFFFFF"/>
  <circle cx="862" cy="358" r="14" fill="#EDF1FF"/>
  <rect x="856" y="356" width="12" height="10" rx="2" fill="#274B9F"/>
  <path d="M858 356v-3a4 4 0 0 1 8 0v3" stroke="#274B9F" stroke-width="2" fill="none"/>
  <text x="844" y="394" font-family="Arial,sans-serif" font-size="17" font-weight="800" fill="#202431">Privacy controls</text>
  <text x="844" y="418" font-family="Arial,sans-serif" font-size="13" fill="#596171">Biometric app lock &amp;</text>
  <text x="844" y="438" font-family="Arial,sans-serif" font-size="13" fill="#596171">encrypted local storage</text>
  <rect x="844" y="450" width="144" height="26" rx="13" fill="#E8F6EF"/>
  <text x="916" y="467" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#226642">Keystore protected</text>
</svg>
