<text x="20" y="28" font-size="14" font-weight="700" class="d-head">Shared cell: catalog row and post</text>
<text x="20" y="46" font-size="12" class="d-note">Both are the same cell: gutter, optional thumbnail, gap, text column. A catalog row adds the count pill. Drawn at 1.5 px per dp, phone sizes.</text>
