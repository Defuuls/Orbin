<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 964 384" width="964" height="384" role="img" class="d-root">
<title>States</title>
<desc>Four state panels: a loading catalog with skeleton rows and a progress bar, an empty catalog with a Reload action, an error state with a Retry action, and the empty thread pane that reads Select a thread.</desc>
<style>.d-root text{font-family:Roboto, 'Helvetica Neue', Arial, sans-serif}.d-f-appBar{fill:#2E7D32}.d-s-appBar{stroke:#2E7D32}.d-f-onAppBar{fill:#FFFFFF}.d-s-onAppBar{stroke:#FFFFFF}.d-f-background{fill:#FFFFFF}.d-s-background{stroke:#FFFFFF}.d-f-surfaceVariant{fill:#F1F3F4}.d-s-surfaceVariant{stroke:#F1F3F4}.d-f-selected{fill:#E8F5E9}.d-s-selected{stroke:#E8F5E9}.d-f-ink{fill:#1F1F1F}.d-s-ink{stroke:#1F1F1F}.d-f-inkMuted{fill:#5F6368}.d-s-inkMuted{stroke:#5F6368}.d-f-hairline{fill:#DADCE0}.d-s-hairline{stroke:#DADCE0}.d-f-accent{fill:#00796B}.d-s-accent{stroke:#00796B}.d-f-onAccent{fill:#FFFFFF}.d-s-onAccent{stroke:#FFFFFF}.d-f-quote{fill:#2E7D32}.d-s-quote{stroke:#2E7D32}.d-f-author{fill:#117743}.d-s-author{stroke:#117743}.d-f-quoteLink{fill:#0B57D0}.d-s-quoteLink{stroke:#0B57D0}.d-f-error{fill:#B3261E}.d-s-error{stroke:#B3261E}.d-paper{fill:#FFFFFF}.d-frame{stroke:#1F1F1F;fill:none}.d-dim{stroke:#0B57D0;fill:none}.d-dimtext{fill:#0B57D0}.d-note{fill:#5F6368}.d-head{fill:#1F1F1F}@media (prefers-color-scheme:dark){.d-f-appBar{fill:#1E1E1E}.d-s-appBar{stroke:#1E1E1E}.d-f-onAppBar{fill:#E8EAED}.d-s-onAppBar{stroke:#E8EAED}.d-f-background{fill:#121212}.d-s-background{stroke:#121212}.d-f-surfaceVariant{fill:#2A2A2A}.d-s-surfaceVariant{stroke:#2A2A2A}.d-f-selected{fill:#1B3A1F}.d-s-selected{stroke:#1B3A1F}.d-f-ink{fill:#E8EAED}.d-s-ink{stroke:#E8EAED}.d-f-inkMuted{fill:#BDC1C6}.d-s-inkMuted{stroke:#BDC1C6}.d-f-hairline{fill:#3C4043}.d-s-hairline{stroke:#3C4043}.d-f-accent{fill:#80CBC4}.d-s-accent{stroke:#80CBC4}.d-f-onAccent{fill:#003731}.d-s-onAccent{stroke:#003731}.d-f-quote{fill:#81C784}.d-s-quote{stroke:#81C784}.d-f-author{fill:#81C784}.d-s-author{stroke:#81C784}.d-f-quoteLink{fill:#A8C7FA}.d-s-quoteLink{stroke:#A8C7FA}.d-f-error{fill:#F2B8B5}.d-s-error{stroke:#F2B8B5}.d-paper{fill:#121212}.d-frame{stroke:#E8EAED;fill:none}.d-dim{stroke:#A8C7FA;fill:none}.d-dimtext{fill:#A8C7FA}.d-note{fill:#BDC1C6}.d-head{fill:#E8EAED}}</style>
<rect class="d-paper" x="0" y="0" width="964" height="384"/>
<text x="20" y="28" font-size="14" font-weight="700" class="d-head">States</text>
<text x="20" y="46" font-size="12" class="d-note">Catalog loading, empty and error, and the thread pane before a thread is chosen. Drawn at 0.6 px per dp.</text>
