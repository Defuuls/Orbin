lass="d-f-surfaceVariant"/><rect x="100" y="292" width="160" height="14" rx="4" class="d-f-surfaceVariant"/><rect x="100" y="316" width="110" height="10" rx="4" class="d-f-surfaceVariant"/><rect x="100" y="336" width="140" height="12" rx="4" class="d-f-surfaceVariant"/><rect x="0" y="371" width="360" height="1" class="d-f-hairline"/><rect x="16" y="384" width="72" height="72" rx="4" class="d-f-surfaceVariant"/><rect x="100" y="388" width="160" height="14" rx="4" class="d-f-surfaceVariant"/><rect x="100" y="412" width="110" height="10" rx="4" class="d-f-surfaceVariant"/><rect x="100" y="432" width="140" height="12" rx="4" class="d-f-surfaceVariant"/><rect x="0" y="467" width="360" height="1" class="d-f-hairline"/></g></g><rect class="d-frame" x="19.5" y="69.5" width="217" height="253" stroke-width="1"/>
<text x="20" y="346" font-size="12" font-weight="700" class="d-note">Loading</text>
<text x="20" y="364" font-size="12" class="d-note">Skeleton rows; 4 dp progress bar</text>
<g transform="translate(256 70) scale(0.6)"><clipPath id="st-empty"><rect x="0" y="0" width="360" height="420"/></clipPath><g clip-path="url(#st-empty)"><rect x="0" y="0" width="360" height="420" class="d-f-background"/><rect x="0" y="0" width="360" height="24" class="d-f-appBar"/><text x="16" y="17" font-size="12" font-weight="500" class="d-f-onAppBar">12:34</text><rect x="0" y="24" width="360" height="56" class="d-f-appBar"/><g transform="translate(16 40)"><path d="M3 7h18M3 12h18M3 17h18" stroke-width="2" class="d-s-onAppBar" fill="none"/></g><text x="72" y="59" font-size="20" font-weight="500" class="d-f-onAppBar">Technology</text><g transform="translate(180 41)"><path d="M7 10l5 5l5-5z" class="d-f-onAppBar"/></g><g transform="translate(272 40)"><path d="M19 12a7 7 0 1 1-2.050-4.950M19 4v4h-4" stroke-width="2" class="d-s-onAppBar" fill="none"/></g><g transform="translate(320 40)"><path d="M17 10.500a6.500 6.500 0 1 1-13 0a6.500 6.500 0 0 1 13 0zM15.500 15.500L21 21" stroke-width="2" class="d-s-onAppBar" fill="none"/></g><text x="180" y="230" font-size="24" text-anchor="middle" class="d-f-ink">No threads here</text><text x="180" y="262" font-size="16" text-anchor="middle" class="d-f-inkMuted">This board has nothing to show yet.</text><text x="180" y="308" font-size="14" font-weight="500" text-anchor="middle" class="d-f-accent">Reload</text></g></g><rect class="d-frame" x="255.5" y="69.5" width="217" height="253" stroke-width="1"/>
<text x="256" y="346" font-size="12" font-weight="700" class="d-note">Empty</text>
<text x="256" y="364" font-size="12" class="d-note">Title, helper line, Reload</text>
<g transform="translate(492 70) scale(0.6)"><clipPath id="st-error"><rect x="0" y="0" width="360" height="420"/></clipPath><g clip-path="url(#st-error)"><rect x="0" y="0" width="360" height="420" class="d-f-background"/><rect x="0" y="0" width="360" height="24" class="d-f-appBar"/><text x="16" y="17" font-size="12" font-weight="500" class="d-f-onAppBar">12:34</text><rect x="0" y="24" width="360" height="56" class="d-f-appBar"/><g transform="translate(16 40)"><path d="M3 7h18M3 12h18M3 17h18" stroke-width="2" class="d-s-onAppBar" fill="none"/></g><text x="72" y="59" font-size="20" font-weight="500" class="d-f-onAppBar">Technology</text><g transform="translate(180 41)"><path d="M7 10l5 5l5-5z" class="d-f-onAppBar"/></g><g transform="translate(272 40)"><path d="M19 12a7 7 0 1 1-2.050-4.950M19 4v4h-4" stroke-width="2" class="d-s-onAppBar" fill="none"/></g><g transform="translate(320 40)"><path d="M17 10.500a6.500 6.500 0 1 1-13 0a6.500 6.500 0 0 1 13 0zM15.500 15.500L21 21" stroke-width="2" class="d-s-onAppBar" fill="none"/></g><text x="180" y="230" font-size="24" text-anchor="middle" class="d-f-error">Network error</text><text x="180" y="262" font-size="16" text-anchor="middle" class="d-f-inkMuted">Check your connection and try again.</text><text x="180" y="308" font-size="14" font-weight="500" text-anchor="middle" class="d-f-accent">Retry</text></g></g><rect class="d-frame" x="491.5" y="69.5" width="217" height="253" stroke-width="1"/>
<text x="492" y="346" font-size="12" font-weight="700" class="d-note">Error</text>
<text x="492" y="364" font-size="12" class="d-note">Cause as title, helper line, Retry</text>
<g transform="translate(728 70) scale(0.6)"><clipPath id="st-pane"><rect x="0" y="0" width="360" height="420"/></clipPath><g clip-path="url(#st-pane)"><rect x="0" y="0" width="360" height="420" class="d-f-background"/><rect x="0" y="0" width="360" height="80" class="d-f-appBar"/><text x="180" y="250" font-size="16" text-anchor="middle" class="d-f-inkMuted">Select a thread</text></g></g><rect class="d-frame" x="727.5" y="69.5" width="217" height="253" stroke-width="1"/>
<text x="728" y="346" font-size="12" font-weight="700" class="d-note">Empty thread pane</text>
<text x="728" y="364" font-size="12" class="d-note">Two panes, nothing open</text>
</svg>
