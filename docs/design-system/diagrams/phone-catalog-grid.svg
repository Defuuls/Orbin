<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 794" width="640" height="794" role="img" class="d-root">
<title>Phone catalog, grid mode</title>
<desc>Dimensioned schematic of the catalog grid on a 360 dp wide phone: three columns of cards separated by 4 dp gaps, each card a square image above a 76 dp text block with a two-line title and a reply count.</desc>
