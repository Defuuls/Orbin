<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 794" width="640" height="794" role="img" class="d-root">
<title>Phone catalog, list mode</title>
<desc>Dimensioned schematic of the catalog list on a 360 by 640 dp phone: 24 dp status bar, 56 dp app bar, 96 dp rows with a 72 dp thumbnail, title, post number and date, quoted preview and a reply count pill.</desc>
