# XcodeGen spec for the iOS app. The .xcodeproj is generated from this file and not committed:
#
#   brew install xcodegen && xcodegen --spec iosApp/project.yml
#
# then open iosApp/Orbin.xcodeproj. See docs/ios.md.
name: Orbin
packages:
  OrbinFFmpegNative:
    path: Packages/OrbinFFmpegNative
options:
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    # Overridden by the TestFlight workflow from gradle.properties, so both platforms ship the
    # same release number.
    MARKETING_VERSION: "1"
    CURRENT_PROJECT_VERSION: "1"
    # The whole Android release name ("158-Yuzu"), which MARKETING_VERSION cannot hold: Apple takes
    # only numbers there. The TestFlight workflow sets it; Settings › Version shows it.
    ORBIN_VERSION_NAME: ""
    # Bundle ids are unique across the whole App Store; pass your own with
    # `xcodebuild ... ORBIN_BUNDLE_ID=...` or change it here.
    ORBIN_BUNDLE_ID: io.github.defuuls.orbin
    # Your Apple Developer team, for signing. Empty builds for the simulator only.
    ORBIN_TEAM_ID: ""
    # Set only after the team's matching iCloud container and production OrbinItem schema exist.
    # Non-entitled installations keep using local storage; the runtime checks both signatures.
    ORBIN_CLOUD_ENTITLEMENTS: ""
targets:
  Orbin:
    type: application
    platform: iOS
    sources:
      - Orbin
    dependencies:
      - package: OrbinFFmpegNative
        product: OrbinFFmpegNative
    info:
      path: Orbin/Info.plist
      properties:
        CFBundleDisplayName: Orbin
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        OrbinVersionName: $(ORBIN_VERSION_NAME)
        # The app delegate creates each window with the status-bar-aware Compose container as root.
        UIViewControllerBasedStatusBarAppearance: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Orbin
        # Solid brand ground + centered app mark while Kotlin/Compose loads.
        # LaunchMark is derived from AppIcon (no separate designer artwork); regenerate Xcode with xcodegen.
        UILaunchScreen:
          UIColorName: LaunchScreenBackground
          UIImageName: LaunchMark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # iPad takes every orientation, which Split View and Stage Manager also need.
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Compose drives ProMotion displays at their full rate only with this set: 120Hz on an iPhone
        # Pro; an iPad Pro (the M4 11-inch included) runs at its full rate regardless.
        CADisableMinimumFrameDurationOnPhone: true
        # Networking uses operating-system cryptography providers.
        ITSAppUsesNonExemptEncryption: false
        # Shown the first time the app lock asks for Face ID.
        NSFaceIDUsageDescription: Orbin uses Face ID to unlock when App lock is on.
        # Orbin has no camera feature. The bundled FFmpeg links AVFoundation's capture classes (its
        # avfoundation input device), and App Store Connect rejects a binary that references them
        # without this string (ITMS-90683). scripts/prepare_ios_purpose_strings.py checks every archive.
        NSCameraUsageDescription: Orbin does not use the camera. Its bundled video converter includes camera support that Orbin never turns on.
        # Asked the first time a photo or video is saved from a thread; add-only, never read.
        # A background refresh of watched threads, as Android's watch worker; the Kotlin side
        # registers REFRESH_TASK in BackgroundRefresh.kt.
        # Home-screen quick actions, as Android's app shortcuts; QuickActions.kt opens each tab.
        UIApplicationShortcutItems:
          - UIApplicationShortcutItemType: io.github.defuuls.orbin.feed
            UIApplicationShortcutItemTitle: Your Feed
            UIApplicationShortcutItemIconSymbolName: list.bullet
          - UIApplicationShortcutItemType: io.github.defuuls.orbin.downloads
            UIApplicationShortcutItemTitle: Saved Media
            UIApplicationShortcutItemIconSymbolName: arrow.down.circle
          - UIApplicationShortcutItemType: io.github.defuuls.orbin.boards
            UIApplicationShortcutItemTitle: Browse Boards
            UIApplicationShortcutItemIconSymbolName: square.grid.2x2
        # audio: a playing video carries on in picture in picture after leaving the app (Player.ios.kt).
        UIBackgroundModes:
          - fetch
          - audio
        BGTaskSchedulerPermittedIdentifiers:
          - io.github.defuuls.orbin.refresh
        NSPhotoLibraryAddUsageDescription: Orbin saves the photos and videos you choose to your library.
        # Other saved files (WebM, audio) live in the app's Documents folder; these show it in Files.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ORBIN_BUNDLE_ID)
        DEVELOPMENT_TEAM: $(ORBIN_TEAM_ID)
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: $(ORBIN_CLOUD_ENTITLEMENTS)
        # iPhone and iPad: the shared screens size themselves to the window.
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        # The Kotlin framework the build phase below produces.
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../app-ios/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        # AVKit and AVFoundation are the media viewer's player and WebKit its WebM player, Photos is
        # where saved photos go, UniformTypeIdentifiers names the backup file type, BackgroundTasks and
        # UserNotifications refresh watched threads and post their new replies;
        # named so the static framework's system dependencies never rest on autolinking alone.
        OTHER_LDFLAGS: $(inherited) -framework OrbinKit -framework AVKit -framework AVFoundation -framework Photos -framework UniformTypeIdentifiers -framework WebKit -framework BackgroundTasks -framework UserNotifications
        # The Gradle build writes outside the sandbox Xcode gives script phases.
        ENABLE_USER_SCRIPT_SANDBOXING: false
        # The Kotlin framework is built for Apple silicon simulators only (iosSimulatorArm64), so
        # the simulator build must not ask for an Intel slice.
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
    preBuildScripts:
      - name: Build OrbinKit (Kotlin)
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :app-ios:embedAndSignAppleFrameworkForXcode
  OrbinNativeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - OrbinNativeTests
    dependencies:
      - target: Orbin
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ORBIN_BUNDLE_ID).nativetests
        GENERATE_INFOPLIST_FILE: YES
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../app-ios/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        SWIFT_VERSION: "5.0"
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
  OrbinUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - OrbinUITests
    dependencies:
      - target: Orbin
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ORBIN_BUNDLE_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Orbin
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
schemes:
  Orbin:
    build:
      targets:
        Orbin: all
    run:
      config: Debug
    test:
      config: Debug
      language: en
      region: US
      targets:
        - OrbinNativeTests
        - OrbinUITests
    archive:
      config: Release
